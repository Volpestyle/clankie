AWSTemplateFormatVersion: "2010-09-09"
Description: Clankie accounts — passwordless email OTP identity for Mac enrollment

Parameters:
  SendingDomain:
    Type: String
    Default: clankie.bot
    Description: Domain identity owned by this stack for production account mail
  SelfSignUpEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Permit any verified email to create an account; keep false for the invited beta
  EmailSourceIdentity:
    Type: String
    Description: Verified Amazon SES email or domain identity used for passwordless OTP mail
  EmailFrom:
    Type: String
    Description: From address covered by EmailSourceIdentity
  AlarmEmail:
    Type: String
    AllowedPattern: "^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$"
    Description: Address that receives the SES send-volume alarm
  SendAlarmThresholdPerHour:
    Type: Number
    Default: 200
    MinValue: 1
    Description: SES sends in one hour above which the alarm fires (the pool sends one OTP per sign-in)

Conditions:
  SelfSignUpIsDisabled: !Equals [!Ref SelfSignUpEnabled, "false"]

Resources:
  SendingIdentity:
    Type: AWS::SES::EmailIdentity
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      EmailIdentity: !Ref SendingDomain
      DkimAttributes:
        SigningEnabled: true

  AccountUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: clankie-accounts
      UserPoolTier: ESSENTIALS
      DeletionProtection: ACTIVE
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      MfaConfiguration: "OFF"
      Policies:
        SignInPolicy:
          AllowedFirstAuthFactors:
            # Cognito's CreateUserPool currently rejects EMAIL_OTP unless PASSWORD is also present.
            # Clankie creates users without passwords and requests only EMAIL_OTP.
            - PASSWORD
            - EMAIL_OTP
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: !If [SelfSignUpIsDisabled, true, false]
      EmailConfiguration:
        EmailSendingAccount: DEVELOPER
        SourceArn: !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${EmailSourceIdentity}
        From: !Sub Clankie <${EmailFrom}>

  MacClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: clankie-mac
      UserPoolId: !Ref AccountUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 90
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      RefreshTokenRotation:
        Feature: ENABLED
        RetryGracePeriodSeconds: 60

  SendAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: clankie-accounts-alarms
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmEmail

  # SES publishes account-level Send/Bounce/Complaint metrics without dimensions.
  # One hourly sum bounds a runaway or abused sign-in loop before self-signup opens.
  SendVolumeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: clankie-accounts-ses-send-volume
      AlarmDescription: Amazon SES sends in the last hour exceeded the expected sign-in volume
      Namespace: AWS/SES
      MetricName: Send
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: !Ref SendAlarmThresholdPerHour
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SendAlarmTopic

Outputs:
  SendVolumeAlarm:
    Value: !Ref SendVolumeAlarm
  SendingDomain:
    Value: !Ref SendingIdentity
  SendingIdentityArn:
    Value: !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${SendingIdentity}
  DkimName1:
    Value: !GetAtt SendingIdentity.DkimDNSTokenName1
  DkimValue1:
    Value: !GetAtt SendingIdentity.DkimDNSTokenValue1
  DkimName2:
    Value: !GetAtt SendingIdentity.DkimDNSTokenName2
  DkimValue2:
    Value: !GetAtt SendingIdentity.DkimDNSTokenValue2
  DkimName3:
    Value: !GetAtt SendingIdentity.DkimDNSTokenName3
  DkimValue3:
    Value: !GetAtt SendingIdentity.DkimDNSTokenValue3
  UserPoolId:
    Value: !Ref AccountUserPool
  ClientId:
    Value: !Ref MacClient
  Endpoint:
    Value: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com
  Issuer:
    Value: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${AccountUserPool}
  SelfSignUpEnabled:
    Value: !Ref SelfSignUpEnabled
