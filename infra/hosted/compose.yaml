# Use a distinct Compose project per owner; its volumes and network stay separate.
# One container runs the whole body under the launcher (Clankie and its relay),
# so the body can install official releases itself (ADR 0237).
services:
  captain:
    image: clankie-hosted:local
    build:
      context: ../..
      dockerfile: scripts/release/clankie-linux.Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    volumes:
      - state:/state
      - workspace:/workspace
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "curl -fsS -o /dev/null --max-time 5 http://127.0.0.1:4310/health && curl -fsS -o /dev/null --max-time 5 http://127.0.0.1:4321/health",
        ]
    # No host ports, host home, or Docker socket. Use exec/SSH or the outbound gateway.

volumes:
  state:
  workspace:
