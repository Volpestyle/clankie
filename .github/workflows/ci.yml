name: CI
# Every pull request push gets the quick `check` job, and a merge waits on it
# and the worker's own local checks (ADR 0347). The landing gate (typecheck and
# the test files a change edits), the tests it reaches through its imports and
# the real-app run run on main after the merge (`landing`, `checkpoint`, `mac`
# and `real-run`), and the whole suite runs nightly: checkpoints, not waits
# (ADR 0310). A red main job files a `ci-finding` issue (scripts/ci-finding.mjs).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Main checkpoints finish; only superseded pull request runs are cancelled.
  # GitHub keeps one pending main run, replacing it when a newer push arrives,
  # so a burst of merges runs the main jobs once more, on the newest tip.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 60 || 30 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.7.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88.0
        if: github.event_name == 'workflow_dispatch'
        with:
          components: clippy, rustfmt
      - run: brew install cmake
        if: github.event_name == 'workflow_dispatch'
      - run: pnpm install --frozen-lockfile
      # Swallowed rejections are checked against the pull request's base here, so
      # a new one fails before the merge instead of turning main's landing red (#632).
      - name: Fast formatting and lint
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          pnpm exec oxfmt --check .
          pnpm exec oxlint --deny-warnings .
          node scripts/check-retired-claims.mjs
          node scripts/check-chromium-sandbox.mjs
          node scripts/check-swallowed-rejections.mjs ${BASE:+"$BASE"}
      # No new proof folders, no search-flooding lines, a lean AGENTS.md.
      - name: Docs hygiene
        if: github.event_name != 'workflow_dispatch'
        run: node scripts/check-docs-hygiene.mjs
      - name: Strict native MCP catalog contracts
        if: github.event_name != 'workflow_dispatch'
        run: pnpm mcp:check
      - name: Controlled fleet admission fixtures
        if: github.event_name != 'workflow_dispatch'
        run: pnpm check:fleet-test-pressure
      - name: Real test dependencies (ffmpeg, pinned Herdr)
        if: github.event_name == 'workflow_dispatch'
        run: |
          brew install ffmpeg
          pnpm herdr:build
          echo "$PWD/.data/herdr/bin" >> "$GITHUB_PATH"
      - name: Native process observation on this runner
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: /usr/bin/python3 -I packages/fleet-resources/src/native.py identity $$
      - name: Full check with one isolated failed-file rerun
        run: node scripts/check-release.mjs
        if: github.event_name == 'workflow_dispatch'
      - name: Manual fleet load gate
        if: github.event_name == 'workflow_dispatch'
        run: pnpm check:load
      - run: pnpm --filter @clankie/vox build
        if: github.event_name == 'workflow_dispatch'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: qa-results
          include-hidden-files: true
          path: |
            .data/qa/
            .local/typechecks/
          retention-days: 7
  # The landing gate's checks on GitHub's free Linux runner for every push to
  # main, after the merge (ADR 0240, ADR 0332): skills, format, lint with Vox's cargo checks, deadcode,
  # doc links, swallowed rejections, docs hygiene, the scoped typecheck and the
  # changed-test selection. Tests Linux skips (macOS-only) stay on the owner's
  # Mac. Exit 3 is green checks waiting for the standing reviewer (ADR 0287),
  # which needs the owner's operator credential and never answers here. A red run
  # files a `ci-finding` issue, not a gate; nothing waits on it.
  landing:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.7.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88.0
        with:
          components: clippy, rustfmt
      # Vox's turbojpeg-sys builds libjpeg-turbo's SIMD code with NASM; the activity-sharing
      # tests decode real MP4 and GIF media with ffmpeg; the seat-command tests resolve
      # numbered Claude commands through a real zsh login shell.
      - run: sudo apt-get install -y --no-install-recommends nasm ffmpeg zsh
      # The cargo cache the vox-cache job saves on main.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/vox/target
          key: landing-cargo-${{ runner.os }}-${{ hashFiles('apps/vox/Cargo.lock') }}
          restore-keys: landing-cargo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # Compiler state the typecheck-cache job saved on main, so the typecheck
      # rechecks only what changed since (ADR 0310).
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .local/tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-main-${{ github.sha }}
          restore-keys: tsbuildinfo-${{ runner.os }}-main-
      # The gate's skills phase installs the pinned Herdr here; tests spawn it by name.
      - run: echo "$PWD/.data/herdr/bin" >> "$GITHUB_PATH"
      - name: Landing gate checks against main before the push
        env:
          BEFORE: ${{ github.event.before }}
          # Four vCPUs and 16 GB fit three 2.5 GiB compiler heaps at once.
          CLANKIE_TYPECHECK_JOBS: 3
          # A complete run report: unhandled errors and unfinished files count against it.
          CLANKIE_RELEASE_TEST_REPORT: ${{ github.workspace }}/.local/landing-run.json
        run: |
          status=0
          # main before this push, else the pushed commit's first parent.
          base="$BEFORE"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=$(git rev-parse HEAD^1); fi
          # Only the test files this change edits; the rest checkpoint on main.
          node scripts/check-landing.mjs --base "$base" --keep-going --own-tests -- \
            --reporter=default --reporter=./scripts/testing/release-test-reporter.mjs || status=$?
          checks=$(node -p 'JSON.parse(require("fs").readFileSync(".local/landing-gate.json", "utf8")).checksExitCode')
          failed=$(node -p 'JSON.parse(require("fs").readFileSync(".local/landing-gate.json", "utf8")).phases.at(-1)?.name ?? ""')
          echo "[landing] gate exit $status, checks exit $checks, last phase $failed"
          if [ "$checks" != 0 ] && [ "$failed" = tests ]; then
            # Only failures the base does not already have fail this change (ADR 0310).
            node scripts/testing/baseline-failures.mjs --base "$base" --report .local/landing-run.json
            exit $?
          fi
          test "$checks" = 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: landing-gate
          include-hidden-files: true
          path: |
            .local/landing-gate.json
            .local/landing-run.json
          retention-days: 7
      - name: File a ci-finding
        if: failure() && github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/ci-finding.mjs --job landing --report .local/landing-run.json

  # The tests a merge reaches through its imports, on Linux, after it is on main
  # (ADR 0310). A pull request ran only the test files it edited. A red run here
  # files a `ci-finding` issue, not a gate. Running main
  # checkpoints finish while newer pushes wait in the concurrency group.
  checkpoint:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.7.0
          cache: pnpm
      - run: sudo apt-get install -y --no-install-recommends ffmpeg zsh
      - run: pnpm install --frozen-lockfile
      - run: pnpm herdr:build
      - run: echo "$PWD/.data/herdr/bin" >> "$GITHUB_PATH"
      - name: Tests the merge reaches
        env:
          BEFORE: ${{ github.event.before }}
          CLANKIE_LANDING_TESTS: "1"
          CLANKIE_RELEASE_TEST_REPORT: ${{ github.workspace }}/.local/checkpoint-run.json
        run: |
          base="$BEFORE"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=$(git rev-parse HEAD^1); fi
          pnpm exec vitest run --config vitest.config.ts --changed "$base" --bail 0 --passWithNoTests \
            --reporter=default --reporter=./scripts/testing/release-test-reporter.mjs
      - name: Name the failures
        if: ${{ failure() }}
        run: |
          test -f .local/checkpoint-run.json || exit 0
          node -e '
            const r = JSON.parse(require("fs").readFileSync(".local/checkpoint-run.json", "utf8"));
            const lines = ["### Failing on main after this merge", ""];
            for (const f of r.files)
              if (f.state === "failed") {
                const tests = f.tests.filter((t) => t.state === "failed").map((t) => t.name);
                lines.push(`- ${f.path}${tests.length ? ": " + tests.join("; ") : " (outside a test)"}`);
              }
            for (const e of r.errors) lines.push(`- unhandled: ${e.name}: ${e.message}`);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            console.log(lines.join("\n"));
          '
      - name: File a ci-finding
        if: failure() && github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/ci-finding.mjs --job checkpoint --report .local/checkpoint-run.json

  # Seeds the cargo cache the landing job restores. Caches saved on main are
  # visible to every pull request; one saved by a pull request is not.
  vox-cache:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88.0
        with:
          components: clippy, rustfmt
      - run: sudo apt-get install -y --no-install-recommends nasm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/vox/target
          key: landing-cargo-${{ runner.os }}-${{ hashFiles('apps/vox/Cargo.lock') }}
          restore-keys: landing-cargo-${{ runner.os }}-
      # The landing gate's own Vox lint, so the cached build is the one it reuses.
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
        working-directory: apps/vox

  # Seeds the compiler state the landing job restores, from main's own tree.
  typecheck-cache:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.7.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .local/tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-main-${{ github.sha }}
          restore-keys: tsbuildinfo-${{ runner.os }}-main-
      # Vox's cargo check is the vox-cache job's; this keeps the TypeScript state.
      - run: pnpm exec turbo run typecheck --concurrency=1 --filter=!@clankie/vox
        env:
          CLANKIE_TYPECHECK_JOBS: 3
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: always()
        with:
          path: .local/tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-main-${{ github.sha }}

  # The changed tests on James's Mac, so macOS-only tests run on every change
  # to main (ADR 0240). It is a checkpoint after the merge, not a pull request
  # wait (ADR 0310): on a pull request it is skipped, which passes the required
  # check. Only pushes to this repository run here, so no fork code reaches the
  # Mac. It stays off until the Mac's runner for this repository is registered
  # and the CLANKIE_MAC_RUNNER variable is "true". The `if:` states the intent;
  # the runner's own job-started guard enforces it, since a pull request can
  # change this file (ADR 0352, docs/mac-runner.md).
  mac:
    if: vars.CLANKIE_MAC_RUNNER == 'true' && github.event_name == 'push'
    runs-on: [self-hosted, macOS, james-mac]
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      # The runner's own work directory, never the owner's ~/dev checkout.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          filter: blob:none
      # Each Mac runner installs pnpm in its own temp folder: the default
      # ~/setup-pnpm is shared by every runner on the machine, and setup
      # empties it. The package store stays shared and outside it (install
      # below), where pnpm handles parallel installs and it survives the job.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.11.0
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.7.0
      # The Mac CLIs the suites spawn (Claude, Codex, OpenCode), from the
      # read-only tools folder the repo variable names; no path lives here.
      - name: Mac CI tools
        if: vars.CLANKIE_MAC_TOOLS != ''
        env:
          TOOLS: ${{ vars.CLANKIE_MAC_TOOLS }}
        run: |
          if [ -d "$TOOLS" ] && [ ! -L "$TOOLS" ]; then
            echo "$TOOLS" >> "$GITHUB_PATH"
            for cli in claude codex opencode; do
              if version=$("$TOOLS/$cli" --version 2>&1); then echo "$cli: ${version%%$'\n'*}"; else echo "::warning::$cli in the Mac tools folder did not answer"; fi
            done
          else
            echo "::warning::CLANKIE_MAC_TOOLS is set but is not a directory on this runner"
          fi
      # The Mac is shared with the owner's agents: heavy steps take a permit
      # from Clankie's fleet scheduler when its CLI is installed. The pnpm
      # store stays on the Mac between runs (~/Library/pnpm/store), so there
      # is no Actions cache.
      - name: Share the machine's heavy-work permits
        run: if command -v clankie >/dev/null; then echo "HEAVY=clankie heavy --" >> "$GITHUB_ENV"; fi
      - run: $HEAVY pnpm install --frozen-lockfile --store-dir "$HOME/Library/pnpm/store"
      # Some tests build Rust fixtures (#652). Install the pinned toolchain in
      # this runner's own tool cache, once per runner, rather than relying on
      # the runner user's PATH; it never changes that user's rustup default.
      - name: Pinned Rust
        run: |
          set -euo pipefail
          version=1.88.0
          export RUSTUP_HOME="$RUNNER_TOOL_CACHE/rustup" CARGO_HOME="$RUNNER_TOOL_CACHE/cargo"
          toolchain="$RUSTUP_HOME/toolchains/$version-$(uname -m | sed 's/arm64/aarch64/')-apple-darwin"
          if ! "$toolchain/bin/cargo" --version >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf --retry 3 https://sh.rustup.rs |
              sh -s -- -y --no-modify-path --profile minimal --default-toolchain "$version"
          fi
          "$toolchain/bin/cargo" --version
          echo "$toolchain/bin" >> "$GITHUB_PATH"
      # Tests spawn the pinned Herdr by name and read processes through the
      # compiled process-proof helper; activity tests decode media with the
      # Mac's own ffmpeg.
      - name: Pinned Herdr and the process-proof helper
        run: |
          pnpm herdr:build
          echo "$PWD/.data/herdr/bin" >> "$GITHUB_PATH"
          pnpm fleet-proof:build
          command -v ffmpeg || echo "::warning::ffmpeg is not on this Mac's PATH"
      # Vitest's changed selection plus the declared consumers of changed
      # filesystem inputs, as the landing gate selects them. The native
      # host-receipt suites run here when a change selects them (#647).
      - name: Changed tests against the base
        env:
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
          HIRE_RECEIPT_NATIVE_TEST: "1"
          ORPHAN_HIRE_NATIVE_TEST: "1"
        run: |
          # A push compares with the branch's previous tip; a pull request's
          # merge commit has its base as the first parent.
          base="$BEFORE"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=$(git rev-parse HEAD^1); fi
          $HEAVY node scripts/check-changed-tests.mjs --base "$base"
      # A job that died before checkout (as at "Set up runner") has no script on disk;
      # mac-findings files for it instead (#551).
      - name: File a ci-finding
        if: failure() && github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch' && hashFiles('scripts/ci-finding.mjs') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/ci-finding.mjs --job mac

  # The real app on James's Mac (ADR 0309): this checkout's service and relay in a
  # scratch home with his own private Herdr, driven through the CLI and HTTP as an
  # agent or the app would, every outcome checked through the API, the files and
  # the service's own logs. It runs on main after merges and on request, never per
  # pull request, and never gates a merge (ADR 0347).
  # The runner-side guard also rejects fork jobs (ADR 0352).
  real-run:
    if: vars.CLANKIE_MAC_RUNNER == 'true' && github.event_name != 'pull_request'
    runs-on: [self-hosted, macOS, james-mac]
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          filter: blob:none
      # Each Mac runner installs pnpm in its own temp folder: the default
      # ~/setup-pnpm is shared by every runner on the machine, and setup
      # empties it. The package store stays shared and outside it (install
      # below), where pnpm handles parallel installs and it survives the job.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.11.0
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.7.0
      # The Mac CLIs the suites spawn (Claude, Codex, OpenCode), from the
      # read-only tools folder the repo variable names; no path lives here.
      - name: Mac CI tools
        if: vars.CLANKIE_MAC_TOOLS != ''
        env:
          TOOLS: ${{ vars.CLANKIE_MAC_TOOLS }}
        run: |
          if [ -d "$TOOLS" ] && [ ! -L "$TOOLS" ]; then
            echo "$TOOLS" >> "$GITHUB_PATH"
            for cli in claude codex opencode; do
              if version=$("$TOOLS/$cli" --version 2>&1); then echo "$cli: ${version%%$'\n'*}"; else echo "::warning::$cli in the Mac tools folder did not answer"; fi
            done
          else
            echo "::warning::CLANKIE_MAC_TOOLS is set but is not a directory on this runner"
          fi
      - name: Share the machine's heavy-work permits
        run: if command -v clankie >/dev/null; then echo "HEAVY=clankie heavy --" >> "$GITHUB_ENV"; fi
      - run: $HEAVY pnpm install --frozen-lockfile --store-dir "$HOME/Library/pnpm/store"
      # His bundled fleet starts from the pinned offline Herdr.
      - run: pnpm herdr:build
      - name: Real-app run
        run: $HEAVY pnpm real-run --out "$RUNNER_TEMP/real-run"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: real-run
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/real-run/report.json
            ${{ runner.temp }}/real-run/run.jsonl
            ${{ runner.temp }}/real-run/service.log
            ${{ runner.temp }}/real-run/relay.log
          retention-days: 7
      # A job that died before checkout (as at "Set up runner") has no script on disk;
      # mac-findings files for it instead (#551).
      - name: File a ci-finding
        if: failure() && github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch' && hashFiles('scripts/ci-finding.mjs') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/ci-finding.mjs --job real-run

  # The Mac jobs' own finding step needs their checkout. When one dies first, as a
  # broken runner does at "Set up runner", this hosted job files for it: one finding
  # per runner whose setup failed, naming it, otherwise the job's. Repeats comment on
  # the open finding (#551).
  mac-findings:
    needs: [mac, real-run]
    if: always() && github.event_name == 'push' && (needs.mac.result == 'failure' || needs['real-run'].result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: scripts/ci-finding.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.7.0
      - name: File findings the Mac jobs couldn't
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/ci-finding.mjs --after mac,real-run
