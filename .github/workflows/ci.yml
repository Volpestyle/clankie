name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 45 || 30 }}
    # The service typechecks need up to ~3.5 GB of heap (apps/clankie); the
    # runner's default Node heap is about 2 GB.
    env:
      NODE_OPTIONS: --max-old-space-size=5120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.88.0
        if: github.event_name == 'workflow_dispatch'
        with:
          components: clippy, rustfmt
      - run: brew install cmake
        if: github.event_name == 'workflow_dispatch'
      - run: pnpm install --frozen-lockfile
      - name: Fast formatting and lint
        if: github.event_name != 'workflow_dispatch'
        run: |
          pnpm exec oxfmt --check .
          pnpm exec oxlint --deny-warnings .
          node scripts/check-retired-claims.mjs
      - name: Strict native MCP catalog contracts
        if: github.event_name != 'workflow_dispatch'
        run: pnpm mcp:check
      - name: Real test dependencies (ffmpeg, pinned Herdr)
        if: github.event_name == 'workflow_dispatch'
        run: |
          brew install ffmpeg
          pnpm herdr:build
          echo "$PWD/.data/herdr/bin" >> "$GITHUB_PATH"
      - name: Native process observation on this runner
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: /usr/bin/python3 -I packages/fleet-resources/src/native.py identity $$
      - run: pnpm check
        if: github.event_name == 'workflow_dispatch'
      - name: Manual fleet load gate
        if: github.event_name == 'workflow_dispatch'
        run: pnpm check:load
      - run: pnpm --filter @clankie/vox build
        if: github.event_name == 'workflow_dispatch'
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: qa-results
          include-hidden-files: true
          path: .data/qa/
          retention-days: 7
