name: CI
# Every push gets the quick `check` job. A draft pull request stops there. A
# ready pull request adds the real-app run; `check` and `real-run` are all a
# merge waits on (ADR 0332). The landing gate (typecheck and the test files a
# change edits) and the tests it reaches through its imports run on main after
# the merge (`landing`, `checkpoint` and `mac`), and the whole suite runs
# nightly: checkpoints, not waits (ADR 0310). Red on main is a bug to file at
# the front of the queue. A draft cannot merge, so the skipped jobs pass nothing.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 60 || 30 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.88.0
        if: github.event_name == 'workflow_dispatch'
        with:
          components: clippy, rustfmt
      - run: brew install cmake
        if: github.event_name == 'workflow_dispatch'
      - run: pnpm install --frozen-lockfile
      - name: Fast formatting and lint
        if: github.event_name != 'workflow_dispatch'
        run: |
          pnpm exec oxfmt --check .
          pnpm exec oxlint --deny-warnings .
          node scripts/check-retired-claims.mjs
      - name: Strict native MCP catalog contracts
        if: github.event_name != 'workflow_dispatch'
        run: pnpm mcp:check
      - name: Controlled fleet admission fixtures
        if: github.event_name != 'workflow_dispatch'
        run: pnpm check:fleet-test-pressure
      - name: Real test dependencies (ffmpeg, pinned Herdr)
        if: github.event_name == 'workflow_dispatch'
        run: |
          brew install ffmpeg
          pnpm herdr:build
          echo "$PWD/.data/herdr/bin" >> "$GITHUB_PATH"
      - name: Native process observation on this runner
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: /usr/bin/python3 -I packages/fleet-resources/src/native.py identity $$
      - name: Full check with one isolated failed-file rerun
        run: node scripts/check-release.mjs
        if: github.event_name == 'workflow_dispatch'
      - name: Manual fleet load gate
        if: github.event_name == 'workflow_dispatch'
        run: pnpm check:load
      - run: pnpm --filter @clankie/vox build
        if: github.event_name == 'workflow_dispatch'
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: qa-results
          include-hidden-files: true
          path: |
            .data/qa/
            .local/typechecks/
          retention-days: 7
  # The landing gate's checks on GitHub's free Linux runner for every push to
  # main, after the merge (ADR 0240, ADR 0332): skills, format, lint with Vox's cargo checks, deadcode,
  # doc links, swallowed rejections, evidence, the scoped typecheck and the
  # changed-test selection. Tests Linux skips (macOS-only) stay on the owner's
  # Mac. Exit 3 is green checks waiting for the standing reviewer (ADR 0287),
  # which needs the owner's operator credential and never answers here. A red run
  # is a bug to file at the front of the queue, not a gate; nothing waits on it.
  landing:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt
      # Vox's turbojpeg-sys builds libjpeg-turbo's SIMD code with NASM; the activity-sharing
      # tests decode real MP4 and GIF media with ffmpeg; the seat-command tests resolve
      # numbered Claude commands through a real zsh login shell.
      - run: sudo apt-get install -y --no-install-recommends nasm ffmpeg zsh
      # The cargo cache the vox-cache job saves on main.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/vox/target
          key: landing-cargo-${{ runner.os }}-${{ hashFiles('apps/vox/Cargo.lock') }}
          restore-keys: landing-cargo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # Compiler state the typecheck-cache job saved on main, so the typecheck
      # rechecks only what changed since (ADR 0310).
      - uses: actions/cache/restore@v4
        with:
          path: .local/tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-main-${{ github.sha }}
          restore-keys: tsbuildinfo-${{ runner.os }}-main-
      # The gate's skills phase installs the pinned Herdr here; tests spawn it by name.
      - run: echo "$PWD/.data/herdr/bin" >> "$GITHUB_PATH"
      - name: Landing gate checks against main before the push
        env:
          BEFORE: ${{ github.event.before }}
          # Four vCPUs and 16 GB fit three 2.5 GiB compiler heaps at once.
          CLANKIE_TYPECHECK_JOBS: 3
          # A complete run report: unhandled errors and unfinished files count against it.
          CLANKIE_RELEASE_TEST_REPORT: ${{ github.workspace }}/.local/landing-run.json
        run: |
          status=0
          # main before this push, else the pushed commit's first parent.
          base="$BEFORE"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=$(git rev-parse HEAD^1); fi
          # Only the test files this change edits; the rest checkpoint on main.
          node scripts/check-landing.mjs --base "$base" --keep-going --own-tests -- \
            --reporter=default --reporter=./scripts/testing/release-test-reporter.mjs || status=$?
          checks=$(node -p 'JSON.parse(require("fs").readFileSync(".local/landing-gate.json", "utf8")).checksExitCode')
          failed=$(node -p 'JSON.parse(require("fs").readFileSync(".local/landing-gate.json", "utf8")).phases.at(-1)?.name ?? ""')
          echo "[landing] gate exit $status, checks exit $checks, last phase $failed"
          if [ "$checks" != 0 ] && [ "$failed" = tests ]; then
            # Only failures the base does not already have fail this change (ADR 0310).
            node scripts/testing/baseline-failures.mjs --base "$base" --report .local/landing-run.json
            exit $?
          fi
          test "$checks" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing-gate
          include-hidden-files: true
          path: |
            .local/landing-gate.json
            .local/landing-run.json
          retention-days: 7

  # The tests a merge reaches through its imports, on Linux, after it is on main
  # (ADR 0310). A pull request ran only the test files it edited. A red run here
  # is a bug to file at the front of the queue, not a gate; a newer push cancels
  # an older run, and the nightly run covers everything either way.
  checkpoint:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: pnpm
      - run: sudo apt-get install -y --no-install-recommends ffmpeg zsh
      - run: pnpm install --frozen-lockfile
      - run: pnpm herdr:build
      - run: echo "$PWD/.data/herdr/bin" >> "$GITHUB_PATH"
      - name: Tests the merge reaches
        env:
          BEFORE: ${{ github.event.before }}
          CLANKIE_LANDING_TESTS: "1"
          CLANKIE_RELEASE_TEST_REPORT: ${{ github.workspace }}/.local/checkpoint-run.json
        run: |
          base="$BEFORE"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=$(git rev-parse HEAD^1); fi
          pnpm exec vitest run --config vitest.config.ts --changed "$base" --bail 0 --passWithNoTests \
            --reporter=default --reporter=./scripts/testing/release-test-reporter.mjs
      - name: Name the failures
        if: ${{ failure() }}
        run: |
          test -f .local/checkpoint-run.json || exit 0
          node -e '
            const r = JSON.parse(require("fs").readFileSync(".local/checkpoint-run.json", "utf8"));
            const lines = ["### Failing on main after this merge", ""];
            for (const f of r.files)
              if (f.state === "failed") {
                const tests = f.tests.filter((t) => t.state === "failed").map((t) => t.name);
                lines.push(`- ${f.path}${tests.length ? ": " + tests.join("; ") : " (outside a test)"}`);
              }
            for (const e of r.errors) lines.push(`- unhandled: ${e.name}: ${e.message}`);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            console.log(lines.join("\n"));
          '

  # Seeds the cargo cache the landing job restores. Caches saved on main are
  # visible to every pull request; one saved by a pull request is not.
  vox-cache:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt
      - run: sudo apt-get install -y --no-install-recommends nasm
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/vox/target
          key: landing-cargo-${{ runner.os }}-${{ hashFiles('apps/vox/Cargo.lock') }}
          restore-keys: landing-cargo-${{ runner.os }}-
      # The landing gate's own Vox lint, so the cached build is the one it reuses.
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
        working-directory: apps/vox

  # Seeds the compiler state the landing job restores, from main's own tree.
  typecheck-cache:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@v4
        with:
          path: .local/tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-main-${{ github.sha }}
          restore-keys: tsbuildinfo-${{ runner.os }}-main-
      # Vox's cargo check is the vox-cache job's; this keeps the TypeScript state.
      - run: pnpm exec turbo run typecheck --concurrency=1 --filter=!@clankie/vox
        env:
          CLANKIE_TYPECHECK_JOBS: 3
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .local/tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-main-${{ github.sha }}

  # The changed tests on James's Mac, so macOS-only tests run on every change
  # to main (ADR 0240). It is a checkpoint after the merge, not a pull request
  # wait (ADR 0310): on a pull request it is skipped, which passes the required
  # check. Only pushes to this repository run here, so no fork code reaches the
  # Mac. It stays off until the Mac's runner for this repository is registered
  # and the CLANKIE_MAC_RUNNER variable is "true".
  mac:
    if: vars.CLANKIE_MAC_RUNNER == 'true' && github.event_name == 'push'
    runs-on: [self-hosted, macOS, james-mac]
    timeout-minutes: 30
    steps:
      # The runner's own work directory, never the owner's ~/dev checkout.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      # Each Mac runner installs pnpm in its own temp folder: the default
      # ~/setup-pnpm is shared by every runner on the machine, and setup
      # empties it. The package store stays shared and outside it (install
      # below), where pnpm handles parallel installs and it survives the job.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      # The Mac is shared with the owner's agents: heavy steps take a permit
      # from Clankie's fleet scheduler when its CLI is installed. The pnpm
      # store stays on the Mac between runs (~/Library/pnpm/store), so there
      # is no Actions cache.
      - name: Share the machine's heavy-work permits
        run: if command -v clankie >/dev/null; then echo "HEAVY=clankie heavy --" >> "$GITHUB_ENV"; fi
      - run: $HEAVY pnpm install --frozen-lockfile --store-dir "$HOME/Library/pnpm/store"
      # Tests spawn the pinned Herdr by name; activity tests decode media with
      # the Mac's own ffmpeg.
      - name: Pinned Herdr
        run: |
          pnpm herdr:build
          echo "$PWD/.data/herdr/bin" >> "$GITHUB_PATH"
          command -v ffmpeg || echo "::warning::ffmpeg is not on this Mac's PATH"
      # Vitest's changed selection plus the declared consumers of changed
      # filesystem inputs, as the landing gate selects them.
      - name: Changed tests against the base
        env:
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          # A push compares with the branch's previous tip; a pull request's
          # merge commit has its base as the first parent.
          base="$BEFORE"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=$(git rev-parse HEAD^1); fi
          $HEAVY node scripts/check-changed-tests.mjs --base "$base"

  # The real app on James's Mac (ADR 0309): this checkout's service and relay in a
  # scratch home with his own private Herdr, driven through the CLI and HTTP as an
  # agent or the app would, every outcome checked through the API, the files and
  # the service's own logs. It is the pull request's one Mac job, a few minutes,
  # and it runs once: main does not rerun what the pull request proved
  # (ADR 0310). Never code from a fork on that machine.
  real-run:
    if: >-
      vars.CLANKIE_MAC_RUNNER == 'true' &&
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, james-mac]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      # Each Mac runner installs pnpm in its own temp folder: the default
      # ~/setup-pnpm is shared by every runner on the machine, and setup
      # empties it. The package store stays shared and outside it (install
      # below), where pnpm handles parallel installs and it survives the job.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - name: Share the machine's heavy-work permits
        run: if command -v clankie >/dev/null; then echo "HEAVY=clankie heavy --" >> "$GITHUB_ENV"; fi
      - run: $HEAVY pnpm install --frozen-lockfile --store-dir "$HOME/Library/pnpm/store"
      # His bundled fleet starts from the pinned offline Herdr.
      - run: pnpm herdr:build
      - name: Real-app run
        run: $HEAVY pnpm real-run --out "$RUNNER_TEMP/real-run"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-run
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/real-run/report.json
            ${{ runner.temp }}/real-run/run.jsonl
            ${{ runner.temp }}/real-run/service.log
            ${{ runner.temp }}/real-run/relay.log
          retention-days: 7
