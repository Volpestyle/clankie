name: CI
# Every push gets the quick `check` job. A draft pull request stops there: the
# landing gate and the Mac job run once it is ready for review, and again on
# each push after that, so the full checks run before merge, not on every
# iteration (ADR 0310). A draft cannot merge, so the skipped jobs pass nothing.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 60 || 30 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.88.0
        if: github.event_name == 'workflow_dispatch'
        with:
          components: clippy, rustfmt
      - run: brew install cmake
        if: github.event_name == 'workflow_dispatch'
      - run: pnpm install --frozen-lockfile
      - name: Fast formatting and lint
        if: github.event_name != 'workflow_dispatch'
        run: |
          pnpm exec oxfmt --check .
          pnpm exec oxlint --deny-warnings .
          node scripts/check-retired-claims.mjs
      - name: Strict native MCP catalog contracts
        if: github.event_name != 'workflow_dispatch'
        run: pnpm mcp:check
      - name: Controlled fleet admission fixtures
        if: github.event_name != 'workflow_dispatch'
        run: pnpm check:fleet-test-pressure
      - name: Real test dependencies (ffmpeg, pinned Herdr)
        if: github.event_name == 'workflow_dispatch'
        run: |
          brew install ffmpeg
          pnpm herdr:build
          echo "$PWD/.data/herdr/bin" >> "$GITHUB_PATH"
      - name: Native process observation on this runner
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: /usr/bin/python3 -I packages/fleet-resources/src/native.py identity $$
      - name: Full check with one isolated failed-file rerun
        run: node scripts/check-release.mjs
        if: github.event_name == 'workflow_dispatch'
      - name: Manual fleet load gate
        if: github.event_name == 'workflow_dispatch'
        run: pnpm check:load
      - run: pnpm --filter @clankie/vox build
        if: github.event_name == 'workflow_dispatch'
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: qa-results
          include-hidden-files: true
          path: |
            .data/qa/
            .local/typechecks/
          retention-days: 7
  # The landing gate's checks on GitHub's free Linux runner for every pull
  # request (ADR 0240): skills, format, lint with Vox's cargo checks, deadcode,
  # doc links, swallowed rejections, evidence, the scoped typecheck and the
  # changed-test selection. Tests Linux skips (macOS-only) stay on the owner's
  # Mac. Exit 3 is green checks waiting for the standing reviewer (ADR 0287),
  # which needs the owner's operator credential and never answers here.
  landing:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt
      # Vox's turbojpeg-sys builds libjpeg-turbo's SIMD code with NASM; the activity-sharing
      # tests decode real MP4 and GIF media with ffmpeg; the seat-command tests resolve
      # numbered Claude commands through a real zsh login shell.
      - run: sudo apt-get install -y --no-install-recommends nasm ffmpeg zsh
      # A pull request's own cache is visible only to that pull request, so the
      # landing job restores the one the vox-cache job saves on main.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/vox/target
          key: landing-cargo-${{ runner.os }}-${{ hashFiles('apps/vox/Cargo.lock') }}
          restore-keys: landing-cargo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # Compiler state from this pull request's last run, else from main, so the
      # typecheck rechecks only what changed since (ADR 0310).
      - uses: actions/cache/restore@v4
        with:
          path: .local/tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-pr${{ github.event.pull_request.number }}-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-pr${{ github.event.pull_request.number }}-
            tsbuildinfo-${{ runner.os }}-main-
      # The gate's skills phase installs the pinned Herdr here; tests spawn it by name.
      - run: echo "$PWD/.data/herdr/bin" >> "$GITHUB_PATH"
      - name: Landing gate checks against the pull request's base
        env:
          # Four vCPUs and 16 GB fit three 2.5 GiB compiler heaps at once.
          CLANKIE_TYPECHECK_JOBS: 3
          # A complete run report: unhandled errors and unfinished files count against it.
          CLANKIE_RELEASE_TEST_REPORT: ${{ github.workspace }}/.local/landing-run.json
        run: |
          status=0
          # The checked-out merge commit's first parent is the base it merges into.
          base=$(git rev-parse HEAD^1)
          node scripts/check-landing.mjs --base "$base" --keep-going -- \
            --reporter=default --reporter=./scripts/testing/release-test-reporter.mjs || status=$?
          checks=$(node -p 'JSON.parse(require("fs").readFileSync(".local/landing-gate.json", "utf8")).checksExitCode')
          failed=$(node -p 'JSON.parse(require("fs").readFileSync(".local/landing-gate.json", "utf8")).phases.at(-1)?.name ?? ""')
          echo "[landing] gate exit $status, checks exit $checks, last phase $failed"
          if [ "$checks" != 0 ] && [ "$failed" = tests ]; then
            # Only failures the base does not already have fail this change (ADR 0310).
            node scripts/testing/baseline-failures.mjs --base "$base" --report .local/landing-run.json
            exit $?
          fi
          test "$checks" = 0
      # Saved even when the gate fails: the next push rechecks only what changed.
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .local/tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-pr${{ github.event.pull_request.number }}-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing-gate
          include-hidden-files: true
          path: |
            .local/landing-gate.json
            .local/landing-run.json
          retention-days: 7

  # Seeds the cargo cache the landing job restores. Caches saved on main are
  # visible to every pull request; one saved by a pull request is not.
  vox-cache:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt
      - run: sudo apt-get install -y --no-install-recommends nasm
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/vox/target
          key: landing-cargo-${{ runner.os }}-${{ hashFiles('apps/vox/Cargo.lock') }}
          restore-keys: landing-cargo-${{ runner.os }}-
      # The landing gate's own Vox lint, so the cached build is the one it reuses.
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
        working-directory: apps/vox

  # Seeds the compiler state the landing job restores, from main's own tree.
  typecheck-cache:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@v4
        with:
          path: .local/tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-main-${{ github.sha }}
          restore-keys: tsbuildinfo-${{ runner.os }}-main-
      # Vox's cargo check is the vox-cache job's; this keeps the TypeScript state.
      - run: pnpm exec turbo run typecheck --concurrency=1 --filter=!@clankie/vox
        env:
          CLANKIE_TYPECHECK_JOBS: 3
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .local/tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-main-${{ github.sha }}

  # Which tests the Mac job would run, worked out on a free Linux runner, so a
  # change that selects none leaves the Mac idle and the mac check passes as
  # skipped (ADR 0310). Any failure here runs the Mac job anyway.
  mac-scope:
    if: >-
      vars.CLANKIE_MAC_RUNNER == 'true' &&
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tests: ${{ steps.scope.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: scope
        run: |
          node scripts/check-changed-tests.mjs --base "$(git rev-parse HEAD^1)" --list .local/mac-scope.json
          count=$(node -p 'JSON.parse(require("fs").readFileSync(".local/mac-scope.json", "utf8")).length')
          echo "tests=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # The changed tests on James's Mac, so macOS-only tests run on every change
  # (ADR 0240). This repository is public, so the job never runs code from a
  # fork on that machine: only pushes here and pull requests from this
  # repository's own branches. It stays off until the Mac's runner for this
  # repository is registered and the CLANKIE_MAC_RUNNER variable is "true".
  mac:
    needs: mac-scope
    if: >-
      !cancelled() &&
      vars.CLANKIE_MAC_RUNNER == 'true' &&
      (github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (needs.mac-scope.result != 'success' || needs.mac-scope.outputs.tests != 'false')))
    runs-on: [self-hosted, macOS, james-mac]
    timeout-minutes: 30
    steps:
      # The runner's own work directory, never the owner's ~/dev checkout.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      # The Mac is shared with the owner's agents: heavy steps take a permit
      # from Clankie's fleet scheduler when its CLI is installed. The pnpm
      # store stays on the Mac between runs, so there is no Actions cache.
      - name: Share the machine's heavy-work permits
        run: if command -v clankie >/dev/null; then echo "HEAVY=clankie heavy --" >> "$GITHUB_ENV"; fi
      - run: $HEAVY pnpm install --frozen-lockfile
      # Tests spawn the pinned Herdr by name; activity tests decode media with
      # the Mac's own ffmpeg.
      - name: Pinned Herdr
        run: |
          pnpm herdr:build
          echo "$PWD/.data/herdr/bin" >> "$GITHUB_PATH"
          command -v ffmpeg || echo "::warning::ffmpeg is not on this Mac's PATH"
      # Vitest's changed selection plus the declared consumers of changed
      # filesystem inputs, as the landing gate selects them.
      - name: Changed tests against the base
        env:
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          # A push compares with the branch's previous tip; a pull request's
          # merge commit has its base as the first parent.
          base="$BEFORE"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=$(git rev-parse HEAD^1); fi
          $HEAVY node scripts/check-changed-tests.mjs --base "$base"
