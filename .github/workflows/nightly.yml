name: Nightly
# The whole suite on main once a night, release-only tests included. Pull
# requests run only what their change selects (ADR 0310), so this is where a
# failure nothing selected shows up. A red run files a `ci-finding` issue
# (scripts/ci-finding.mjs, ADR 0347), not a gate.
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # History, as the CI test jobs check out: some tests read golden files from
          # past commits (#597). Blobs still load on demand.
          fetch-depth: 0
          filter: blob:none
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt
      # Same system tools as the landing gate.
      - run: sudo apt-get install -y --no-install-recommends nasm ffmpeg zsh
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/vox/target
          key: landing-cargo-${{ runner.os }}-${{ hashFiles('apps/vox/Cargo.lock') }}
          restore-keys: landing-cargo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@v4
        with:
          path: .local/tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-main-${{ github.sha }}
          restore-keys: tsbuildinfo-${{ runner.os }}-main-
      - run: pnpm herdr:build
      - run: echo "$PWD/.data/herdr/bin" >> "$GITHUB_PATH"
      - name: Typecheck
        env:
          CLANKIE_TYPECHECK_JOBS: 3
        run: pnpm exec turbo run typecheck --concurrency=1 --filter=!@clankie/vox
      - name: Every test
        if: ${{ !cancelled() }}
        # Inside the job's 90 minutes, so a hung file fails this step and the finding
        # steps below still run; the suite takes about 25 (#593).
        timeout-minutes: 55
        env:
          CLANKIE_RELEASE_TEST_REPORT: ${{ github.workspace }}/.local/nightly-run.json
        run: >-
          pnpm exec vitest run --config vitest.config.ts --bail 0
          --reporter=default --reporter=./scripts/testing/release-test-reporter.mjs
      - name: Name the failures
        if: ${{ failure() }}
        run: |
          test -f .local/nightly-run.json || exit 0
          node -e '
            const r = JSON.parse(require("fs").readFileSync(".local/nightly-run.json", "utf8"));
            const lines = ["### Failing on main tonight", ""];
            for (const f of r.files)
              if (f.state === "failed") {
                const tests = f.tests.filter((t) => t.state === "failed").map((t) => t.name);
                lines.push(`- ${f.path}${tests.length ? ": " + tests.join("; ") : " (outside a test)"}`);
              }
            for (const e of r.errors) lines.push(`- unhandled: ${e.name}: ${e.message}`);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            console.log(lines.join("\n"));
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-suite
          include-hidden-files: true
          path: |
            .local/nightly-run.json
            .local/nightly-run.json.running
          retention-days: 14
      - name: File a ci-finding
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/ci-finding.mjs --job nightly --report .local/nightly-run.json

  # The native host-receipt suites (#647): fleet adoption and retirement proven
  # against an isolated real Herdr, the compiled process-proof helper and the
  # native Codex CLI. They need macOS, so on the Linux job above they skip by
  # platform. They run here on the Mac runner every night with their gates set,
  # and a skip fails the job, so nothing can quietly switch them off again.
  mac-native:
    if: vars.CLANKIE_MAC_RUNNER == 'true'
    runs-on: [self-hosted, macOS, james-mac]
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
      # As in the CI Mac jobs: pnpm in this runner's own temp folder, the package
      # store shared on the Mac, and heavy steps under the fleet scheduler's permits.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      # The Mac CLIs the suites spawn (Claude, Codex, OpenCode), from the
      # read-only tools folder the repo variable names; no path lives here.
      - name: Mac CI tools
        if: vars.CLANKIE_MAC_TOOLS != ''
        env:
          TOOLS: ${{ vars.CLANKIE_MAC_TOOLS }}
        run: |
          if [ -d "$TOOLS" ] && [ ! -L "$TOOLS" ]; then
            echo "$TOOLS" >> "$GITHUB_PATH"
            for cli in claude codex opencode; do
              if version=$("$TOOLS/$cli" --version 2>&1); then echo "$cli: ${version%%$'\n'*}"; else echo "::warning::$cli in the Mac tools folder did not answer"; fi
            done
          else
            echo "::warning::CLANKIE_MAC_TOOLS is set but is not a directory on this runner"
          fi
      - name: Share the machine's heavy-work permits
        # A runner account other than the owner's asks the owner's Clankie
        # through his permit socket once he has turned it on (#562).
        run: |
          if [ -S /Users/Shared/clankie-permits/heavy.sock ]; then
            echo "HEAVY=node $GITHUB_WORKSPACE/scripts/ci-heavy.mjs --label ${GITHUB_RUN_ID}/${GITHUB_JOB} --" >> "$GITHUB_ENV"
          elif command -v clankie >/dev/null; then
            echo "HEAVY=clankie heavy --" >> "$GITHUB_ENV"
          fi
      - run: $HEAVY pnpm install --frozen-lockfile --store-dir "$HOME/Library/pnpm/store"
      # The suites spawn the pinned Herdr by name and read processes through the
      # compiled helper; without the helper the observer refuses every pane.
      - name: Pinned Herdr and the process-proof helper
        run: |
          pnpm herdr:build
          echo "$PWD/.data/herdr/bin" >> "$GITHUB_PATH"
          pnpm fleet-proof:build
      - name: Native host-receipt suites
        timeout-minutes: 20
        env:
          HIRE_RECEIPT_NATIVE_TEST: "1"
          ORPHAN_HIRE_NATIVE_TEST: "1"
          CLANKIE_RELEASE_TEST_REPORT: ${{ github.workspace }}/.local/mac-native-run.json
        run: >-
          $HEAVY pnpm exec vitest run --config vitest.config.ts --bail 0
          --reporter=default --reporter=./scripts/testing/release-test-reporter.mjs
          apps/clankie/test/remote-hire-adopt.integration.test.ts
          apps/clankie/test/remote-hire-receipts.integration.test.ts
          apps/clankie/test/agent-message-linked-seat.integration.test.ts
          apps/clankie/test/remote-hire-command-unsent.integration.test.ts
          apps/clankie/test/hire-receipt-retirement-native.integration.test.ts
          apps/clankie/test/orphan-hire-native.integration.test.ts
      - name: Every native suite ran, none skipped
        run: |
          node -e '
            const r = JSON.parse(require("fs").readFileSync(".local/mac-native-run.json", "utf8"));
            const skipped = r.files.flatMap((f) => f.tests.filter((t) => t.state === "skipped").map((t) => `${f.path}: ${t.name}`));
            if (r.files.length !== 6) { console.error(`expected 6 native suites, ran ${r.files.length}`); process.exit(1); }
            if (skipped.length) { console.error("Skipped native tests:\n" + skipped.join("\n")); process.exit(1); }
            console.log(`${r.files.reduce((n, f) => n + f.tests.length, 0)} native tests ran`);
          '
      - name: File a ci-finding
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/ci-finding.mjs --job mac-native --report .local/mac-native-run.json

  # A Mac job that dies before checkout (as at "Set up runner") has no script to
  # file with; this hosted job files for it (#551).
  mac-native-findings:
    needs: [mac-native]
    if: always() && needs['mac-native'].result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci-finding.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - name: File findings the Mac job couldn't
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/ci-finding.mjs --after mac-native
