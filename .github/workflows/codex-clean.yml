name: Codex clean

# Posts the `codex-clean` commit status on a pull request's head: success only
# once Codex has reviewed that exact commit and left no open findings. A new
# push has no status until Codex reviews it again (comment `@codex review`),
# so a required `codex-clean` check keeps auto-merge from getting ahead of
# Codex.
#
# Codex keeps one summary comment per pull request and edits it as reviews
# start and finish. This workflow never checks out or runs pull request code,
# so it is safe for fork pull requests; it trusts only that summary comment
# as written by the Codex bot account, read fresh from the API.
on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: codex-clean-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  status:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'chatgpt-codex-connector[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Codex's review state for the head commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          # The Codex bot's newest summary comment; user logins cannot contain brackets.
          export BODY=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "chatgpt-codex-connector[bot]" and .user.type == "Bot" and (.body | contains("codex-review-state:v1"))) | .body | @base64' \
            | tail -n 1 | base64 --decode)
          export HEAD="$head"
          read -r state description < <(python3 -I - <<'PY'
          import html, json, os, re
          head = os.environ["HEAD"]
          match = re.search(r"codex-review-state:v1\s+(\{.*?\})\s*-->", html.unescape(os.environ["BODY"]), re.S)
          try:
              review = json.loads(match.group(1)) if match else {}
          except json.JSONDecodeError:
              review = {}
          code = review.get("code_review") or {}
          security = review.get("security_review") or {}
          if code.get("commit_sha") != head:
              print("pending", f"Codex has not reviewed {head[:7]}; comment @codex review")
          elif code.get("status") != "completed":
              print("pending", f"Codex is reviewing {head[:7]}")
          elif code.get("has_unresolved_findings") is not False or (
              security.get("commit_sha") == head and security.get("has_unresolved_findings")
          ):
              print("failure", f"Codex has open findings on {head[:7]}")
          else:
              print("success", f"Codex reviewed {head[:7]} with no open findings")
          PY
          )
          echo "codex-clean: $state ($description)"
          gh api -X POST "repos/$REPO/statuses/$head" \
            -f state="$state" -f context=codex-clean -f description="$description" >/dev/null
