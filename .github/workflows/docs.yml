name: Docs

on:
  push:
    branches: [main]
    paths:
      - apps/docs/**
      - apps/clankie/openapi.yaml
      - apps/tui/README.md
      - apps/tui/src/**
      - docs/architecture.md
      - docs/cli.md
      - branding/clankie-logo-512-alpha.png
      - packages/protocol/src/public-gateway.ts
      - infra/aws/public-docs/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - apps/docs/**
      - apps/clankie/openapi.yaml
      - apps/tui/README.md
      - apps/tui/src/**
      - docs/architecture.md
      - docs/cli.md
      - branding/clankie-logo-512-alpha.png
      - packages/protocol/src/public-gateway.ts
      - infra/aws/public-docs/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/docs.yml
  workflow_dispatch:

concurrency:
  # PR builds supersede only their own pushes; deploys keep one production group.
  group: ${{ github.event_name == 'pull_request' && format('clankie-public-docs-pr-{0}', github.event.pull_request.number) || 'clankie-public-docs-production' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  DOCS_BUCKET: ${{ vars.DOCS_BUCKET }}
  DOCS_DISTRIBUTION_ID: ${{ vars.DOCS_DISTRIBUTION_ID }}
  DEPLOY_ROLE_ARN: ${{ vars.DEPLOY_ROLE_ARN }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.7.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:public:check
      - run: pnpm docs:public:build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-site
          path: apps/docs/dist
          if-no-files-found: error

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check deployment configuration
        run: |
          : "${AWS_REGION:?Set the AWS_REGION repository variable}"
          : "${DOCS_BUCKET:?Set the DOCS_BUCKET repository variable}"
          : "${DOCS_DISTRIBUTION_ID:?Set the DOCS_DISTRIBUTION_ID repository variable}"
          : "${DEPLOY_ROLE_ARN:?Set the DEPLOY_ROLE_ARN repository variable}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docs-site
          path: docs-site
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: >-
          aws s3 sync docs-site "s3://${DOCS_BUCKET}/" --delete
          --cache-control 'public,max-age=300,must-revalidate'
      - run: >-
          aws cloudfront create-invalidation
          --distribution-id "$DOCS_DISTRIBUTION_ID" --paths '/*'
