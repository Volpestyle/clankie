name: Release
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt
      - run: brew install cmake
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm release:build
      - run: pnpm release:smoke
      - uses: actions/upload-artifact@v4
        with:
          name: clankie-darwin-arm64-${{ github.ref_name }}
          path: |
            dist/clankie-darwin-arm64.tar.gz
            dist/clankie-darwin-arm64.tar.gz.sha256
          if-no-files-found: error

  deploy-gateway:
    needs: build
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-gateway.yml
    secrets: inherit

  publish:
    needs: [build, deploy-gateway]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: clankie-darwin-arm64-${{ github.ref_name }}
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/clankie-darwin-arm64.tar.gz \
            dist/clankie-darwin-arm64.tar.gz.sha256 \
            --generate-notes \
            --verify-tag
