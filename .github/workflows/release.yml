name: Release
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.7.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88.0
        with:
          components: clippy, rustfmt
      - run: brew install cmake
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2
      - run: pnpm install --frozen-lockfile
      - name: Real test dependencies (ffmpeg, pinned Herdr)
        run: |
          brew install ffmpeg
          pnpm herdr:build
          echo "$PWD/.data/herdr/bin" >> "$GITHUB_PATH"
      - name: Full check with one isolated failed-file rerun
        run: node scripts/check-release.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: qa-results
          path: |
            .data/qa/
            .local/typechecks/
          include-hidden-files: true
          retention-days: 7
      - run: pnpm release:build
      - run: pnpm release:smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clankie-darwin-arm64-${{ github.ref_name }}
          path: |
            dist/clankie-darwin-arm64.tar.gz
            dist/clankie-darwin-arm64.tar.gz.sha256
          if-no-files-found: error

  # Its own fresh runner, beside the full check: after an hour of tests the same
  # runner measured twice the CPU for unchanged code (VUH-2516).
  load:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.7.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fleet CPU and latency release gate with one timing-only retry
        run: node scripts/check-release-load.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fleet-load
          path: |
            .data/qa/fleet-load*.json
            .data/qa/fleet-load-release-summary.md
          include-hidden-files: true
          retention-days: 7

  # Hosted bodies install these themselves (ADR 0237). The image's own build
  # stage builds them, so native code matches the body's glibc.
  build-linux:
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: >-
          docker build --target build --build-arg CLANKIE_REVISION="$GITHUB_SHA"
          -f scripts/release/clankie-linux.Dockerfile -t clankie-release-build .
      - name: Extract the archive
        run: |
          id="$(docker create clankie-release-build)"
          mkdir -p dist
          docker cp "$id:/clankie/dist/clankie-linux-${{ matrix.arch }}.tar.gz" dist/
          docker cp "$id:/clankie/dist/clankie-linux-${{ matrix.arch }}.tar.gz.sha256" dist/
          docker rm "$id"
          cd dist && sha256sum -c "clankie-linux-${{ matrix.arch }}.tar.gz.sha256"
      - name: Run the archive in the hosted runtime base
        run: >-
          docker run --rm -e GITHUB_REF_NAME -v "$PWD/dist:/dist:ro" node:24.20.0-bookworm-slim sh -euc
          'mkdir /t && tar -xzf /dist/clankie-linux-${{ matrix.arch }}.tar.gz -C /t &&
          test "$(/t/clankie/bin/clankie --version)" = "clankie ${GITHUB_REF_NAME#v}"'
          && test "$(tar -xzOf dist/clankie-linux-${{ matrix.arch }}.tar.gz clankie/release.json | jq -r .revision)" = "$GITHUB_SHA"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clankie-linux-${{ matrix.arch }}-${{ github.ref_name }}
          path: |
            dist/clankie-linux-${{ matrix.arch }}.tar.gz
            dist/clankie-linux-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: [build, load, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: clankie-*-${{ github.ref_name }}
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/clankie-darwin-arm64.tar.gz \
            dist/clankie-darwin-arm64.tar.gz.sha256 \
            dist/clankie-linux-arm64.tar.gz \
            dist/clankie-linux-arm64.tar.gz.sha256 \
            dist/clankie-linux-x64.tar.gz \
            dist/clankie-linux-x64.tar.gz.sha256 \
            --generate-notes \
            --verify-tag
