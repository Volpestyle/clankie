<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>herd map</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1e1e2e; }
  canvas { display: block; image-rendering: pixelated; cursor: default; }
  #hud, #legend, #tip {
    position: fixed;
    font: 12px ui-monospace, "SF Mono", Menlo, monospace;
    pointer-events: none;
    user-select: none;
    white-space: pre;
  }
  #hud { top: 10px; left: 12px; line-height: 1.5; }
  #legend { bottom: 10px; left: 12px; }
  #tip {
    display: none;
    max-width: 44ch;
    padding: 8px 10px;
    line-height: 1.45;
    white-space: pre-wrap;
    border: 1px solid;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud"></div>
<div id="legend"></div>
<div id="tip"></div>
<script>
"use strict";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const hud = document.getElementById("hud");
const legend = document.getElementById("legend");
const tip = document.getElementById("tip");

let C = {
  base: "#1e1e2e", surface: "#313244", overlay: "#6c7086", text: "#cdd6f4", subtext: "#a6adc8",
  red: "#f38ba8", peach: "#fab387", yellow: "#f9e2af", green: "#a6e3a1", teal: "#94e2d5",
  blue: "#89b4fa", mauve: "#cba6f7", lavender: "#b4befe",
};
const STATUS = { working: "blue", blocked: "red", done: "green", idle: "subtext", unknown: "overlay" };
const GLYPH = { working: "●", blocked: "▲", done: "★", idle: "○", unknown: "·" };

let W = 0, H = 0, U = 5;
let cam = { x: 0, y: 0 };
let userView = false;
let data = null;
let lastOk = 0;
let fitRadius = 40;
const nodes = new Map();
let links = [];
let hover = null;
let hoverPx = { x: 0, y: 0 };
const pulses = [];
let dragging = null;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  cv.style.width = W + "px";
  cv.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!userView) fitView();
}

function fitView() {
  U = Math.max(2, Math.min(8, Math.floor(Math.min(W, H) / (fitRadius * 2 + 24))));
  cam = { x: 0, y: 0 };
}

function hashAngle(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return h;
}

function layout() {
  if (!data) return;
  const byCluster = new Map();
  for (const n of data.nodes) {
    if (n.kind === "you") continue;
    const key = n.cluster || "·";
    if (!byCluster.has(key)) byCluster.set(key, { key, label: key, agents: [], hub: null });
    const g = byCluster.get(key);
    if (n.kind === "hub") { g.hub = n; g.label = n.label; }
    else g.agents.push(n);
  }
  const groups = [...byCluster.values()].sort((a, b) =>
    (a.key === "·" ? 1 : 0) - (b.key === "·" ? 1 : 0) || a.label.localeCompare(b.label));
  const nGroups = groups.length;
  const R = nGroups <= 1 ? 0 : Math.min(46, 24 + nGroups * 4);
  const startAng = nGroups === 2 ? 180 : -90;
  const targets = new Map();
  const labelOffs = new Map();
  groups.forEach((g, i) => {
    const ang = (startAng + i * 360 / Math.max(1, nGroups)) * Math.PI / 180;
    const hx = Math.round(Math.cos(ang) * R);
    const hy = Math.round(Math.sin(ang) * R);
    if (g.hub) targets.set(g.hub.id, { x: hx, y: hy });
    const away = nGroups <= 1 ? -90 * Math.PI / 180 : ang;
    const r = 10 + Math.max(0, g.agents.length - 5) * 0.9;
    const sorted = [...g.agents].sort((a, b) => a.id.localeCompare(b.id));
    const spots = [];
    sorted.forEach((a, j) => {
      const aa = away + (sorted.length === 1 ? 0 : j * 2 * Math.PI / sorted.length + hashAngle(g.key) % 7 * 0.13);
      const spot = { x: hx + Math.round(Math.cos(aa) * r), y: hy + Math.round(Math.sin(aa) * r) };
      targets.set(a.id, spot);
      spots.push(spot);
    });
    if (g.hub) {
      const cands = [[0, -8], [0, 10], [11, 1], [-11, 1]];
      let best = cands[0], bestScore = -1;
      for (const [ox, oy] of cands) {
        const score = Math.min(...spots.map((s) => Math.hypot(hx + ox - s.x, hy + oy - s.y)), 99);
        if (score > bestScore) { bestScore = score; best = [ox, oy]; }
      }
      labelOffs.set(g.hub.id, { x: best[0], y: best[1] });
    }
  });
  const youY = R + 20;
  targets.set("you", { x: 0, y: youY });
  fitRadius = Math.max(30, youY + 6);

  const seen = new Set();
  for (const n of data.nodes) {
    seen.add(n.id);
    const tgt = targets.get(n.id) || { x: 0, y: 0 };
    const cur = nodes.get(n.id);
    if (cur) { cur.n = n; cur.tgt = tgt; }
    else nodes.set(n.id, { n, tgt, pos: { ...tgt } });
    nodes.get(n.id).labelOff = labelOffs.get(n.id) || null;
  }
  for (const id of [...nodes.keys()]) if (!seen.has(id)) nodes.delete(id);
}

function apply(d) {
  const prevStatus = new Map([...nodes.values()].map((e) => [e.n.id, e.n.status]));
  if (d.theme && d.theme.colors) {
    C = d.theme.colors;
    document.body.style.background = C.base;
  }
  data = d;
  links = d.links;
  layout();
  for (const e of nodes.values()) {
    const was = prevStatus.get(e.n.id);
    if (was && e.n.status && was !== e.n.status) pulses.push({ id: e.n.id, t0: performance.now(), color: C[STATUS[e.n.status] || "overlay"] });
  }
  lastOk = performance.now();
  renderHud();
}

async function poll() {
  try {
    const r = await fetch("data");
    if (r.ok) apply(await r.json());
  } catch {}
  renderHud();
}

function renderHud() {
  const ags = data ? data.nodes.filter((n) => n.kind === "agent") : [];
  const clusters = new Set(ags.map((a) => a.cluster || "·")).size;
  const stale = performance.now() - lastOk > 8000;
  hud.innerHTML = "";
  const line = (txt, col) => {
    const s = document.createElement("span");
    s.textContent = txt;
    s.style.color = col;
    hud.appendChild(s);
  };
  line("herd map", C.lavender);
  line(data ? `  ${ags.length} agents · ${clusters} cluster${clusters === 1 ? "" : "s"}` : "  connecting…", C.subtext);
  if (stale) line(lastOk ? "  · stale" : "  · board unreachable", C.yellow);
  legend.textContent = "── dispatch   ⇢ handoff   ┄ watch   ·· shared checkout   ▲ asks you   click = focus pane";
  legend.style.color = C.overlay;
}

const sx = (x) => Math.round((x - cam.x) * U + W / 2);
const sy = (y) => Math.round((y - cam.y) * U + H / 2);
function cell(x, y, color, alpha) {
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  ctx.fillStyle = color;
  ctx.fillRect(sx(x), sy(y), U, U);
  ctx.globalAlpha = 1;
}
function block(x, y, w, color, alpha) {
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  ctx.fillStyle = color;
  ctx.fillRect(sx(x), sy(y), U * w, U * w);
  ctx.globalAlpha = 1;
}

const DISC = [];
for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
  if (Math.abs(dx) === 2 && Math.abs(dy) === 2) continue;
  DISC.push([dx, dy]);
}
const DIAMOND = [];
for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
  if (Math.abs(dx) + Math.abs(dy) <= 2) DIAMOND.push([dx, dy]);
}

function bresenham(x0, y0, x1, y1) {
  const cells = [];
  let dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
  const stepX = x0 < x1 ? 1 : -1, stepY = y0 < y1 ? 1 : -1;
  let err = dx + dy, x = x0, y = y0;
  for (let guard = 0; guard < 4000; guard++) {
    cells.push([x, y]);
    if (x === x1 && y === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x += stepX; }
    if (e2 <= dx) { err += dx; y += stepY; }
  }
  return cells;
}

const EDGE_STYLE = {
  dispatch: { color: "subtext", skip: 1, arrow: true },
  handoff: { color: "peach", skip: 1, arrow: true },
  watch: { color: "overlay", skip: 2, arrow: true },
  couple: { color: "overlay", skip: 3, arrow: false },
  ask: { color: "red", skip: 1, arrow: true },
  on: { color: "teal", skip: 2, arrow: false },
};

function edgeAlpha(l, now) {
  if (l.kind === "couple") return l.hot ? 0.85 : 0.3;
  if (l.kind === "on") return 0.22;
  if (l.kind === "ask") return 0.9;
  const age = now - l.at;
  return age < 600e3 ? 0.95 : age < 3600e3 ? 0.65 : age < 6 * 3600e3 ? 0.45 : 0.3;
}

function snapped(e) {
  return { x: Math.round(e.pos.x), y: Math.round(e.pos.y) };
}

function chalk(text, x, y, color, alpha) {
  const a = alpha == null ? 1 : alpha;
  const w = ctx.measureText(text).width;
  ctx.globalAlpha = a * 0.75;
  ctx.fillStyle = C.base;
  ctx.fillRect(Math.round(x - w / 2) - 2, Math.round(y) - 9, Math.round(w) + 4, 12);
  ctx.globalAlpha = a;
  ctx.fillStyle = color;
  ctx.fillText(text, Math.round(x), Math.round(y));
  ctx.globalAlpha = 1;
}

function neighborsOf(id) {
  const out = new Set([id]);
  for (const l of links) {
    if (l.s === id) out.add(l.t);
    if (l.t === id) out.add(l.s);
  }
  return out;
}

function frame(now) {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = C.base;
  ctx.fillRect(0, 0, W, H);

  const lattice = 10;
  ctx.fillStyle = C.surface;
  ctx.globalAlpha = 0.7;
  const x0 = Math.floor(cam.x - W / 2 / U), x1 = Math.ceil(cam.x + W / 2 / U);
  const y0 = Math.floor(cam.y - H / 2 / U), y1 = Math.ceil(cam.y + H / 2 / U);
  for (let gx = Math.ceil(x0 / lattice) * lattice; gx <= x1; gx += lattice) {
    for (let gy = Math.ceil(y0 / lattice) * lattice; gy <= y1; gy += lattice) {
      ctx.fillRect(sx(gx), sy(gy), Math.max(1, U >> 2), Math.max(1, U >> 2));
    }
  }
  ctx.globalAlpha = 1;

  if (!data || !nodes.size) {
    ctx.fillStyle = C.subtext;
    ctx.font = "12px ui-monospace, Menlo, monospace";
    ctx.textAlign = "center";
    ctx.fillText(data ? "no agents in the herd" : "connecting…", W / 2, H / 2);
    requestAnimationFrame(frame);
    return;
  }

  const dt = 0.16;
  for (const e of nodes.values()) {
    e.pos.x += (e.tgt.x - e.pos.x) * dt;
    e.pos.y += (e.tgt.y - e.pos.y) * dt;
  }

  const ego = hover ? neighborsOf(hover) : null;
  const wall = Date.now();

  for (const l of links) {
    let ownHub = false;
    if (l.kind === "on") {
      const a = nodes.get(l.s);
      ownHub = !!a && a.n.cluster === l.t;
    }
    const a = nodes.get(l.s), b = nodes.get(l.t);
    if (!a || !b) continue;
    const st = EDGE_STYLE[l.kind] || EDGE_STYLE.dispatch;
    let alpha = edgeAlpha(l, wall) * (ownHub ? 0.5 : 1);
    if (ego && !(ego.has(l.s) && ego.has(l.t))) alpha *= 0.12;
    const color = l.kind === "couple" && l.hot ? C.red : C[st.color];
    const pa = snapped(a), pb = snapped(b);
    const path = bresenham(pa.x, pa.y, pb.x, pb.y);
    const trimmed = path.slice(3, Math.max(3, path.length - 3));
    trimmed.forEach(([x, y], i) => {
      if (i % st.skip !== 0) return;
      cell(x, y, color, alpha);
    });
    if (st.arrow && trimmed.length > 2) {
      const [hx, hy] = trimmed[trimmed.length - 2];
      block(hx, hy, 2, color, Math.min(1, alpha + 0.15));
    }
    if ((l.kind === "dispatch" || l.kind === "handoff") && wall - l.at < 600e3 && trimmed.length > 2) {
      const speed = 0.014;
      const p = Math.floor((now * speed + (hashAngle(l.s + l.t) % 97)) % trimmed.length);
      const [px, py] = trimmed[p];
      cell(px, py, C.text, ego && !(ego.has(l.s) && ego.has(l.t)) ? 0.2 : 1);
      if (p > 0) cell(trimmed[p - 1][0], trimmed[p - 1][1], C.text, 0.35);
    }
  }

  ctx.font = Math.max(9, Math.min(12, U * 2)) + "px ui-monospace, Menlo, monospace";
  ctx.textAlign = "center";

  for (const e of nodes.values()) {
    const n = e.n;
    const p = snapped(e);
    const dimmed = ego && !ego.has(n.id);
    const baseAlpha = dimmed ? 0.25 : 1;
    if (n.kind === "hub") {
      for (const [dx, dy] of DIAMOND) cell(p.x + dx, p.y + dy, C.teal, baseAlpha * (Math.abs(dx) + Math.abs(dy) === 2 ? 0.9 : 0.35));
      const off = e.labelOff || { x: 0, y: -8 };
      const nameX = sx(p.x + off.x) + U / 2;
      const nameY = sy(p.y + off.y) + (off.y > 0 ? 10 : 0);
      chalk(n.label, nameX, nameY, C.subtext, baseAlpha);
      if (n.branch) chalk(n.branch, nameX, nameY + 13, C.overlay, baseAlpha);
    } else if (n.kind === "you") {
      block(p.x - 1, p.y - 1, 3, C.lavender, baseAlpha);
      cell(p.x, p.y - 2, C.lavender, baseAlpha);
      chalk("you", sx(p.x) + U / 2, sy(p.y + 4) + U, C.lavender, baseAlpha);
    } else {
      const col = C[STATUS[n.status] || "overlay"];
      let alpha = baseAlpha;
      if (n.status === "blocked") alpha *= (now / 500) % 2 < 1 ? 1 : 0.45;
      for (const [dx, dy] of DISC) cell(p.x + dx, p.y + dy, col, alpha);
      if (n.id === data.me) cell(p.x, p.y, C.base, alpha);
      if (n.status === "working") {
        const a = now / 700 + hashAngle(n.id) % 13;
        cell(p.x + Math.round(Math.cos(a) * 4), p.y + Math.round(Math.sin(a) * 4), col, baseAlpha);
      }
      if (hover === n.id) for (const [dx, dy] of DIAMOND) {
        if (Math.abs(dx) + Math.abs(dy) === 2) cell(p.x + dx * 2, p.y + dy * 2, C.text, 0.5);
      }
      chalk(n.label, sx(p.x) + U / 2, sy(p.y + 4) + U, hover === n.id ? C.text : C.subtext, dimmed ? 0.3 : 1);
    }
  }

  for (let i = pulses.length - 1; i >= 0; i--) {
    const pu = pulses[i];
    const e = nodes.get(pu.id);
    const dtp = now - pu.t0;
    if (!e || dtp > 700) { pulses.splice(i, 1); continue; }
    const k = 3 + Math.floor(dtp / 110);
    const p = snapped(e);
    const alpha = 1 - dtp / 700;
    for (let dx = -k; dx <= k; dx++) {
      const dy = k - Math.abs(dx);
      cell(p.x + dx, p.y + dy, pu.color, alpha * 0.8);
      if (dy) cell(p.x + dx, p.y - dy, pu.color, alpha * 0.8);
    }
  }

  requestAnimationFrame(frame);
}

function nodeAt(mx, my) {
  const wx = (mx - W / 2) / U + cam.x;
  const wy = (my - H / 2) / U + cam.y;
  let best = null, bestD = 5;
  for (const e of nodes.values()) {
    const d = Math.hypot(e.pos.x - wx, e.pos.y - wy);
    if (d < bestD) { bestD = d; best = e; }
  }
  return best;
}

function ago(ms) {
  const s = Math.max(0, (Date.now() - ms) / 1000);
  if (s < 90) return "now";
  if (s < 3600) return Math.round(s / 60) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
}

function tipFor(e) {
  const n = e.n;
  const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const span = (t, col) => `<span style="color:${col}">${esc(t)}</span>`;
  const rows = [];
  if (n.kind === "agent") {
    rows.push(span(n.id, C.text) + "  " + span((GLYPH[n.status] || "·") + " " + (n.status || ""), C[STATUS[n.status] || "overlay"]));
    if (n.title) rows.push(span(n.title, C.lavender));
    if (n.tab) rows.push(span("tab  ", C.overlay) + span(n.tab, C.subtext));
    const on = links.filter((l) => l.kind === "on" && l.s === n.id).map((l) => nodes.get(l.t)).filter(Boolean);
    if (on.length) rows.push(span("◆    ", C.overlay) + span(on.map((h) => h.n.label).join("  "), C.teal));
    const talk = links.filter((l) => (l.s === n.id || l.t === n.id) && ["dispatch", "handoff", "watch", "couple"].includes(l.kind));
    for (const l of talk.sort((a, b) => b.at - a.at).slice(0, 6)) {
      const out = l.s === n.id;
      const other = out ? l.t : l.s;
      const word = { dispatch: "prompted", handoff: "handed off to", watch: "watched", couple: "shares checkout with" }[l.kind];
      const arrow = l.kind === "couple" ? "⚭ " : out ? "→ " : "⇠ ";
      const detail = l.kind === "couple"
        ? `${word} ${other}`
        : out ? `${word} ${other}${l.n > 1 ? " ×" + l.n : ""} · ${ago(l.at)}`
        : `${other} ${word.replace(" to", "")} this${l.n > 1 ? " ×" + l.n : ""} · ${ago(l.at)}`;
      rows.push(span(arrow, l.kind === "couple" && l.hot ? C.red : C.overlay) + span(detail, l.kind === "couple" && l.hot ? C.red : C.subtext));
    }
    rows.push(span("click to focus this pane", C.overlay));
  } else if (n.kind === "hub") {
    rows.push(span("◆ " + n.label, C.teal) + (n.branch ? "  " + span(n.branch, C.overlay) : ""));
    const here = links.filter((l) => l.kind === "on" && l.t === n.id).map((l) => l.s);
    rows.push(span(here.length + " agent" + (here.length === 1 ? "" : "s") + " on this checkout", C.subtext));
  } else {
    const asks = links.filter((l) => l.kind === "ask").map((l) => l.s);
    rows.push(span("you", C.lavender));
    rows.push(span(asks.length ? asks.join("  ") + " waiting on you" : "nobody blocked on you", asks.length ? C.red : C.subtext));
  }
  return rows.join("\n");
}

cv.addEventListener("mousemove", (ev) => {
  if (dragging) {
    cam.x -= (ev.clientX - dragging.x) / U;
    cam.y -= (ev.clientY - dragging.y) / U;
    dragging = { x: ev.clientX, y: ev.clientY };
    userView = true;
    return;
  }
  const e = nodeAt(ev.clientX, ev.clientY);
  hover = e ? e.n.id : null;
  hoverPx = { x: ev.clientX, y: ev.clientY };
  cv.style.cursor = e && e.n.kind === "agent" ? "pointer" : "default";
  if (e) {
    tip.innerHTML = tipFor(e);
    tip.style.display = "block";
    tip.style.background = C.surface;
    tip.style.borderColor = C.overlay;
    tip.style.color = C.text;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = Math.min(W - tw - 12, ev.clientX + 14) + "px";
    tip.style.top = Math.min(H - th - 12, ev.clientY + 14) + "px";
  } else {
    tip.style.display = "none";
  }
});

cv.addEventListener("mousedown", (ev) => { dragging = { x: ev.clientX, y: ev.clientY, moved: ev.clientX * 1e4 + ev.clientY }; });
window.addEventListener("mouseup", (ev) => {
  const wasDrag = dragging && Math.abs(ev.clientX * 1e4 + ev.clientY - dragging.moved) > 3;
  dragging = null;
  if (wasDrag) return;
  const e = nodeAt(ev.clientX, ev.clientY);
  if (e && e.n.kind === "agent") {
    fetch("focus?pane=" + encodeURIComponent(e.n.id)).catch(() => {});
    pulses.push({ id: e.n.id, t0: performance.now(), color: C.text });
  }
});

cv.addEventListener("wheel", (ev) => {
  ev.preventDefault();
  const dir = ev.deltaY > 0 ? -1 : 1;
  const next = Math.max(2, Math.min(10, U + dir));
  if (next === U) return;
  const wx = (ev.clientX - W / 2) / U + cam.x;
  const wy = (ev.clientY - H / 2) / U + cam.y;
  U = next;
  cam.x = wx - (ev.clientX - W / 2) / U;
  cam.y = wy - (ev.clientY - H / 2) / U;
  userView = true;
}, { passive: false });

cv.addEventListener("dblclick", () => { userView = false; fitView(); });
window.addEventListener("resize", resize);
cv.addEventListener("mouseleave", () => { hover = null; tip.style.display = "none"; });

resize();
renderHud();
poll();
setInterval(poll, 2500);
requestAnimationFrame(frame);
</script>
</body>
</html>
