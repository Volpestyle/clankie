      summary: Start a provider sign-in for the authenticated initiating principal
      description: |
        Reuses console sign-in helpers. Poll status for the URL and optional code,
        then open it in the initiating client's browser. Browser callbacks reach
        this Mac; phones use the device method. Credentials and the selected
        catalog model are committed together after a fresh authority check.
        Claude subscription login remains unsupported. No-store; no raw provider errors.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [providerId, method, model]
              properties:
                providerId: { type: string, maxLength: 128 }
                method: { type: string, enum: [browser, device] }
                model: { type: string, maxLength: 512 }
