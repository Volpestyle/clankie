        gateway calls require the encrypted envelope. Never returns or logs a token or
        provider error text. Cache-Control no-store.
        Includes service purpose, permission disclosure, account identity, granted scopes,
        recovery status and selected Drive file IDs. An unconfigured Google row needs
        operator OAuth client setup; it does not request a customer credential.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountsResponse" }
        "401": { description: authentication_required }
