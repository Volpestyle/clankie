    post:
      tags: [Operator]
      operationId: connectLinearApp
      summary: Connect a workspace-owned Linear app for worker names and portraits
      description: |
        Verifies an app actor and workspace before replacing the Linear credential.
        Owner operator bearer or active device with terminalControl only. Public
        gateway calls require the encrypted envelope. Client credentials and tokens
        stay in the broker and are never returned or logged. Cache-Control no-store.
        Enable client credentials tokens on the workspace's Linear OAuth application.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [clientId, clientSecret]
              properties:
                clientId: { type: string, minLength: 1, maxLength: 256 }
                clientSecret: { type: string, minLength: 1, maxLength: 4096, writeOnly: true }
      responses:
        "200":
          description: Verified connection with actor and workspace; no credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountResult" }
        "400":
          description: malformed or provider_rejected; previous connection retained
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountResult" }
        "401": { description: authentication_required }
        "403": { description: forbidden — terminalControl required }
        "503": { description: unavailable }
  /v1/accounts/google/start:
    post:
      tags: [Operator]
      operationId: startGoogleAccount
      summary: Start body-owned Google consent with state and S256 PKCE
      description: |
        Owner operator bearer or active device with terminalControl only. Public gateway
        calls require the encrypted envelope. The body retains the verifier and keeps
        all client secrets and tokens in its broker. Cache-Control no-store.
        Gmail requests gmail.readonly plus openid email. Calendar requests
        calendar.calendarlist.readonly and calendar.events.readonly plus openid email.
        Drive requests only drive.file and opens Google Picker with prompt consent,
        trigger_onepick true and include_granted_scopes false. Google's selected-file
        grant permits editing; Clankie's implemented tools only read selected files.
        All flows request offline access. Client setup and browser consent are required.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountGoogleStartRequest" }
      responses:
        "200":
          description: One-time state, registered redirect, consent URL and expiry; no token or verifier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountGoogleStartSuccess" }
        "400":
          description: Closed failure code, including malformed, unconfigured or unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountFailure" }
        "401":
          description: authentication_required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountFailure" }
        "403":
          description: forbidden — terminalControl required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountFailure" }
        "413":
          description: malformed — body exceeds 16 KiB
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountFailure" }
        "503":
          description: unavailable — body, broker or current owner authority could not be verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountFailure" }
  /v1/accounts/google/complete:
    post:
      tags: [Operator]
      operationId: completeGoogleAccount
      summary: Exchange the one-time Google code on the tenant body
      description: |
        Owner operator bearer or active device with terminalControl only. Public gateway
        calls require the encrypted envelope. State is single use, bound to this body's
        pending provider, OAuth application and expiry. The body verifies provider identity
        and granted scopes before storing credentials; no tokens or provider errors escape.
        Gmail and Calendar accept provider, state and code only. Drive also requires a
        nonempty unique pickedFileIds array, validated from Google Picker's picked_file_ids
        callback. These IDs bound the files the implemented Drive read tools can access.
        Cache-Control no-store. Authorization codes belong in the JSON body, never API request URLs or logs.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountGoogleCompleteRequest" }
      responses:
        "200":
          description: Verified account connection and granted permissions; no credential
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountGoogleCompleteSuccess" }
        "400":
          description: Closed failure code, including malformed, unknown_flow, expired, unconfigured, provider_rejected or unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountFailure" }
        "401":
          description: authentication_required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountFailure" }
        "403":
          description: forbidden — terminalControl required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountFailure" }
        "413":
          description: malformed — body exceeds 32 KiB (including selected file IDs)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountFailure" }
        "503":
          description: unavailable — body, broker or current owner authority could not be verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountFailure" }
  /v1/accounts/google/check:
    post:
      tags: [Operator]
      operationId: checkGoogleAccount
      summary: Refresh and verify the selected Google account's authorized access
      description: |
        Owner operator bearer or active device with terminalControl only. Public gateway
        calls require the encrypted envelope. The body refreshes the selected grant under
        the credential-store lock and verifies its identity, scopes and disconnect epoch.
        Returns catalog metadata and last-check status without exposing credentials.
        Invalid grants require renewed consent; provider outages do not imply revocation.
        Cache-Control no-store.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountGoogleStartRequest" }
      responses:
        "200":
          description: Current verified account connection and check metadata; no credential
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountGoogleCompleteSuccess" }
        "400":
          description: Closed failure code, including malformed, unconfigured, denied, provider_rejected or unavailable; list accounts for recovery status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountFailure" }
        "401":
          description: authentication_required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountFailure" }
        "403":
          description: forbidden — terminalControl required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountFailure" }
        "413":
          description: malformed — body exceeds 16 KiB
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountFailure" }
        "503":
          description: unavailable — body, broker or current owner authority could not be verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountFailure" }
  /v1/accounts/disconnect:
    post:
      tags: [Operator]
      operationId: disconnectAccount
      summary: Disconnect locally and report actual provider revocation
      description: |
        Owner operator bearer or active device with terminalControl only (ADR 0232). Public
        gateway calls require the encrypted envelope. Never returns or logs a token or
        provider error text. Cache-Control no-store.
        revoked is false when the provider could not confirm revocation; local access is
        disabled either way and manageUrl names where to review the grant.
        Disconnecting any Google provider disables all three Google connections on this
        body. Its broker may retain a refresh credential solely for bounded revocation
        retries; catalog revocationPending remains true until Google confirms revocation.
        Hosted GitHub disconnect never uses a developer app secret and reports revoked false.
        Owner-run self-hosted GitHub revocation deletes only the stored token, never an app grant.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [provider],
                additionalProperties: false,
                properties: { provider: { $ref: "#/components/schemas/AccountProvider" } },
              }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountResult" }
        "400":
          description: A closed error code (malformed, unconfigured, unknown_flow, expired, denied, provider_rejected)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountResult" }
        "401": { description: authentication_required }
        "403": { description: forbidden — terminalControl required }
        "503": { description: unavailable }
  /v1/connections:
    get:
      tags: [Operator]
      operationId: getConnectionInventory
      summary: Inspect execution runtimes and verified Linear identity
      security: [{ operatorBearer: [] }]
      responses:
        "200": { description: Current runtime health and recorded account identity }
        "401": { description: Operator authentication required }
        "503": { description: Operator authentication unavailable }
  /v1/runtime-connections:
    get:
      tags: [Operator]
      operationId: listRuntimeConnections
      summary: Inspect the default fleet and named execution connections
      security: [{ operatorBearer: [] }]
      responses:
        "200": { description: Configured endpoints and freshly probed health }
        "401": { description: Operator authentication required }
        "503": { description: Operator authentication unavailable }
    post:
      tags: [Operator]
      operationId: connectRuntime
      summary: Connect a Herdr runtime or configure owner execution policy
      description: Resolves an explicit session or socket and pins that endpoint to the ID. Reconnection cannot retarget an existing ID. action=workspaces replaces additional repository/directory approvals for a named or default runtime; it never starts or stops workers. action=capacity sets one runtime limit; Unset limits default to 16; null clears a limit to unlimited; zero pauses new admission.
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              oneOf:
                - required: [id]
                  anyOf: [{ required: [session] }, { required: [socketPath] }]
                  not: { required: [action] }
                - required: [id, action, workspaces]
                  properties: { action: { const: workspaces } }
                  not:
                    {
                      anyOf:
                        [
                          { required: [session] },
                          { required: [socketPath] },
                          { required: [kind] },
                          { required: [capacity] },
                          { required: [capabilities] },
                        ],
                    }
                - required: [id, action, capacity]
                  properties: { action: { const: capacity } }
                  not:
                    {
                      anyOf:
                        [
                          { required: [workspaces] },
                          { required: [session] },
                          { required: [socketPath] },
                          { required: [kind] },
                          { required: [capabilities] },
                        ],
                    }
              properties:
                id:
                  {
                    type: string,
                    pattern: "^[a-z][a-z0-9-]{0,63}$",
                    description: "default is reserved except for workspace and capacity configuration",
                  }
                action: { type: string, enum: [workspaces, capacity] }
                workspaces:
                  type: array
                  maxItems: 32
                  items:
                    type: object
                    additionalProperties: false
                    required: [kind, path]
                    properties:
                      kind: { type: string, enum: [repository, directory] }
                      path:
                        {
                          type: string,
                          maxLength: 4096,
                          pattern: "^/",
                          description: "Existing absolute checkout or exact directory; repository identity is stored as canonical git-common-dir",
                        }
                kind: { type: string, enum: [herdr], default: herdr }
                session: { type: string, maxLength: 64 }
                socketPath:
                  {
                    type: string,
                    maxLength: 102,
                    description: "Absolute Unix socket path, at most 102 UTF-8 bytes",
                  }
                capacity: { type: [integer, "null"], minimum: 0, default: 16 }
                capabilities:
                  { type: array, maxItems: 32, items: { type: string }, default: [code, review, research] }
      responses:
        "200": { description: Persisted connection }
        "400": { description: Invalid connection }
        "401": { description: Operator authentication required }
        "409":
          {
            description: "Endpoint unavailable, identity conflict or coordinator synchronization failed; inspect state before retrying",
          }
        "503": { description: Execution management or authentication unavailable }
  /v1/runtime-connections/{id}:
    delete:
      tags: [Operator]
      operationId: disconnectRuntime
      summary: Disable a named execution connection while preserving workers and route identity
      security: [{ operatorBearer: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Connection disabled and coordinator routes synchronized }
        "401": { description: Operator authentication required }
        "409":
          { description: Unknown connection or synchronization unconfirmed; inspect state before retrying }
        "503": { description: Execution management or authentication unavailable }
  /v1/work:
    post:
      tags: [Operator]
      operationId: workItems
      summary: Read and write work items in the repo's own tracking convention
      description: >-
        One contract over Linear, GitHub issues, the repo's own Markdown directory, or
        .clankie/work/ (ADR 0191). `action` is repos, discover, init, list, show, project, create,
        update, attach, write or write_receipt. The two narrow owner operations take
        request {repoId,itemId,requestId,command}; receipt reads omit command. The
        command assigns work-metadata owner, adds/removes a role label or appends a
        blocker. Their applied/refused/uncertain receipt always carries the UUID;
        repeated IDs and receipt reads never replay a write. A path names and registers a local repo; registered repos are
        readable from paired devices through the work_repos, work_items and work_project operator ops.
        work_items statusVersion=2 opts into backlog and native milestone metadata;
        older requests receive backlog as todo. project reads planned milestones,
        shipped v* tags/published versions and Linear initiative goals. init accepts
        releaseSource (tags, milestones, both; default both) and releaseLane
        (default repository). Unavailable facts are explicit; store builds are not inferred.
        list takes optional status, owner and label (case-insensitive) filters; items carry
        the backend's labels (ADR 0208).
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [action], properties: { action: { type: string } } }
      responses:
        "200": { description: The repos, discovery, recorded convention, items, or one item }
        "400": { description: Invalid request, or a write a device may not make }
        "401": { description: Operator authentication required }
        "404": { description: Unknown repo or work item }
        "409": { description: The repo needs its convention decided, or its recorded backend is unavailable }
        "502": { description: The backend refused or failed the request }
  /v1/linear/routes:
    get:
      tags: [Operator]
