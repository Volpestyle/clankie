      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OwnerVoiceUpdate" }
      responses:
        "200":
          description: Saved snapshot and revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerVoiceSnapshot" }
        "400": { description: Invalid or unfenced settings update }
        "401": { description: Authentication required }
        "403": { description: Owner authority required }
        "409": { description: Stale revision, changed owner authority or unsupported preference }
        "503": { description: Settings unavailable }
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Public liveness
      description: Optional Herdr, gateway, host-power, runtime identity and runtimeHealth findings do not change service liveness. `runtimeHealth` contains fixed CPU percentage, health latency, duration, reason/alarm/delivery enums and incident timestamps; no conversation content. `power` says whether this host may sleep and when it last did (`@clankie/protocol/host-power`; docs/always-on.md). When available, `runtime` exposes only this service boot's pid, commit, root and instanceId; update transaction details are omitted.
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              example:
                {
                  ok: true,
                  service: clankie,
                  runtime:
                    {
                      pid: 1234,
                      commit: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa,
                      root: /fixture/pinned,
                      instanceId: 11111111-1111-4111-8111-111111111111,
                    },
                  power:
                    {
                      state: sleep_allowed,
                      source: battery,
                      sleepAfterMinutes: 1,
                      heldAwakeBy: [],
                      keepAwakeRequested: false,
                    },
                }

  /v1/herdr:
    get:
      tags: [Operator]
      operationId: getHerdrBinding
      summary: Running service's worker-runtime binding
      description: Without a connection ID, pending default-fleet settings apply on service restart. Named connections resolve their pinned endpoint and current health. No unavailable connection falls back to the default fleet.
      parameters:
        - in: query
          name: connection
          schema: { type: string }
          description: Named runtime connection, or default
      security: [{ operatorBearer: [] }]
      responses:
        "200":
          description: Selected local worker runtime
