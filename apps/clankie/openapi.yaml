  /v1/linear/deliveries:
    get:
      tags: [Operator]
      operationId: inspectLinearWakeDeliveries
      summary: Inspect offered Linear wake batches, destinations and target consumption receipts
      description: Offered batches may have failed before delivery. receivedAt is set only by the target chat confirming its original wake; native transport ACKs alone do not mark Linear notifications read.
      security:
