openapi: 3.1.0
info:
  title: Clankie
  version: "0.2.0"
  description: |
    Local `apps/clankie` service on `http://127.0.0.1:4310`. There is no HTML
    index: `/` is 404 and `GET /health` is the public probe.

    Most other routes take an `Authorization: Bearer <token>` header. Pairing
    redeem/complete use their one-time offer secrets instead. Persistent tokens
    live in the credential broker (Keychain service `bot.clankie.credentials`):

    | Principal | Keychain account | Typical use |
    | --- | --- | --- |
    | Operator | `clankie_operator` | TUI operator reads/writes, pairing, devices, play stop |
    | Captain | `clankie_captain` (also `CLANKIE_CAPTAIN_TOKEN`) | `/operator/v1/dispatch`, `/captain/v1/lanes` |
    | Discord text | `clankie_discord_bridge` | Discord channel turns, presence, person memory |
    | Discord voice | `clankie_discord_voice_bridge` | Voice briefing; voice-lane channel turns |
    | Discord user text | `clankie_discord_user_bridge` | Lab-user channel turns and presence |
    | Discord user voice | `clankie_discord_user_voice_bridge` | Lab-user voice-lane turns |
    | Device | minted at pairing complete | `/v1/devices/self*` |

    Discord-lane routes 403 if the bearer is the console captain token (steer
    source `api`). Import this file in Yaak (Settings → Import/Export) or run
    `apps/clankie/scripts/setup-yaak.py`.
servers:
  - url: http://127.0.0.1:4310
    description: Local service
tags:
  - name: Health
  - name: Operator
  - name: Captain
  - name: Discord
  - name: Memory
  - name: Embodiment
  - name: Browser
  - name: Media
  - name: Pairing
  - name: Devices
  - name: Support
  - name: Workers
security: []

paths:
  /v1/machines/{id}/access:
    patch:
      tags: [Operator]
      operationId: setMachineAccess
      summary: Set the owner-chosen machine capability ceiling
      description: |
        Cumulative portal, workers, shell and screen levels. Existing local installs
        retain screen; ungranted remote machines start at portal. Current enforcement
        is a service preference, not OS isolation or joined-host proof. Actor and
        directory grants remain independent. Workers cannot raise their own level.
      security: [{ operatorBearer: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        description: Maximum 4096 bytes.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [accessLevel]
              properties:
                accessLevel:
                  type: string
                  enum: [portal, workers, shell, screen]
      responses:
        "200":
          description: Persisted canonical machine ID, accessLevel and accessEnforcement (service-preference)
        "400":
          description: Unknown machine or invalid access request
        "401":
          description: Operator authentication required
        "413":
          description: Request too large
        "503":
          description: Operator authentication or machine registry unavailable
  /v1/checkouts:
    get:
      tags: [Operator]
      operationId: inspectOwnerCheckouts
      summary: Inspect enrolled local owner checkouts against cached origin/main
      security: [{ operatorBearer: [] }]
      responses:
        "200":
          description: Observation time, cached ref freshness, checkout branch, HEAD, ahead/behind, dirty state, stale/linked worktree counts, and unreconciled linked worktrees (commits not on main by content, uncommitted files) with owner, age and any recorded decision
        "401":
          description: Operator authentication required
        "503":
          description: Checkout maintenance unavailable
  /v1/checkouts/sync:
    post:
      tags: [Operator]
      operationId: syncOwnerCheckouts
      summary: Fetch and safely fast-forward enrolled owner main checkouts
      description: Preserves local commits and overlapping edits; blocked results name files and modification age. Never stashes or resets.
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                repository:
                  {
                    type: string,
                    description: Exact enrolled owner checkout; omit for all local repositories,
                  }
      responses:
        "200":
          description: Per-checkout current, updated, blocked or unavailable results with blockers and ageSeconds
        "400":
          description: Invalid request
        "401":
          description: Operator authentication required
        "409":
          description: Repository enrollment refused
  /v1/checkouts/prune:
    post:
      tags: [Operator]
      operationId: pruneLandedWorktree
      summary: Preserve evidence and remove one landed clean inactive enrolled worktree
      description: Landed means merged, on main by content (git cherry), or a recorded safe_to_drop decision for its exact HEAD, whose commits stay under refs/clankie/dropped-worktrees/. Fetches main, copies ignored .local evidence, rechecks cwd and foreground cwd of local panes, and uses git worktree remove without force. Deletes only merged branches. Main and runtime trees stay protected.
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [repository, path]
              properties:
                repository: { type: string }
                path: { type: string }
      responses:
        "200":
          description: Removed, kept or unavailable result with evidencePath and branchDeleted when applicable
        "400":
          description: Invalid request
        "401":
          description: Operator authentication required
        "409":
          description: Enrollment or nested-worktree protection refused
  /v1/checkouts/decide:
    post:
      tags: [Operator]
      operationId: decideWorktree
      summary: Record a judgment of one linked worktree's unlanded work
      description: Records worth_landing or safe_to_drop with a one-line reason for the worktree's current HEAD. Doctor and tidy show it; a new commit invalidates it. Never removes anything.
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [repository, path, decision, reason]
              properties:
                repository: { type: string, description: Exact enrolled owner checkout }
                path: { type: string, description: A linked worktree registered to that checkout }
                decision: { type: string, enum: [worth_landing, safe_to_drop] }
                reason: { type: string, maxLength: 512 }
      responses:
        "200":
          description: The recorded decision with HEAD, unlanded commit and uncommitted file counts
        "400":
          description: Invalid request
        "401":
          description: Operator authentication required
        "409":
          description: Not a registered linked worktree, or its state is unreadable
  /v1/activity/shares:
    post:
      tags: [Media]
      operationId: controlActivityShares
      summary: Control owner-authorized Activity media shares
      description: |
        Projects existing play or an exact hash-bound delivered PNG/GIF/MP4/WAV/MP3.
        Tenant and installation scope are service-assigned. No source path/URL or
        new capture permission is accepted. Hosted owner controls use the existing
        encrypted paired-device operator bridge; the private edge verifies the
        destination and returns a scoped launch/stop receipt. A confirmed invite
        is not evidence that an audience opened it. Local delegated shares retain
        their separate read grants; official local admission is a pending decision.
        Source switch advances generation and invalidates old media/grants.
        Stop, expiry and producer loss are terminal. Controls never retry;
        uncertainty carries operation and share/generation when known.
        Successful responses use Cache-Control no-store. See docs/cli.md#activity-shares.
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action]
                  properties:
                    action: { const: list }
                - type: object
                  additionalProperties: false
                  required: [action, conversationId, artifactId, guildId, channelId]
                  properties:
                    action: { const: image }
                    conversationId: { type: string, minLength: 1, maxLength: 256 }
                    artifactId: { type: string, pattern: "^[a-f0-9]{48}$" }
                    guildId: { type: string, pattern: "^[0-9]{1,32}$" }
                    channelId: { type: string, pattern: "^[0-9]{1,32}$" }
                    ttlMs: { type: integer, minimum: 1, maximum: 7200000 }
                - type: object
                  additionalProperties: false
                  required: [action, sourceId, guildId, channelId]
                  properties:
                    action: { const: start }
                    sourceId: { type: string, minLength: 1, maxLength: 128 }
                    guildId: { type: string, pattern: "^[0-9]{1,32}$" }
                    channelId: { type: string, pattern: "^[0-9]{1,32}$" }
                    ttlMs: { type: integer, minimum: 1, maximum: 7200000 }
                - type: object
                  additionalProperties: false
                  required: [action, shareId, generation, sourceId]
                  properties:
                    action: { const: switch }
                    shareId: { type: string, format: uuid }
                    generation: { type: integer, minimum: 1 }
                    sourceId: { type: string, minLength: 1, maxLength: 128 }
                - type: object
                  additionalProperties: false
                  required: [action, shareId, generation, conversationId, artifactId]
                  properties:
                    action: { const: switch }
                    shareId: { type: string, format: uuid }
                    generation: { type: integer, minimum: 1 }
                    conversationId: { type: string, minLength: 1, maxLength: 256 }
                    artifactId: { type: string, pattern: "^[a-f0-9]{48}$" }
                - type: object
                  additionalProperties: false
                  required: [action, shareId, generation]
                  properties:
                    action: { type: string, enum: [stop, grant] }
                    shareId: { type: string, format: uuid }
                    generation: { type: integer, minimum: 1 }
      responses:
        "200":
          description: List returns sessions; image/switch returns session; grant returns grant and expiresAt; stop returns stopped true
        "400": { description: Invalid request or PNG media }
        "401": { description: Current owner operator authentication required }
        "404": { description: Exact artifact or active share unavailable }
        "409": { description: Stale generation, capacity or refused private control }
        "429": { description: Local owner share request queue is at capacity }
        "503":
          {
            description: Activity unavailable or possibly dispatched private control with typed uncertain outcome,
          }
  /v1/integrate:
    post:
      tags: [Operator]
      operationId: integrate
      summary: Compose, gate and land an ordered approved commit batch
      description: |
        Source-checkout service only. Run returns a durable request receipt immediately; poll status.
        Compatible requests waiting during a gate share the next batch. Conflicting members
        roll back; failed shared gates split until failing members are reported. Status without
        an id returns running batches, waiting requests, the last result and interrupted work.
        Independent clones and detached core/app sibling worktrees install real packages
        and run pnpm check with private home, state, credentials and caches. Only the
        recorded zero-exit exact HEAD may land. Core pushes first; app failure retains
        partial core-landed/app-pending evidence. Revert selects a passed batch via restore
        and creates a new commit restoring its tree. No force push or automatic push retry.
        Holds never expire; explicit overrides name every hold, actor and reason and are
        durably audited. Only the authenticated operator can invoke this route.
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, id]
                  properties:
                    action: { const: run }
                    id: { type: string, format: uuid }
                    core:
                      type: array
                      maxItems: 100
                      items: { type: string, pattern: "^[a-f0-9]{7,64}$" }
                      default: []
                    app:
                      type: array
                      maxItems: 100
                      items: { type: string, pattern: "^[a-f0-9]{7,64}$" }
                    restore:
                      {
                        type: string,
                        format: uuid,
                        description: Passed batch whose tree to restore; mutually exclusive with core/app commits,
                      }
                    push: { type: boolean, default: false }
                    overrides:
                      {
                        type: array,
                        maxItems: 32,
                        items: { $ref: "#/components/schemas/DeployHoldOverride" },
                      }
                - type: object
                  additionalProperties: false
                  required: [action]
                  properties:
                    action: { const: status }
                    id: { type: string, format: uuid }
                - type: object
                  additionalProperties: false
                  required: [action, id]
                  properties:
                    action: { const: push }
                    id: { type: string, format: uuid }
                    overrides:
                      {
                        type: array,
                        maxItems: 32,
                        items: { $ref: "#/components/schemas/DeployHoldOverride" },
                      }
                - type: object
                  additionalProperties: false
                  required: [action]
                  properties:
                    action: { const: holds }
                - type: object
                  additionalProperties: false
                  required: [action, id, holder, reason]
                  properties:
                    action: { const: hold }
                    id: { type: string, format: uuid }
                    holder: { type: string, minLength: 1, maxLength: 512 }
                    reason: { type: string, minLength: 1, maxLength: 512 }
                    pane: { type: string, description: Herdr pane ID; fleet-qualified for remote holders }
                    seat:
                      {
                        type: string,
                        description: Native seat/terminal ID; fleet-qualified for remote holders,
                      }
                - type: object
                  additionalProperties: false
                  required: [action, id, actor, reason]
                  properties:
                    action: { const: release }
                    id: { type: string, format: uuid }
                    actor: { type: string, minLength: 1, maxLength: 512 }
                    reason: { type: string, minLength: 1, maxLength: 512 }
      responses:
        "200":
          description: Durable request receipt, queue or holds; inspect ok and batch.state for failures/partial landing
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  error: { type: string }
                  holds: { type: array, items: { $ref: "#/components/schemas/DeployHold" } }
                  queue:
                    type: object
                    required: [running, waiting, interrupted]
                    properties:
                      running:
                        {
                          type: array,
                          items: { type: object },
                          description: Active integration batches with state and member requests,
                        }
                      waiting:
                        {
                          type: array,
                          items: { type: object },
                          description: Queued request receipts in admission order,
                        }
                      lastResult:
                        { type: object, description: Most recently completed batch and its evidence }
                      interrupted:
                        {
                          type: array,
                          items: { type: object },
                          description: Active records without a current process owner,
                        }
                  batch:
                    type: object
                    required: [schemaVersion, id, state, evidence, repos, createdAt, updatedAt, request]
                    properties:
                      schemaVersion: { const: 1 }
                      id: { type: string, format: uuid }
                      state:
                        {
                          type: string,
                          enum:
                            [
                              queued,
                              composing,
                              conflict,
                              installing,
                              gating,
                              isolating,
                              failed,
                              passed,
                              held,
                              pushing,
                              pushed,
                              partial,
                              interrupted,
                            ],
                        }
                      evidence: { type: string, description: Durable local record.json path }
                      error: { type: string }
                      createdAt: { type: string, format: date-time }
                      updatedAt: { type: string, format: date-time }
                      request: { type: object }
                      batchId:
                        {
                          type: string,
                          format: uuid,
                          description: Shared attestation for this request receipt,
                        }
                      attempts: { type: array, items: { type: string, format: uuid } }
                      members:
                        {
                          type: array,
                          items: { type: object },
                          description: Original requests included in this shared attempt,
                        }
                      excluded:
                        {
                          type: array,
                          items: { type: object },
                          description: Conflicting or failed members rolled back before gating,
                        }
                      repos:
                        type: array
                        items:
                          type: object
                          description: Source/origin/base, directory, HEAD, per-commit conflict results, install/gate exit and tested HEAD, per-repo push outcome and logs
        "400": { description: Malformed request }
        "403": { description: Actual operator required }
        "409": { description: Unknown record, identity conflict, busy operation or refused landing }
        "503": { description: Repository integration unavailable }
  /v1/activity/viewer:
    post:
      tags: [Media]
      operationId: readAuthorizedActivityMedia
      summary: Read hosted Activity media with a live audience authorization
      description: |
        Internal outbound-body route. Requires a fleet-signed media-only permit
        bound to the exact session and opaque live edge authorization. The body
        independently revalidates current audience authority and destination,
        including on quiet streams. Neither operator nor captain bearer grants
        this route. The gateway exposes read-only media to an admitted SDK viewer;
        it never exposes controller credentials or chooses a host from browser input.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [session, authorization, permit]
              properties:
                session:
                  {
                    type: object,
                    description: Exact finite share,
                    generation,
                    trusted tenant/installation/room scope and source,
                  }
                authorization: { type: string, minLength: 32, maxLength: 128 }
                permit: { type: string, minLength: 1, maxLength: 8192 }
      responses:
        "200":
          description: Bounded read-only session and PNG/PCM lifecycle envelopes; live authority required throughout
          content:
            application/x-ndjson:
              schema: { type: string }
        "403": { description: Invalid, expired, cross-scope or revoked audience authority }
        "503": { description: Hosted Activity unavailable }
  /v1/runtime-update:
    get:
      tags: [Operator]
      operationId: runtimeUpdateStatus
      summary: Read runtime-update status and current deploy holds
      security: [{ operatorBearer: [] }]
      parameters:
        - in: query
          name: ref
          schema: { type: string, minLength: 1, maxLength: 256 }
          description: Fetch and preview this target, including new commit count and latest summaries
      responses:
        "200":
          {
            description: Runtime boot identity,
            durable operation status,
            holds with canary causes and measurements,
            and optional target preview,
          }
        "403": { description: Operator required }
        "503": { description: Runtime updater unavailable }
    post:
      tags: [Operator]
      operationId: runtimeUpdate
      summary: Admit a local pinned-runtime deployment after the deploy-hold check
      security: [{ operatorBearer: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ref: { type: string, minLength: 1, maxLength: 256, default: main }
                overrides:
                  { type: array, maxItems: 32, items: { $ref: "#/components/schemas/DeployHoldOverride" } }
                overrideHolds:
                  {
                    type: boolean,
                    description: Owner-explicit override of all current holds; requires reason and excludes overrides,
                  }
                reason:
                  {
                    type: string,
                    minLength: 1,
                    maxLength: 512,
                    description: Required nonblank reason for overrideHolds; audit actor is derived from authenticated owner,
                  }
      responses:
        "202": { description: Accepted durable update, not completed deployment }
        "409": { description: Named deploy hold or other refusal; detail describes the blocker }
        "403": { description: Operator required or revoked }
        "400": { description: Invalid update request }
        "503": { description: Runtime updater unavailable }
  /v1/discord/settings:
    get:
      tags: [Discord]
      operationId: discordSettings
      summary: Read Discord server roles, owners, room skills, fleet and tracking
      description: >-
        Operator-authorized non-secret settings, their revision and the shared
        setup definition. Normal setup connects a server with participant or
        admin, fleetEnabled and trackingLevel (off, project_updates,
        project_activity, all_issues). Raw IDs and machine grants stay under
        Advanced. The role-correct invitation and gateway checks are read-only.
      security: [{ operatorBearer: [] }]
      responses:
        "200":
          description: settings, revision and optional setup definition, role invite and permission checks
        "403":
          description: Operator authority required
    post:
      tags: [Discord]
      operationId: discordSettingsUpdate
      summary: Save revision-fenced non-secret Discord settings
      description: >-
        Requires settings and expectedRevision. servers records role and owners (me, everyone or role with ownerRoleId); roomSkills records a serverId, channelId and known skill. Omitted ownership fields from older clients are preserved. Legacy guild/channel machine grants are retired. Connecting a server projects its
        ingress, presence and voice scope while preserving machine grants and
        lab opt-in. Stale writes are refused. Saving never posts to Discord.
        Admin actions refuse server deletion and ownership transfer at the body.
      security: [{ operatorBearer: [] }]
      responses:
        "200":
          description: Saved settings, new revision and setup metadata
        "400":
          description: Invalid or unknown settings
        "403":
          description: Operator authority required or revoked
        "409":
          description: Settings revision changed
  /v1/discord/setup/test-post:
    post:
      tags: [Discord]
      operationId: discordSetupTestPost
      summary: Explicitly send one owner-requested setup message to a text room
      description: >-
        Settings-level operator authority is required; Observe or Steer cannot post.
        The current settings revision, connected account and Send Messages evidence
        are checked before dispatch. Reads, setup opening and picker edits never
        call this operation. Missing native receipts are unconfirmed and never retried.
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [guildId, channelId, expectedRevision]
              properties:
                guildId: { type: string, pattern: '^\d{5,32}$' }
                channelId: { type: string, pattern: '^\d{5,32}$' }
                expectedRevision: { type: string, pattern: "^[a-f0-9]{64}$" }
      responses:
        "200":
          description: posted with messageId, unavailable with reason, or unconfirmed with post_receipt_unavailable
        "400":
          description: Invalid request
        "403":
          description: Operator authority required or revoked
        "409":
          description: Settings or active account configuration changed
  /v1/discord/ingress:
    post:
      tags: [Discord]
      operationId: discordIngress
      summary: Admit an encrypted Discord turn or scoped voice callback
      description: >-
        Remote connection API, not an operator bearer. P-256 ECDH and AES-GCM
        protect request and response; a 60-second Ed25519 fleet permit binds the
        tenant, installation, event digest and ephemeral response recipient.
        Durable delivery dedupe prevents repeated captain effects. Voice callbacks use
        the existing briefing, attributed captain handoff and three voice self-tools.
        See docs/discord-ingress.md.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, permit, ephemeralPublicKey, nonce, sealed]
              properties:
                version: { type: integer, enum: [1] }
                permit: { type: string, maxLength: 4096 }
                ephemeralPublicKey: { type: string, minLength: 87, maxLength: 87 }
                nonce: { type: string, minLength: 22, maxLength: 22 }
                sealed: { type: string, maxLength: 100000 }
      responses:
        "200":
          description: Sealed pending, reply, voice operation, silent or failed result
        "401":
          description: Invalid, expired, unsealed or wrongly scoped event
        "409":
          description: Delivery id already binds another event
        "413":
          description: Envelope exceeds the byte limit
        "429":
          description: Durable inbox is at capacity
        "503":
          description: Durable admission unavailable
  /v1/composer/transcription/status:
    get:
      tags: [Devices]
      operationId: composerTranscriptionStatus
      summary: Read local or managed availability and included allowance
      security: [{ deviceBearer: [] }]
      description: |
        Active ordinary paired device with chat access only; captain/operator
        bearers and support devices are refused. Gateway calls preserve the
        existing encrypted device envelope. No-store; never logs audio or text.
      responses:
        "200":
          description: Availability and bounds
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComposerTranscriptionStatus" }
        "400": { description: Invalid request or PCM WAV audio }
        "401": { description: Active paired device session required }
        "403": { description: Forbidden, ineligible or included allowance exhausted }
        "404": { description: Request does not belong to this device }
        "409": { description: Recording id, byte offset or lifecycle conflict }
        "413": { description: Request exceeds the bounded chunk envelope }
        "429": { description: Capacity or rate limit reached }
        "503": { description: Managed transcription unavailable }
  /v1/composer/transcription/begin:
    post:
      tags: [Devices]
      operationId: composerTranscriptionBegin
      summary: Begin one bounded composer recording
      security: [{ deviceBearer: [] }]
      description: |
        Active ordinary paired device with chat access only; captain/operator
        bearers and support devices are refused. Gateway calls preserve the
        existing encrypted device envelope. No-store; never logs audio or text.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComposerTranscriptionBegin" }
      responses:
        "200":
          description: Device-scoped draft receipt; only complete carries text
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComposerTranscriptionReceipt" }
        "400": { description: Invalid request or PCM WAV audio }
        "401": { description: Active paired device session required }
        "403": { description: Forbidden, ineligible or included allowance exhausted }
        "404": { description: Request does not belong to this device }
        "409": { description: Recording id, byte offset or lifecycle conflict }
        "413": { description: Request exceeds the bounded chunk envelope }
        "429": { description: Capacity or rate limit reached }
        "503": { description: Managed transcription unavailable }
  /v1/composer/transcription/chunk:
    post:
      tags: [Devices]
      operationId: composerTranscriptionChunk
      summary: Append one recording chunk at an exact byte offset
      security: [{ deviceBearer: [] }]
      description: |
        Active ordinary paired device with chat access only; captain/operator
        bearers and support devices are refused. Gateway calls preserve the
        existing encrypted device envelope. No-store; never logs audio or text.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComposerTranscriptionChunk" }
      responses:
        "200":
          description: Device-scoped draft receipt; only complete carries text
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComposerTranscriptionReceipt" }
        "400": { description: Invalid request or PCM WAV audio }
