        "200":
          description: New pending interaction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelSubscriptionResult" }
        "400": { description: malformed or unsupported provider/model }
        "401": { description: authentication_required }
        "403": { description: forbidden }
