openapi: 3.1.0
info:
  title: Clankie
  version: "0.2.0"
  description: |
    Local `apps/clankie` service on `http://127.0.0.1:4310`. There is no HTML
    index: `/` is 404 and `GET /health` is the public probe.

    Most other routes take an `Authorization: Bearer <token>` header. Pairing
    redeem/complete use their one-time offer secrets instead. Persistent tokens
    live in the credential broker (Keychain service `bot.clankie.credentials`):

    | Principal | Keychain account | Typical use |
    | --- | --- | --- |
    | Operator | `clankie_operator` | TUI operator reads/writes, pairing, devices, play stop |
    | Captain | `clankie_captain` (also `CLANKIE_CAPTAIN_TOKEN`) | `/operator/v1/dispatch`, `/captain/v1/lanes` |
    | Discord text | `clankie_discord_bridge` | Discord channel turns, presence, person memory |
    | Discord voice | `clankie_discord_voice_bridge` | Voice briefing; voice-lane channel turns |
    | Discord user text | `clankie_discord_user_bridge` | Lab-user channel turns and presence |
    | Discord user voice | `clankie_discord_user_voice_bridge` | Lab-user voice-lane turns |
    | Device | minted at pairing complete | `/v1/devices/self*` |

    Discord-lane routes 403 if the bearer is the console captain token (steer
    source `api`). Import this file in Yaak (Settings → Import/Export) or run
    `apps/clankie/scripts/setup-yaak.py`.
servers:
  - url: http://127.0.0.1:4310
    description: Local service
tags:
  - name: Health
  - name: Operator
  - name: Captain
  - name: Discord
  - name: Memory
  - name: Embodiment
  - name: Browser
  - name: Media
  - name: Pairing
  - name: Devices
  - name: Workers
security: []

paths:
  /v1/activity/shares:
    post:
      tags: [Media]
      operationId: controlActivityShares
      summary: Control local owner-authorized Activity artifact shares
      description: |
        Projects a hash-bound delivered PNG in its exact conversation. Tenant
        and installation scope are service-assigned. No source path/URL or new
        capture permission is accepted. This creates no Discord launch or
        participant authentication; hosted routing/admission remains pending.
        Source switch advances generation and invalidates old media/grants.
        Stop, expiry and producer loss are terminal. Controls never retry;
        uncertainty carries operation and share/generation when known.
        Successful responses use Cache-Control no-store. See docs/cli.md#activity-shares.
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action]
                  properties:
                    action: { const: list }
                - type: object
                  additionalProperties: false
                  required: [action, conversationId, artifactId, guildId, channelId]
                  properties:
                    action: { const: image }
                    conversationId: { type: string, minLength: 1, maxLength: 256 }
                    artifactId: { type: string, pattern: "^[a-f0-9]{48}$" }
                    guildId: { type: string, pattern: "^[0-9]{1,32}$" }
                    channelId: { type: string, pattern: "^[0-9]{1,32}$" }
                    ttlMs: { type: integer, minimum: 1, maximum: 7200000 }
                - type: object
                  additionalProperties: false
                  required: [action, shareId, generation, conversationId, artifactId]
                  properties:
                    action: { const: switch }
                    shareId: { type: string, format: uuid }
                    generation: { type: integer, minimum: 1 }
                    conversationId: { type: string, minLength: 1, maxLength: 256 }
                    artifactId: { type: string, pattern: "^[a-f0-9]{48}$" }
                - type: object
                  additionalProperties: false
                  required: [action, shareId, generation]
                  properties:
                    action: { type: string, enum: [stop, grant] }
                    shareId: { type: string, format: uuid }
                    generation: { type: integer, minimum: 1 }
      responses:
        "200":
          description: List returns sessions; image/switch returns session; grant returns grant and expiresAt; stop returns stopped true
        "400": { description: Invalid request or PNG media }
        "401": { description: Current owner operator authentication required }
        "404": { description: Exact artifact or active share unavailable }
        "409": { description: Stale generation, capacity or refused private control }
        "429": { description: Local owner share request queue is at capacity }
        "503":
          {
            description: Activity unavailable or possibly dispatched private control with typed uncertain outcome,
          }
  /v1/integrate:
    post:
      tags: [Operator]
      operationId: integrate
      summary: Compose, gate and land an ordered approved commit batch
      description: |
        Source-checkout service only. Run returns a durable batch immediately; poll status.
        Independent clones and detached core/app sibling worktrees install real packages
        and run pnpm check with private home, state, credentials and caches. Only the
        recorded zero-exit exact HEAD may land. Core pushes first; app failure retains
        partial core-landed/app-pending evidence. Revert selects a passed batch via restore
        and creates a new commit restoring its tree. No force push or automatic push retry.
        Holds never expire; explicit overrides name every hold, actor and reason and are
        durably audited. Only the authenticated operator can invoke this route.
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, id]
                  properties:
                    action: { const: run }
                    id: { type: string, format: uuid }
                    core:
                      type: array
                      maxItems: 100
                      items: { type: string, pattern: "^[a-f0-9]{7,64}$" }
                      default: []
                    app:
                      type: array
                      maxItems: 100
                      items: { type: string, pattern: "^[a-f0-9]{7,64}$" }
                    restore:
                      {
                        type: string,
                        format: uuid,
                        description: Passed batch whose tree to restore; mutually exclusive with core/app commits,
                      }
                    push: { type: boolean, default: false }
                    overrides:
                      {
                        type: array,
                        maxItems: 32,
                        items: { $ref: "#/components/schemas/DeployHoldOverride" },
                      }
                - type: object
                  additionalProperties: false
                  required: [action, id]
                  properties:
                    action: { const: status }
                    id: { type: string, format: uuid }
                - type: object
                  additionalProperties: false
                  required: [action, id]
                  properties:
                    action: { const: push }
                    id: { type: string, format: uuid }
                    overrides:
                      {
                        type: array,
                        maxItems: 32,
                        items: { $ref: "#/components/schemas/DeployHoldOverride" },
                      }
                - type: object
                  additionalProperties: false
                  required: [action]
                  properties:
                    action: { const: holds }
                - type: object
                  additionalProperties: false
                  required: [action, id, holder, reason]
                  properties:
                    action: { const: hold }
                    id: { type: string, format: uuid }
                    holder: { type: string, minLength: 1, maxLength: 512 }
                    reason: { type: string, minLength: 1, maxLength: 512 }
                    pane: { type: string, description: Herdr pane ID; fleet-qualified for remote holders }
                    seat:
                      {
                        type: string,
                        description: Native seat/terminal ID; fleet-qualified for remote holders,
                      }
                - type: object
                  additionalProperties: false
                  required: [action, id, actor, reason]
                  properties:
                    action: { const: release }
                    id: { type: string, format: uuid }
                    actor: { type: string, minLength: 1, maxLength: 512 }
                    reason: { type: string, minLength: 1, maxLength: 512 }
      responses:
        "200":
          description: Durable batch or holds; inspect ok and batch.state for failures/partial landing
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  error: { type: string }
                  holds: { type: array, items: { $ref: "#/components/schemas/DeployHold" } }
                  batch:
                    type: object
                    required: [schemaVersion, id, state, evidence, repos, createdAt, updatedAt, request]
                    properties:
                      schemaVersion: { const: 1 }
                      id: { type: string, format: uuid }
                      state:
                        {
                          type: string,
                          enum:
                            [
                              queued,
                              composing,
                              conflict,
                              installing,
                              gating,
                              failed,
                              passed,
                              held,
                              pushing,
                              pushed,
                              partial,
                              interrupted,
                            ],
                        }
                      evidence: { type: string, description: Durable local record.json path }
                      error: { type: string }
                      createdAt: { type: string, format: date-time }
                      updatedAt: { type: string, format: date-time }
                      request: { type: object }
                      repos:
                        type: array
                        items:
                          type: object
                          description: Source/origin/base, directory, HEAD, per-commit conflict results, install/gate exit and tested HEAD, per-repo push outcome and logs
        "400": { description: Malformed request }
        "403": { description: Actual operator required }
        "409": { description: Unknown record, identity conflict, busy operation or refused landing }
        "503": { description: Repository integration unavailable }
  /v1/runtime-update:
    get:
      tags: [Operator]
      operationId: runtimeUpdateStatus
      summary: Read runtime-update status and current deploy holds
      security: [{ operatorBearer: [] }]
      responses:
        "200": { description: Runtime boot identity, durable operation status and holds with holder presence }
        "403": { description: Operator required }
        "503": { description: Runtime updater unavailable }
    post:
      tags: [Operator]
      operationId: runtimeUpdate
      summary: Admit a local pinned-runtime deployment after the deploy-hold check
      security: [{ operatorBearer: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ref: { type: string, minLength: 1, maxLength: 256, default: main }
                overrides:
                  { type: array, maxItems: 32, items: { $ref: "#/components/schemas/DeployHoldOverride" } }
      responses:
        "202": { description: Accepted durable update, not completed deployment }
        "409": { description: Named deploy hold or other refusal; detail describes the blocker }
        "403": { description: Operator required or revoked }
        "400": { description: Invalid update request }
        "503": { description: Runtime updater unavailable }
  /v1/discord/settings:
    get:
      tags: [Discord]
      operationId: discordSettings
      summary: Read the server role, fleet and tracking setup with Advanced settings
      description: >-
        Operator-authorized non-secret settings, their revision and the shared
        setup definition. Normal setup connects a server with participant or
        admin, fleetEnabled and trackingLevel (off, project_updates,
        project_activity, all_issues). Raw IDs and machine grants stay under
        Advanced. The role-correct invitation and gateway checks are read-only.
      security: [{ operatorBearer: [] }]
      responses:
        "200":
          description: settings, revision and optional setup definition, role invite and permission checks
        "403":
          description: Operator authority required
    post:
      tags: [Discord]
      operationId: discordSettingsUpdate
      summary: Save revision-fenced non-secret Discord settings
      description: >-
        Requires settings and expectedRevision. Connecting a server projects its
        ingress, presence and voice scope while preserving machine grants and
        lab opt-in. Stale writes are refused. Saving never posts to Discord.
        Admin actions refuse server deletion and ownership transfer at the body.
      security: [{ operatorBearer: [] }]
      responses:
        "200":
          description: Saved settings, new revision and setup metadata
        "400":
          description: Invalid or unknown settings
        "403":
          description: Operator authority required or revoked
        "409":
          description: Settings revision changed
  /v1/discord/setup/test-post:
    post:
      tags: [Discord]
      operationId: discordSetupTestPost
      summary: Explicitly send one owner-requested setup message to a text room
      description: >-
        Settings-level operator authority is required; Observe or Steer cannot post.
        The current settings revision, connected account and Send Messages evidence
        are checked before dispatch. Reads, setup opening and picker edits never
        call this operation. Missing native receipts are unconfirmed and never retried.
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [guildId, channelId, expectedRevision]
              properties:
                guildId: { type: string, pattern: '^\d{5,32}$' }
                channelId: { type: string, pattern: '^\d{5,32}$' }
                expectedRevision: { type: string, pattern: "^[a-f0-9]{64}$" }
      responses:
        "200":
          description: posted with messageId, unavailable with reason, or unconfirmed with post_receipt_unavailable
        "400":
          description: Invalid request
        "403":
          description: Operator authority required or revoked
        "409":
          description: Settings or active account configuration changed
  /v1/discord/ingress:
    post:
      tags: [Discord]
      operationId: discordIngress
      summary: Admit an encrypted, fleet-permitted addressed Discord turn
      description: >-
        Remote connection API, not an operator bearer. P-256 ECDH and AES-GCM
        protect request and response; a 60-second Ed25519 fleet permit binds the
        tenant, installation, event digest and ephemeral response recipient.
        Durable delivery dedupe prevents repeated captain effects. See docs/discord-ingress.md.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, permit, ephemeralPublicKey, nonce, sealed]
              properties:
                version: { type: integer, enum: [1] }
                permit: { type: string, maxLength: 4096 }
                ephemeralPublicKey: { type: string, minLength: 87, maxLength: 87 }
                nonce: { type: string, minLength: 22, maxLength: 22 }
                sealed: { type: string, maxLength: 100000 }
      responses:
        "200":
          description: Sealed pending, reply, silent or failed result
        "401":
          description: Invalid, expired, unsealed or wrongly scoped event
        "409":
          description: Delivery id already binds another event
        "413":
          description: Envelope exceeds the byte limit
        "429":
          description: Durable inbox is at capacity
        "503":
          description: Durable admission unavailable
  /v1/model-keys:
    get:
      tags: [Operator]
      operationId: listModelKeys
      summary: List supported providers, models, stored-key status and captain selection
      description: |
        Owner operator bearer or active device with terminalControl only. Public
        gateway calls require the encrypted envelope. Shares the CLI model catalog
        and config. Returns no credentials or endpoint headers. Cache-Control no-store.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      responses:
        "200":
          description: Secret-free model catalog and selection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelKeysResponse" }
        "401": { description: authentication_required }
        "403": { description: forbidden — terminalControl required }
        "503": { description: unavailable }
  /v1/model-keys/subscriptions:
    get:
      tags: [Operator]
      operationId: listModelSubscriptions
      summary: List providers signed in through an account (OAuth or subscription) instead of an API key
      description: |
        Owner operator bearer or active device with terminalControl only. Public
        gateway calls require the encrypted envelope. Returns provider ids and
        names only; no tokens, expiry or account metadata. A separate read so
        clients parsing the strict model catalog never meet a new field.
        Cache-Control no-store.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      responses:
        "200":
          description: Providers signed in through an account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelSubscriptionsResponse" }
        "401": { description: authentication_required }
        "403": { description: forbidden — terminalControl required }
        "503": { description: unavailable }
  /v1/model-keys/options:
    get:
      tags: [Operator]
      operationId: listModelOptions
      summary: List providers usable without key entry and the running model's reasoning effort
      description: |
        Owner operator bearer or active device with terminalControl only. Public
        gateway calls require the encrypted envelope. Returns provider ids and
        effort levels only; no credentials. A separate read so clients parsing
        the strict model catalog never meet a new field. Cache-Control no-store.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      responses:
        "200":
          description: Usable providers and the running model's effort
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelOptionsResponse" }
        "401": { description: authentication_required }
        "403": { description: forbidden — terminalControl required }
        "503": { description: unavailable }
  /v1/model-keys/effort:
    post:
      tags: [Operator]
      operationId: setModelEffort
      summary: Set or clear the running model's reasoning effort for the next turn
      description: |
        Owner operator bearer or active device with terminalControl only. Public
        gateway calls require the encrypted envelope. Writes the same config as
        `clankie effort set`; null returns the model to its default. An effort
        the model does not accept, or no running model, is unsupported_model.
        Cache-Control no-store.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelEffortSetRequest" }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelKeyResult" }
        "400":
          description: Malformed input, or an effort the running model does not accept
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelKeyResult" }
        "401": { description: authentication_required }
        "403": { description: forbidden — terminalControl required }
        "413": { description: malformed — body exceeds 16 KiB }
        "503": { description: unavailable }
  /v1/model-keys/set:
    post:
      tags: [Operator]
      operationId: setModelKey
      summary: Store or replace a write-only provider API key
      description: |
        Owner operator bearer or active device with terminalControl only. Public
        gateway calls require the encrypted envelope. No key, provider error text,
        or generated text is returned or logged. Cache-Control no-store.
        Validation uses a fixed prompt, 16 output tokens, no retries and a 15-second
        deadline; the provider may bill this request. Set does not validate implicitly.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelKeySetRequest" }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelKeyResult" }
        "400":
          description: Malformed input, unsupported provider/model, missing key, failed or timed-out validation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelKeyResult" }
        "401": { description: authentication_required }
        "403": { description: forbidden — terminalControl required }
        "413": { description: malformed — body exceeds 16 KiB }
        "503": { description: unavailable }
  /v1/model-keys/validate:
    post:
      tags: [Operator]
      operationId: validateModelKey
      summary: Validate the stored key with a bounded provider call
      description: |
        Owner operator bearer or active device with terminalControl only. Public
        gateway calls require the encrypted envelope. No key, provider error text,
        or generated text is returned or logged. Cache-Control no-store.
        Validation uses a fixed prompt, 16 output tokens, no retries and a 15-second
        deadline; the provider may bill this request. Set does not validate implicitly.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelKeyValidateRequest" }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelKeyResult" }
        "400":
          description: Malformed input, unsupported provider/model, missing key, failed or timed-out validation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelKeyResult" }
        "401": { description: authentication_required }
        "403": { description: forbidden — terminalControl required }
        "413": { description: malformed — body exceeds 16 KiB }
        "503": { description: unavailable }
  /v1/model-keys/select:
    post:
      tags: [Operator]
      operationId: selectModelKey
      summary: Select the captain model for the next turn
      description: |
        Owner operator bearer or active device with terminalControl only. Public
        gateway calls require the encrypted envelope. No key, provider error text,
        or generated text is returned or logged. Cache-Control no-store.
        Validation uses a fixed prompt, 16 output tokens, no retries and a 15-second
        deadline; the provider may bill this request. Set does not validate implicitly.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelSelectRequest" }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelKeyResult" }
        "400":
          description: Malformed input, unsupported provider/model, missing key, failed or timed-out validation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelKeyResult" }
        "401": { description: authentication_required }
        "403": { description: forbidden — terminalControl required }
        "413": { description: malformed — body exceeds 16 KiB }
        "503": { description: unavailable }
  /v1/model-keys/remove:
    post:
      tags: [Operator]
      operationId: removeModelKey
      summary: Remove a stored API key without removing OAuth or environment fallback
      description: |
        Owner operator bearer or active device with terminalControl only. Public
        gateway calls require the encrypted envelope. No key, provider error text,
        or generated text is returned or logged. Cache-Control no-store.
        Validation uses a fixed prompt, 16 output tokens, no retries and a 15-second
        deadline; the provider may bill this request. Set does not validate implicitly.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelKeyRemoveRequest" }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelKeyResult" }
        "400":
          description: Malformed input, unsupported provider/model, missing key, failed or timed-out validation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelKeyResult" }
        "401": { description: authentication_required }
        "403": { description: forbidden — terminalControl required }
        "413": { description: malformed — body exceeds 16 KiB }
        "503": { description: unavailable }
  /v1/accounts/codex:
    get:
      tags: [Operator]
      operationId: listCodexAccounts
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      summary: List registered local Codex homes and observed headroom
      description: Owner-authorized. Reports credential-file presence, never credential contents. Queries current quota without a model turn, with recent rollouts as fallback. Missing or stale usage is unknown.
      responses:
        "200":
          description: Default and registered account labels, paths, rate windows and headroom
        "401":
          description: Authentication required
        "403":
          description: Owner authority required
    post:
      tags: [Operator]
      operationId: updateCodexAccounts
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      summary: Register or remove an owner's local Codex home
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [op, home, label]
                  additionalProperties: false
                  properties:
                    op: { type: string, enum: [add] }
                    home: { type: string }
                    label: { type: string }
                - type: object
                  required: [op, label]
                  additionalProperties: false
                  properties:
                    op: { type: string, enum: [remove] }
                    label: { type: string }
      responses:
        "200":
          description: Registration updated; credentials and home are unchanged
        "400":
          description: Invalid or duplicate account
        "401":
          description: Authentication required
        "403":
          description: Owner authority required
  /v1/accounts:
    get:
      tags: [Operator]
      operationId: listAccounts
      summary: List GitHub and Linear account connections
      description: |
        Owner operator bearer or active device with terminalControl only (ADR 0196). Public
        gateway calls require the encrypted envelope. Never returns or logs a token or
        provider error text. Cache-Control no-store.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountsResponse" }
        "401": { description: authentication_required }
        "403": { description: forbidden — terminalControl required }
        "503": { description: unavailable }
  /v1/accounts/github/start:
    post:
      tags: [Operator]
      operationId: startGithubAccount
      summary: Start a GitHub device flow; return the user code and verification URL
      description: |
        Owner operator bearer or active device with terminalControl only (ADR 0196). Public
        gateway calls require the encrypted envelope. Never returns or logs a token or
        provider error text. Cache-Control no-store.
        The device code stays on the body. Unconfigured without a GitHub OAuth client ID.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountResult" }
        "400":
          description: A closed error code (malformed, unconfigured, unknown_flow, expired, denied, provider_rejected)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountResult" }
        "401": { description: authentication_required }
        "403": { description: forbidden — terminalControl required }
        "503": { description: unavailable }
  /v1/accounts/github/poll:
    post:
      tags: [Operator]
      operationId: pollGithubAccount
      summary: Poll a GitHub device flow; returns pending, connected or a closed error
      description: |
        Owner operator bearer or active device with terminalControl only (ADR 0196). Public
        gateway calls require the encrypted envelope. Never returns or logs a token or
        provider error text. Cache-Control no-store.
        Polls faster than GitHub's interval are answered by the body without calling GitHub.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [flowId],
                additionalProperties: false,
                properties: { flowId: { type: string } },
              }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountResult" }
        "400":
          description: A closed error code (malformed, unconfigured, unknown_flow, expired, denied, provider_rejected)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountResult" }
        "401": { description: authentication_required }
        "403": { description: forbidden — terminalControl required }
        "503": { description: unavailable }
  /v1/accounts/linear/start:
    post:
      tags: [Operator]
      operationId: startLinearAccount
      summary: Start Linear OAuth with PKCE; return the authorize URL
      description: |
        Owner operator bearer or active device with terminalControl only (ADR 0196). Public
        gateway calls require the encrypted envelope. Never returns or logs a token or
        provider error text. Cache-Control no-store.
        The PKCE verifier stays on the body. Unconfigured without a redirect URI.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountResult" }
        "400":
          description: A closed error code (malformed, unconfigured, unknown_flow, expired, denied, provider_rejected)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountResult" }
        "401": { description: authentication_required }
        "403": { description: forbidden — terminalControl required }
        "503": { description: unavailable }
  /v1/accounts/linear/complete:
    post:
      tags: [Operator]
      operationId: completeLinearAccount
      summary: Hand back Linear's redirect code; the body exchanges it with its verifier
      description: |
        Owner operator bearer or active device with terminalControl only (ADR 0196). Public
        gateway calls require the encrypted envelope. Never returns or logs a token or
        provider error text. Cache-Control no-store.
        state is single use.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [state, code],
                additionalProperties: false,
                properties: { state: { type: string }, code: { type: string } },
              }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountResult" }
        "400":
          description: A closed error code (malformed, unconfigured, unknown_flow, expired, denied, provider_rejected)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountResult" }
        "401": { description: authentication_required }
        "403": { description: forbidden — terminalControl required }
        "503": { description: unavailable }
  /v1/accounts/linear/app:
    post:
      tags: [Operator]
      operationId: connectLinearApp
      summary: Connect a workspace-owned Linear app for worker names and portraits
      description: |
        Verifies an app actor and workspace before replacing the Linear credential.
        Owner operator bearer or active device with terminalControl only. Public
        gateway calls require the encrypted envelope. Client credentials and tokens
        stay in the broker and are never returned or logged. Cache-Control no-store.
        Enable client credentials tokens on the workspace's Linear OAuth application.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [clientId, clientSecret]
              properties:
                clientId: { type: string, minLength: 1, maxLength: 256 }
                clientSecret: { type: string, minLength: 1, maxLength: 4096, writeOnly: true }
      responses:
        "200":
          description: Verified connection with actor and workspace; no credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountResult" }
        "400":
          description: malformed or provider_rejected; previous connection retained
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountResult" }
        "401": { description: authentication_required }
        "403": { description: forbidden — terminalControl required }
        "503": { description: unavailable }
  /v1/accounts/disconnect:
    post:
      tags: [Operator]
      operationId: disconnectAccount
      summary: Revoke a connection at the provider and delete its token
      description: |
        Owner operator bearer or active device with terminalControl only (ADR 0196). Public
        gateway calls require the encrypted envelope. Never returns or logs a token or
        provider error text. Cache-Control no-store.
        revoked is false when the provider could not revoke; the token is deleted either way
        and manageUrl names where to revoke it by hand.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [provider],
                additionalProperties: false,
                properties: { provider: { type: string, enum: [github, linear] } },
              }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountResult" }
        "400":
          description: A closed error code (malformed, unconfigured, unknown_flow, expired, denied, provider_rejected)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountResult" }
        "401": { description: authentication_required }
        "403": { description: forbidden — terminalControl required }
        "503": { description: unavailable }
  /v1/connections:
    get:
      tags: [Operator]
      operationId: getConnectionInventory
      summary: Inspect execution runtimes and verified Linear identity
      security: [{ operatorBearer: [] }]
      responses:
        "200": { description: Current runtime health and recorded account identity }
        "401": { description: Operator authentication required }
        "503": { description: Operator authentication unavailable }
  /v1/runtime-connections:
    get:
      tags: [Operator]
      operationId: listRuntimeConnections
      summary: Inspect the default fleet and named execution connections
      security: [{ operatorBearer: [] }]
      responses:
        "200": { description: Configured endpoints and freshly probed health }
        "401": { description: Operator authentication required }
        "503": { description: Operator authentication unavailable }
    post:
      tags: [Operator]
      operationId: connectRuntime
      summary: Connect a Herdr runtime or configure owner execution policy
      description: Resolves an explicit session or socket and pins that endpoint to the ID. Reconnection cannot retarget an existing ID. action=workspaces replaces additional repository/directory approvals for a named or default runtime; it never starts or stops workers. action=capacity sets one runtime limit; Unset limits default to 16; null clears a limit to unlimited; zero pauses new admission.
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              oneOf:
                - required: [id]
                  anyOf: [{ required: [session] }, { required: [socketPath] }]
                  not: { required: [action] }
                - required: [id, action, workspaces]
                  properties: { action: { const: workspaces } }
                  not:
                    {
                      anyOf:
                        [
                          { required: [session] },
                          { required: [socketPath] },
                          { required: [kind] },
                          { required: [capacity] },
                          { required: [capabilities] },
                        ],
                    }
                - required: [id, action, capacity]
                  properties: { action: { const: capacity } }
                  not:
                    {
                      anyOf:
                        [
                          { required: [workspaces] },
                          { required: [session] },
                          { required: [socketPath] },
                          { required: [kind] },
                          { required: [capabilities] },
                        ],
                    }
              properties:
                id:
                  {
                    type: string,
                    pattern: "^[a-z][a-z0-9-]{0,63}$",
                    description: "default is reserved except for workspace and capacity configuration",
                  }
                action: { type: string, enum: [workspaces, capacity] }
                workspaces:
                  type: array
                  maxItems: 32
                  items:
                    type: object
                    additionalProperties: false
                    required: [kind, path]
                    properties:
                      kind: { type: string, enum: [repository, directory] }
                      path:
                        {
                          type: string,
                          maxLength: 4096,
                          pattern: "^/",
                          description: "Existing absolute checkout or exact directory; repository identity is stored as canonical git-common-dir",
                        }
                kind: { type: string, enum: [herdr], default: herdr }
                session: { type: string, maxLength: 64 }
                socketPath:
                  {
                    type: string,
                    maxLength: 102,
                    description: "Absolute Unix socket path, at most 102 UTF-8 bytes",
                  }
                capacity: { type: [integer, "null"], minimum: 0, default: 16 }
                capabilities:
                  { type: array, maxItems: 32, items: { type: string }, default: [code, review, research] }
      responses:
        "200": { description: Persisted connection }
        "400": { description: Invalid connection }
        "401": { description: Operator authentication required }
        "409":
          {
            description: "Endpoint unavailable, identity conflict or coordinator synchronization failed; inspect state before retrying",
          }
        "503": { description: Execution management or authentication unavailable }
  /v1/runtime-connections/{id}:
    delete:
      tags: [Operator]
      operationId: disconnectRuntime
      summary: Disable a named execution connection while preserving workers and route identity
      security: [{ operatorBearer: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Connection disabled and coordinator routes synchronized }
        "401": { description: Operator authentication required }
        "409":
          { description: Unknown connection or synchronization unconfirmed; inspect state before retrying }
        "503": { description: Execution management or authentication unavailable }
  /v1/work:
    post:
      tags: [Operator]
      operationId: workItems
      summary: Read and write work items in the repo's own tracking convention
      description: >-
        One contract over Linear, GitHub issues, the repo's own Markdown directory, or
        .clankie/work/ (ADR 0191). `action` is repos, discover, init, list, show, create,
        update, attach, write or write_receipt. The two narrow owner operations take
        request {repoId,itemId,requestId,command}; receipt reads omit command. The
        command assigns work-metadata owner, adds/removes a role label or appends a
        blocker. Their applied/refused/uncertain receipt always carries the UUID;
        repeated IDs and receipt reads never replay a write. A path names and registers a local repo; registered repos are
        readable from paired devices through the work_repos and work_items operator ops.
        list takes optional status, owner and label (case-insensitive) filters; items carry
        the backend's labels (ADR 0208).
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [action], properties: { action: { type: string } } }
      responses:
        "200": { description: The repos, discovery, recorded convention, items, or one item }
        "400": { description: Invalid request, or a write a device may not make }
        "401": { description: Operator authentication required }
        "404": { description: Unknown repo or work item }
        "409": { description: The repo needs its convention decided, or its recorded backend is unavailable }
        "502": { description: The backend refused or failed the request }
  /v1/linear/target:
    get:
      tags: [Operator]
      operationId: inspectLinearWakeTarget
      summary: Inspect the ordinary chat selected for Linear activity
      security: [{ operatorBearer: [] }]
      responses:
        "200":
          description: Current live wake target
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, wakeConversationId]
                properties:
                  schemaVersion: { const: 1 }
                  wakeConversationId: { type: string, default: global-default }
        "401": { description: Operator authentication required }
        "503": { description: Operator authentication unavailable }
    put:
      tags: [Operator]
      operationId: setLinearWakeTarget
      summary: Select an existing ordinary global chat without restarting
      description: Sets linearWebhook.wakeConversationId, default global-default. The target must be an existing ordinary global chat; its attached native operator seat may drive it. Changing the target applies to new activity without moving or replaying history. Selecting a target grants no additional authority.
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [conversationId]
              properties:
                conversationId: { type: string, pattern: "^[a-zA-Z0-9_-]{1,256}$" }
      responses:
        "200":
          description: Persisted live wake target
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, wakeConversationId]
                properties:
                  schemaVersion: { const: 1 }
                  wakeConversationId: { type: string }
        "400": { description: Invalid target }
        "401": { description: Operator authentication required }
        "409": { description: Target is not an available ordinary global chat }
        "503": { description: Settings or operator authentication unavailable }
  /v1/linear/wake:
    get:
      tags: [Operator]
      operationId: inspectLinearWakeRules
      summary: Inspect actor and activity type wake rules
      security: [{ operatorBearer: [] }]
      responses:
        "200":
          description: Current live wake rules
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, wake]
                properties:
                  schemaVersion: { const: 1 }
                  wake: { $ref: "#/components/schemas/LinearWakeRules" }
        "401": { description: Operator authentication required }
        "503": { description: Operator authentication unavailable }
    put:
      tags: [Operator]
      operationId: setLinearWakeRules
      summary: Replace wake rules without restarting
      description: Missing fields take defaults. Defaults select signed comments and mentions by the owner user email volpestyle@gmail.com and exclude issueSubscribed. Owner IDs may also be configured. Unknown or ambiguous authors and own writes never wake. Actor selectors are ORed; exclusions always win. Empty notificationTypes allows all types. Rules apply to new signed webhook activity without replaying history. The follow switch still gates wakes; passive activity remains visible in the selected ordinary chat.
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LinearWakeRules" }
      responses:
        "200":
          description: Persisted live wake rules
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, wake]
                properties:
                  schemaVersion: { const: 1 }
                  wake: { $ref: "#/components/schemas/LinearWakeRules" }
        "400": { description: Malformed rules }
        "401": { description: Operator authentication required }
        "503": { description: Settings or operator authentication unavailable }
  /v1/linear/follow:
    get:
      tags: [Operator]
      operationId: inspectLinearFollowing
      summary: Inspect Linear activity following and required webhook readiness
      security: [{ operatorBearer: [] }]
      responses:
        "200":
          {
            description: Following switch,
            active readiness,
            webhookConfigured,
            reason,
            missingWebhook,
            detail,
            configured ordinary chat in wakeConversationId,
          }
        "401": { description: Operator authentication required }
    put:
      tags: [Operator]
      operationId: setLinearFollowing
      summary: Enable or disable rule-matched turns from signed Linear webhooks
      description: Enabling requires a stored webhook URL and signing secret. It never promotes passive backlog. Disabling suppresses new and queued wakes while leaving ordinary chat history delivery enabled. Status distinguishes the requested following switch from active readiness, with linear_webhook_required and missingWebhook when setup is removed. Bursts coalesce into one wake for the selected ordinary global chat. There is no notification poll.
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [following]
              properties:
                following: { type: boolean }
      responses:
        "200":
          {
            description: Following switch,
            active readiness,
            webhookConfigured,
            reason,
            missingWebhook,
            detail,
            configured ordinary chat in wakeConversationId,
          }
        "400": { description: Invalid request }
        "401": { description: Operator authentication required }
        "409":
          description: Following requires the registered webhook URL and broker-held signing secret; the switch is unchanged.
          content:
            application/json:
              schema:
                type: object
                required: [error, reason, missingWebhook, following, active, detail]
                properties:
                  error: { const: linear_webhook_required }
                  reason: { const: linear_webhook_required }
                  missingWebhook:
                    type: array
                    items: { enum: [url, secret] }
                  following: { type: boolean }
                  active: { const: false }
                  detail: { type: string }
  /v1/worker-grants/:
    get:
      tags: [Operator]
      operationId: listWorkerGrants
      summary: List worker grant records without bearer tokens
      security: [{ operatorBearer: [] }]
      responses:
        "200": { description: Grant records including account identity and revocation status }
        "401": { description: Operator authentication required }
        "503": { description: Worker access service unavailable }
    post:
      tags: [Operator]
      operationId: issueWorkerGrant
      summary: Issue a scoped grant for one verified connected account
      description: Work ID is provenance. Exact top-level argument restrictions enforce resource boundaries; omitted arguments remain unrestricted. A fleet grant binds access to an authenticated fleet link until revoked; a manual grant requires private bearer delivery.
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [principalId, workId, server, tools]
              anyOf:
                - required: [fleet]
                - properties:
                    tools: { minItems: 1 }
              properties:
                principalId: { type: string, minLength: 1, maxLength: 256 }
                workId: { type: string, minLength: 1, maxLength: 256 }
                server: { type: string, minLength: 1, maxLength: 128 }
                ttlSeconds: { type: integer, minimum: 1, maximum: 900, default: 900 }
                fleet:
                  {
                    type: string,
                    pattern: "^[a-z][a-z0-9-]{0,63}$",
                    description: Fleet link identity; omit for a manual grant,
                  }
                tools:
                  type: array
                  minItems: 0
                  maxItems: 64
                  items:
                    type: object
                    additionalProperties: false
                    required: [name]
                    properties:
                      name: { type: string, minLength: 1, maxLength: 128 }
                      arguments: { type: object, additionalProperties: true, default: {} }
                      forbiddenArguments:
                        type: array
                        maxItems: 64
                        default: []
                        description: Top-level arguments that must be absent, including null values
                        items: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "201": { description: Grant record and private worker bearer token; Cache-Control no-store }
        "400": { description: Invalid grant request }
        "401": { description: Operator authentication required }
        "409": { description: Account unverified or tool unavailable }
        "503": { description: Worker access service unavailable }
  /v1/worker-grants/{id}:
    delete:
      tags: [Operator]
      operationId: revokeWorkerGrant
      summary: Durably revoke one worker grant and close its sessions
      security: [{ operatorBearer: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Revoked grant record }
        "401": { description: Operator authentication required }
        "404": { description: Grant unavailable }
  /v1/worker-grants/linear/account:
    get:
      tags: [Operator]
      operationId: getWorkerLinearAccount
      summary: Inspect disconnected, unverified or verified Linear account identity
      security: [{ operatorBearer: [] }]
      responses:
        "200": { description: Account status and verified identity when available }
        "401": { description: Operator authentication required }
    post:
      tags: [Operator]
      operationId: verifyWorkerLinearAccount
      summary: Verify the stored Linear account's provider user and workspace
      description: Verifies API keys via GraphQL and OAuth via Linear's official MCP identity tools. Credentials are never migrated automatically.
      security: [{ operatorBearer: [] }]
      responses:
        "200": { description: Verified account identity }
        "401": { description: Operator authentication required }
        "409": { description: Verification unavailable or failed }
  /v1/worker-mcp:
    post:
      tags: [Workers]
      operationId: workerMcpRequest
      summary: Initialize a worker MCP session or list/call its granted tools
      security: [{ workerBearer: [] }]
      description: Standard Streamable HTTP MCP. Every request validates expiry, durable revocation and account binding. MCP sessions are bound to one grant. No operator tools or channel capabilities are exposed.
      responses:
        "200": { description: MCP response }
        "202": { description: MCP notification accepted }
        "401": { description: Worker bearer required }
        "403": { description: Grant unavailable or session belongs to another grant }
        "404": { description: MCP session unavailable }
    get:
      operationId: workerMcpStream
      tags: [Workers]
      summary: MCP session stream
      security: [{ workerBearer: [] }]
      responses:
        "200": { description: MCP stream }
        "403": { description: Worker grant unavailable }
    delete:
      operationId: closeWorkerMcpSession
      tags: [Workers]
      summary: Close an authenticated worker MCP session
      security: [{ workerBearer: [] }]
      responses:
        "200": { description: Session closed }
        "403": { description: Worker grant unavailable }
  /v1/hosted/operator:
    post:
      tags: [Operator]
      operationId: hostedOperatorRequest
      summary: Dispatch as an account-paired hosted operator device
      description: Encrypted gateway carrier required remotely. Checks active device session, server-recorded operator pairing purpose and Take Control grant. No operator bearer is exported. The shared hosted-device allowlist permits chat, fleet, terminal, model, keys, persona and connections. Restart, reset and deprovision require account authority, including through the legacy device relay. The inner route keeps its own validation. Revocation is rechecked before returning a parked page.
      security: [{ deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [method, path]
              properties:
                method: { type: string, enum: [GET, POST] }
                path: { type: string, description: Inner health, operator dispatch or v1 route }
                body: { type: string, maxLength: 1048576, description: JSON request body for POST }
      responses:
        "200": { description: Inner operator route response }
        "400": { description: Invalid inner request or forbidden route }
        "401": { description: Missing, expired or revoked device session }
        "403": { description: Not an account-paired operator device }
  /v1/runtime-connections/{id}/prepare:
    post:
      tags: [Operator]
      operationId: prepareFleetHarnesses
      summary: Prepare Clankie's own harness setup on an existing machine
      description: Resolves policy from the verified service-local source workspace and checks the target's current link independently. Lead setup requires an already-linked target. Owner policy or a newly supplied source script requires the caller's ownerApproved consent claim. The service records that claim without verifying human confirmation. expectedMachineRevision pins the exact registered target shown to the caller; omission claims the alias's current target. This retains operator authority and never restarts or steers existing lanes.
      security: [{ operatorBearer: [] }]
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string },
            description: Existing runtime connection ID,
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [workingDirectory]
              properties:
                workingDirectory:
                  { type: string, description: Existing absolute source directory on the service host }
                projectId:
                  { type: string, description: Optional assertion matching verified source membership }
                ownerApproved:
                  {
                    type: boolean,
                    default: false,
                    description: Caller-reported owner consent; the service cannot verify human confirmation,
                  }
                expectedMachineRevision:
                  {
                    type: string,
                    pattern: "^[a-f0-9]{64}$",
                    description: Target revision from the context shown during consent; a mismatch refuses preparation. Omission claims the current alias target,
                  }
                codexSourceSetup:
                  {
                    type: string,
                    description: Absolute source-owned script path on the target machine; supplying a script requires ownerApproved even under lead policy. Existing source and configuration fences remain,
                  }
      responses:
        "200":
          description: Harness preparation result and the caller's consent claim
          content:
            application/json:
              schema:
                type: object
                required: [ok, prepared, ownerApproval]
                properties:
                  ok: { type: boolean, enum: [true] }
                  prepared: { type: object }
                  ownerApproval:
                    {
                      type: string,
                      enum: [claimed, not_claimed],
                      description: Caller-reported consent,
                      never verified human approval,
                    }
        "400": { description: Malformed request }
        "401": { description: Operator authentication required }
        "403": { description: Owner approval or existing linked target required }
        "409": { description: Preparation or context verification failed }
  /v1/operator/fleet-settings:
    get:
      tags: [Operator]
      operationId: getFleetSettings
      summary: Read fleet size, model mode and owner working preferences
      description: Closure, machineSetup, commit and push default to lead; official releases default to owner, verification to change_run_read, reporting to Short and plain. workingPreferences=true advertises the five new controls; old responses may omit them. Existing owner or Take Control device authority is required; preferences confer no credentials or new access.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      responses:
        "200":
          description: Current fleet settings and SHA-256 revision
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [schemaVersion, revision, fleet]
                properties:
                  schemaVersion: { type: integer, enum: [1] }
                  workingPreferences: { type: boolean, enum: [true] }
                  revision: { type: string, pattern: "^[a-f0-9]{64}$" }
                  fleet:
                    type: object
                    additionalProperties: false
                    required: [size, models, closure, machineSetup]
                    properties:
                      size: { type: string, enum: [max, large, small, solo] }
                      models: { type: string, enum: [optimal, efficient] }
                      closure: { type: string, enum: [lead, owner] }
                      machineSetup: { type: string, enum: [lead, owner] }
                      commit: { type: string, enum: [lead, owner] }
                      push: { type: string, enum: [lead, owner] }
                      release: { $ref: "#/components/schemas/FleetReleasePolicy" }
                      verification: { type: string, enum: [review_and_seal, change_run_read] }
                      reportingStyle: { type: string, minLength: 1, maxLength: 2000 }
        "401": { description: Owner authentication required }
        "403": { description: Caller lacks owner authority }
    post:
      tags: [Operator]
      operationId: updateFleetSettings
      summary: Update fleet budget and working preferences with revision fencing
      description: Omitted leaves retain their value. A null autonomy leaf restores its global default. Release mode and rule are replaced together.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schemaVersion, expectedRevision, changes]
              properties:
                schemaVersion: { type: integer, enum: [1] }
                expectedRevision: { type: string, pattern: "^[a-f0-9]{64}$" }
                changes:
                  type: object
                  additionalProperties: false
                  minProperties: 1
                  properties:
                    size: { type: string, enum: [max, large, small, solo] }
                    models: { type: string, enum: [optimal, efficient] }
                    closure: { type: string, enum: [lead, owner, null], nullable: true }
                    machineSetup: { type: string, enum: [lead, owner, null], nullable: true }
                    commit: { type: string, enum: [lead, owner, null], nullable: true }
                    push: { type: string, enum: [lead, owner, null], nullable: true }
                    release: { $ref: "#/components/schemas/FleetReleasePolicyPatch" }
                    verification:
                      { type: string, enum: [review_and_seal, change_run_read, null], nullable: true }
                    reportingStyle: { type: string, minLength: 1, maxLength: 2000, nullable: true }
      responses:
        "200": { description: Updated fleet snapshot and revision }
        "400": { description: Malformed request }
        "401": { description: Owner authentication required }
        "403": { description: Caller lacks owner authority }
        "409": { description: Settings or owner authority changed before commit }
  /v1/operator/fleet-settings/context:
    get:
      tags: [Operator]
      operationId: getFleetSettingsContext
      summary: Resolve current project policy and already-linked setup target
      description: Verifies a local source directory and Git worktree separately from the registered target machine. Returns a nonsecret targetRevision hashing the resolved execution descriptor, including transport and session, so consent can be pinned across requests. Machine aliases hash their registration set rather than selecting an arbitrary runtime. Invalid or ambiguous project evidence fails closed. This filesystem route is excluded from hosted-device forwarding.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      parameters:
        - {
            name: workingDirectory,
            in: query,
            required: true,
            schema: { type: string },
            description: Existing absolute source directory on the service host,
          }
        - {
            name: machine,
            in: query,
            required: true,
            schema: { type: string },
            description: Existing runtime or machine ID,
          }
        - {
            name: projectId,
            in: query,
            schema: { type: string },
            description: Optional project assertion; must match verified directory membership,
          }
      responses:
        "200":
          description: Effective policy, matched project and current target observation
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, effective, machine]
                properties:
                  schemaVersion: { type: integer, enum: [1] }
                  workingPreferences: { type: boolean, enum: [true] }
                  effective:
                    type: object
                    required: [closure, machineSetup]
                    properties:
                      closure: { type: string, enum: [lead, owner] }
                      machineSetup: { type: string, enum: [lead, owner] }
                      commit: { type: string, enum: [lead, owner] }
                      push: { type: string, enum: [lead, owner] }
                      release: { $ref: "#/components/schemas/FleetReleasePolicy" }
                      verification: { type: string, enum: [review_and_seal, change_run_read] }
                      reportingStyle: { type: string, minLength: 1, maxLength: 2000 }
                  projectId: { type: string }
                  machine:
                    type: object
                    required: [id, linked, targetRevision]
                    properties:
                      id: { type: string }
                      linked: { type: boolean }
                      targetRevision: { type: string, pattern: "^[a-f0-9]{64}$" }
        "400": { description: Malformed query }
        "401": { description: Owner authentication required }
        "403": { description: Caller lacks owner authority }
        "409": { description: Context could not be verified or settings changed }
  /v1/operator/projects/update:
    post:
      tags: [Operator]
      operationId: updateProjectSettings
      summary: Update project policy while preserving independent inheritance
      description: Each autonomy.fleet leaf overrides its global default independently; null clears only that override and omission retains it. Release mode and rule are one atomic leaf. Responses omit autonomy fields unless includeAutonomy=true; workingPreferences=true then advertises support for the new controls. The expectedRevision fences full project settings even for legacy projections.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      parameters:
        - {
            name: includeAutonomy,
            in: query,
            schema: { type: string, enum: ["true"] },
            description: Opt into project autonomy overrides and global autonomyDefaults,
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [projectId, expectedRevision, changes]
              properties:
                projectId: { type: string }
                expectedRevision: { type: string, pattern: "^[a-f0-9]{64}$" }
                changes:
                  type: object
                  description: Validated project fields, including independent autonomy.fleet overrides
                  properties:
                    autonomy:
                      type: object
                      additionalProperties: false
                      required: [fleet]
                      properties:
                        fleet:
                          type: object
                          additionalProperties: false
                          minProperties: 1
                          properties:
                            closure: { type: string, enum: [lead, owner, null], nullable: true }
                            machineSetup: { type: string, enum: [lead, owner, null], nullable: true }
                            commit: { type: string, enum: [lead, owner, null], nullable: true }
                            push: { type: string, enum: [lead, owner, null], nullable: true }
                            release: { $ref: "#/components/schemas/FleetReleasePolicyPatch" }
                            verification:
                              { type: string, enum: [review_and_seal, change_run_read, null], nullable: true }
                            reportingStyle: { type: string, minLength: 1, maxLength: 2000, nullable: true }
      responses:
        "200": { description: Updated project snapshot and revision }
        "400": { description: Malformed request }
        "401": { description: Owner authentication required }
        "403": { description: Caller lacks owner authority }
        "409": { description: Project settings or owner authority changed }
  /v1/operator/projects:
    get:
      tags: [Operator]
      operationId: getOperatorProjects
      summary: Read owner project settings and their current revision
      description: Legacy responses omit autonomy fields. includeAutonomy=true adds optional project autonomy.fleet overrides, global autonomyDefaults and workingPreferences=true without changing the full settings revision. New working-preference leaves stay absent on an older service.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      parameters:
        - {
            name: includeAutonomy,
            in: query,
            schema: { type: string, enum: ["true"] },
            description: Opt into project autonomy overrides and global autonomyDefaults,
          }
      responses:
        "200": { description: Project settings and SHA-256 revision }
        "401": { description: Owner authentication required }
        "403": { description: Caller is not the owner }
  /v1/operator/projects/remove-workspace:
    post:
      tags: [Operator]
      operationId: removeProjectWorkspace
      summary: Remove one exact owner-approved workspace registration
      description: Preserves roles, grants and assignments. Refuses tracker-bound workspaces, stale revisions, changed owner authority and concurrent settings changes. Does not delete a directory.
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [projectId, workspaceId, expectedRevision]
              properties:
                projectId: { type: string }
                workspaceId: { type: string }
                expectedRevision: { type: string, pattern: "^[a-f0-9]{64}$" }
      responses:
        "200": { description: Updated project settings and revision }
        "400": { description: Malformed request }
        "401": { description: Owner authentication required }
        "403": { description: Caller is not the owner }
        "409": { description: Removal conflicts with current settings or authority }
  /v1/harness-refresh:
    post:
      tags: [Operator]
      operationId: refreshLinkedHarnessPlugins
      summary: Refresh existing native worker plugin links locally and on enabled fleet machines
      description: Uses the native harness installer without enrolling new profiles, changing channel policy or restarting panes. The canonical source workspace selects current machineSetup policy; owner mode requires the caller's ownerApproved consent claim, and automatic lead refresh requires an already-linked target. The service records the claim without verifying human confirmation. Current operator authority, source context and each captured fleet destination are revalidated before refresh. Returns per-profile and per-fleet outcomes; ok is false for incomplete installation, missing source setup or unreachable machines.
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [workingDirectory]
              properties:
                workingDirectory:
                  {
                    type: string,
                    description: Existing absolute source directory,
                    resolved canonically on the service machine,
                  }
                projectId:
                  {
                    type: string,
                    description: Must match the project derived from the current source workspace or registered worktree,
                  }
                ownerApproved:
                  {
                    type: boolean,
                    default: false,
                    description: Caller-reported owner consent; the service cannot verify human confirmation and this confers no additional credential or lane authority,
                  }
      responses:
        "200":
          description: Plugin refresh receipts, including incomplete outcomes
          content:
            application/json:
              schema:
                type: object
                required: [ok, local, fleets, notices, ownerApproval]
                properties:
                  ok: { type: boolean }
                  local: { type: array, items: { type: object } }
                  fleets: { type: array, items: { type: object } }
                  notices: { type: object }
                  ownerApproval:
                    {
                      type: string,
                      enum: [claimed, not_claimed],
                      description: Caller-reported consent,
                      never verified human approval,
                    }
        "400": { description: Invalid refresh context request }
        "403":
          {
            description: Operator required or revoked,
            owner approval required,
            or automatic target is not already linked,
          }
        "409": { description: Source context, settings or captured target changed or could not be verified }
        "503": { description: Harness refresh or policy context unavailable }
  /v1/harness-plugin-version:
    post:
      tags: [Operator]
      operationId: announceInstalledWorkerPluginVersion
      summary: Tell a running service which worker version the installer shipped
      description: Updates display-only restart flags at the next admitted native client request. Client version reports confer no tool authority, and nothing is restarted.
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version]
              properties:
                version: { type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+$' }
      responses:
        "200": { description: Announcement accepted for the next native client request }
        "400": { description: Invalid plugin version }
        "403": { description: Operator required or revoked }
        "503": { description: Plugin notices unavailable }
  /v1/runtime-connections/{id}/harnesses:
    get:
      tags: [Operator]
      operationId: inspectFleetHarnesses
      summary: Inspect native harness registration on one registered remote fleet
      description: Reports profile activation, service versus installed version, bridge, hooks and skill presence. Static registration never establishes live process membership or receiver proof.
      security: [{ operatorBearer: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Per-machine and per-profile harness diagnostics }
        "401": { description: Owner authentication required }
        "403": { description: Caller is not the owner }
        "503": { description: Fleet unavailable or inspector not yet prepared }
  /v1/runtime-connections/{id}/membership:
    get:
      tags: [Operator]
      operationId: inspectFleetMembership
      summary: Inspect host-observed project eligibility on one registered remote fleet
      description: Reports bounded per-pane process, native session, hire and actual cwd observations. Host eligibility does not verify a bridge socket, native tool catalog or delivery. Rechecks the configured fleet, settings, hire, native observations and caller authority before returning.
      security: [{ operatorBearer: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Per-pane host observations with native tools explicitly unverified }
        "401": { description: Current owner authentication required }
        "403": { description: Caller lacks owner control }
        "503": { description: Fleet or native observations unavailable }
  /v1/operator/persona:
    get:
      tags: [Operator]
      operationId: getOperatorPersona
      summary: Read the hosted or local owner-authored persona
      description: Includes persona image diagnostics (files, roles, counts, sizes, video timestamps, viewable cached sheet paths, load errors), never image bytes. Status previews the current folder; the running image snapshot changes on restart.
      security: [{ operatorBearer: [] }]
      responses:
        "200": { description: Persona settings }
        "401": { description: Operator authentication required }
    post:
      tags: [Operator]
      operationId: updateOperatorPersona
      summary: Apply a validated partial persona update
      description: Accepts imagesDir as a folder on the service host (empty string clears). Top-level images and sampled videos are vibe; appearance/ holds physical character references. Returns image status and a restart reminder.
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Partial PersonaSettings; unknown fields are refused
      responses:
        "200": { description: Updated persona settings }
        "400": { description: Invalid persona patch }
        "401": { description: Operator authentication required }
        "503": { description: Settings persistence unavailable }
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Public liveness
      description: Optional Herdr, gateway, host-power and runtime identity findings do not change service liveness. `power` says whether this host may sleep and when it last did (`@clankie/protocol/host-power`; docs/always-on.md). When available, `runtime` exposes only this service boot's pid, commit, root and instanceId; update transaction details are omitted.
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              example:
                {
                  ok: true,
                  service: clankie,
                  runtime:
                    {
                      pid: 1234,
                      commit: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa,
                      root: /fixture/pinned,
                      instanceId: 11111111-1111-4111-8111-111111111111,
                    },
                  power:
                    {
                      state: sleep_allowed,
                      source: battery,
                      sleepAfterMinutes: 1,
                      heldAwakeBy: [],
                      keepAwakeRequested: false,
                    },
                }

  /v1/herdr:
    get:
      tags: [Operator]
      operationId: getHerdrBinding
      summary: Running service's worker-runtime binding
      description: Without a connection ID, pending default-fleet settings apply on service restart. Named connections resolve their pinned endpoint and current health. No unavailable connection falls back to the default fleet.
      parameters:
        - in: query
          name: connection
          schema: { type: string }
          description: Named runtime connection, or default
      security: [{ operatorBearer: [] }]
      responses:
        "200":
          description: Selected local worker runtime
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [runtime, session, socketPath]
                properties:
                  runtime: { type: string, enum: [bundled, external] }
                  session: { type: string }
                  socketPath: { type: string, pattern: "^/", maxLength: 102 }
        "401":
          description: Operator authentication required
        "503":
          description: Operator authentication or runtime binding unavailable

  /v1/discord/presence-status:
    get:
      tags: [Operator, Discord]
      operationId: getDiscordPresenceStatus
      summary: Operator presence snapshot
      description: Phase and counts only. What `clankie status` reads.
      security: [{ operatorBearer: [] }]
      responses:
        "200":
          description: Present-tense presence
          content:
            application/json:
              example:
                schemaVersion: 1
                sessions:
                  - phase: present
                    gatewayConnected: true
                    transportKind: bot
                    voiceGuildCount: 0
                    activityCount: 0
                    updatedAt: "2026-08-15T20:05:32.899Z"

  /v1/discord/user-session/opt-in:
    get:
      tags: [Discord]
      operationId: getDiscordUserSessionOptIn
      summary: Current user-session opt-in
      security: [{ captainBearer: [] }, { operatorBearer: [] }]
      responses:
        "200":
          description: Opt-in or null
    post:
      tags: [Operator, Discord]
      operationId: postDiscordUserSessionOptIn
      summary: Record user-session ToS acceptance
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              schemaVersion: 1
              characterId: clankie
              acknowledgement: I accept Discord user-session transport risk on my account.
              guildIds: ["123456789012345678"]
              channelIds: ["123456789012345678"]
              dmPolicy: deny
      responses:
        "201":
          description: Recorded
    delete:
      tags: [Operator, Discord]
      operationId: deleteDiscordUserSessionOptIn
      summary: Revoke the active user-session opt-in
      security: [{ operatorBearer: [] }]
      responses:
        "200":
          description: Revoked
        "409":
          description: Nothing active to revoke

  /v1/discord/stream-watch:
    get:
      tags: [Operator, Discord]
      operationId: getDiscordStreamWatch
      summary: Latest observed Discord screen shares
      description: Metadata plus up to four chronological stills. Raw video is never stored.
      security: [{ captainBearer: [] }, { operatorBearer: [] }]
      responses:
        "200":
          description: Current share projection
    post:
      tags: [Discord]
      operationId: postDiscordStreamWatch
      summary: Bridge report of shares and optional stills
      security: [{ captainBearer: [] }]
      responses:
        "204":
          description: Report accepted

  /v1/discord/readiness:
    get:
      tags: [Discord]
      operationId: getDiscordReadiness
      summary: Discord captain readiness
      description: Requires a Discord text or voice bridge bearer.
      security: [{ discordTextBearer: [] }, { discordVoiceBearer: [] }]
      responses:
        "200":
          description: Ready
        "503":
          description: A required check is down

  /v1/discord/voice-briefing:
    post:
      tags: [Discord]
      operationId: postDiscordVoiceBriefing
      summary: Compose the realtime voice briefing
      description: Voice-bridge bearer only. Request carries ids; persona is owner-authored.
      security: [{ discordVoiceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              schemaVersion: 1
              guildId: "123456789012345678"
              channelId: "123456789012345679"
              consentedUserIds: ["123456789012345680"]
      responses:
        "200":
          description: Bounded instructions + briefing

  /v1/discord/presence-session-events:
    post:
      tags: [Discord]
      operationId: postDiscordPresenceSessionEvents
      summary: Apply a Discord presence phase event
      security: [{ discordTextBearer: [] }, { discordVoiceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Accepted or idempotent replay

  /v1/discord/presence-sessions:
    get:
      tags: [Discord]
      operationId: getDiscordPresenceSessions
      summary: Full presence session records
      security: [{ captainBearer: [] }]
      responses:
        "200":
          description: Session list

  /v1/discord/voice-history:
    get:
      tags: [Discord]
      operationId: getDiscordVoiceHistory
      summary: Completed voice stays
      security: [{ captainBearer: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 32, default: 5 }
      responses:
        "200":
          description: Recent stays

  /v1/discord/voice-transcripts:
    get:
      tags: [Operator, Discord]
      operationId: getDiscordVoiceTranscripts
      summary: Page through retained Discord voice transcripts
      description: |
        Captain bearer only. Exact speech is returned only while
        `discord.voiceTranscriptLoggingEnabled` is enabled; otherwise the route
        returns an empty page with `enabled: false`. Includes legacy human
        recognition and assistant generated wording (`role: assistant`,
        `speakerId: clankie`, `itemId`, optional `playbackId`/`responseId`,
        `textSource`, `textComplete`, `audioStarted`, `playbackMs`, `outcome`).
        Outcomes are played, interrupted, suppressed, failed, or truncated.
        Generated text may include an unheard ending after a cutoff; no raw
        audio or word-aligned audible transcript is retained.
      security: [{ captainBearer: [] }]
      parameters:
        - in: query
          name: cursor
          description: Exclusive cursor from a previous page.
          schema: { type: string, pattern: "^[0-9]{12}$" }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200":
          description: Bounded transcript page
          content:
            application/json:
              example:
                schemaVersion: 1
                enabled: true
                entries:
                  - schemaVersion: 1
                    body: bot
                    occurredAt: "2026-08-18T20:05:32.899Z"
                    guildId: "123456789012345678"
                    channelId: "123456789012345679"
                    deliveryId: delivery-1
                    speakerId: "123456789012345680"
                    displayName: James
                    text: Hello Clankie
                nextCursor: "000000000001"
                hasMore: false

  /v1/discord/presence-actions:
    post:
      tags: [Discord]
      operationId: postDiscordPresenceActions
      summary: Execute a policy-gated Discord action
      description: |
        Needs a live-session claim in headers:
        `x-clankie-discord-presence-session`,
        `x-clankie-discord-presence-phase`,
        `x-clankie-discord-presence-revision`.
      security: [{ discordTextBearer: [] }, { discordVoiceBearer: [] }]
      parameters:
        - in: header
          name: x-clankie-discord-presence-session
          required: true
          schema: { type: string }
        - in: header
          name: x-clankie-discord-presence-phase
          required: true
          schema: { type: string }
        - in: header
          name: x-clankie-discord-presence-revision
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            example:
              schemaVersion: 1
              idempotencyKey: yaak-typing-1
              action: discord.presence.typing_start
              identity:
                presenceSessionId: replace-me
                correlationId: yaak-1
                profileHash: unversioned
                characterId: clankie
                credentialRef: discord_bot
                transportKind: bot
              payload:
                kind: typing_start
                channelId: "123456789012345679"
      responses:
        "200":
          description: Action result
        "409":
          description: Stale live claim or action unavailable

  /v1/captain/channel-turns:
    post:
      tags: [Captain, Discord]
      operationId: postCaptainChannelTurns
      summary: One Discord message becomes one captain turn
      security: [{ discordTextBearer: [] }, { discordVoiceBearer: [] }]
      parameters:
        - in: header
          name: Prefer
          required: false
          schema: { type: string, enum: [respond-async] }
          description: Return 202 while the turn runs, then poll the delivery ID. Without this header, the request waits for the result.
      requestBody:
        required: true
        content:
          application/json:
            example:
              schemaVersion: 1
              deliveryId: yaak-delivery-1
              identity:
                presenceSessionId: replace-me
                correlationId: yaak-1
                profileHash: unversioned
                characterId: clankie
                credentialRef: discord_bot
                transportKind: bot
              trigger:
                kind: message
                id: "1"
                channelId: "123456789012345679"
                actorId: "123456789012345680"
                body: hello from Yaak
      responses:
        "200":
          description: Settled turn
        "202":
          description: Turn accepted and still running

  /v1/captain/channel-turns/{deliveryId}:
    get:
      tags: [Captain, Discord]
      operationId: getCaptainChannelTurn
      summary: Poll a Discord turn by its stable delivery ID
      security: [{ discordTextBearer: [] }, { discordVoiceBearer: [] }]
      parameters:
        - in: path
          name: deliveryId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Settled turn
        "202":
          description: Turn still running
        "404":
          description: Turn unavailable after a service restart; resubmit the original delivery

  /v1/captain/presence:
    post:
      tags: [Captain]
      operationId: postCaptainPresence
      summary: Report captain lease heartbeat
      security: [{ captainBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              schemaVersion: 1
              type: captain.heartbeat
              eventId: yaak-hb-1
              leaseId: replace-me
              generationId: replace-me
              occurredAt: "2026-08-15T20:00:00.000Z"
      responses:
        "202":
          description: Accepted

  /operator/v1/dispatch:
    post:
      tags: [Captain]
      operationId: postOperatorDispatch
      summary: Operator conversation contract
      description: |
        One route, discriminated `op`: `list`, `roster`, `get`, `create`,
        `fork`, `close`, `send`, `cancel`, `replay`, `subagent_replay`, `tail`, `autonomy`,
        `terminal_tail`, `readopt_seat`, `worker_reports`, and
        `acknowledge_worker_reports`. Worker ownership/report operations require
        current operator authority and an exact conversationId. Re-adoption
        proves the original owner and same native thread. Worker reads return
        complete bounded unread payloads and ackDeliveryIds without acknowledging;
        only fully offered IDs may be marked read. Roster/fleet report summaries
        survive disappeared panes, and delivery receipts never establish reading.
        The TUI and relay both speak this.
        The `autonomy` command `set_goal` activates an owner-authored goal;
        `accept_goal` confirms an inactive model proposal. Service goals default
        to a finite 1,000,000-token budget and refuse activation for native heads.
        Starting, accepting or resuming a goal, and enabling autonomy, require
        an operator credential or active terminalControl device authority.
        A captain bearer alone receives 403 goal_owner_required.
        Seat scopes
        identify Herdr direct-send/projection threads. `cancel` interrupts one
        accepted run: the captain aborts the live model turn and the durable
        log settles that run as `cancelled`. `fork` clones the current Pi leaf
        into an ephemeral child conversation. Pane-scoped `send` and
        `state_stance` and `state_work` requests qualify their pane ID with the source socket.
        A mismatched `send` loses its pane association; a mismatched stance
        returns 409 without changing a worker. Seat-control operations
        return 503 with herdr_unavailable when the default runtime is unavailable;
        ordinary conversations and their durable records remain accessible.
        `presence` returns a strict snapshot with mood (`needs_you`, `thinking`,
        `in_voice`, `playing`, `leading`, `idle`, in that precedence), detail,
        since (source start timestamp or null when unknown), activeSeats (all live
        registered fleet seats), and optional pendingOwnerItem (oldest unanswered
        owner preference: conversationId, questionId, title, since). It uses
        optional cursor and waitMs (0–30000); an absent or changed cursor returns
        immediately. A current cursor parks until the projected sources change,
        sampled within 500 ms, or the wait expires. Unreachable is a client
        transport state, never a mood. Paired hosted devices may read it.
        Optional expression is a transient desktop action with UUID id and ISO
        expiresAt: kind emote adds animation (a hero sprite tag), kind say adds
        text (1–200 characters), and kind move adds x/y (normalized 0–1 on the
        current display, left-to-right/top-to-bottom). Expiry or owner quiet
        hours removes it and changes the cursor without changing the mood.
        Clients discard expired actions even while disconnected, honor Focus,
        and never take keyboard focus to show an expression.
        `fleet` returns one cursor-coherent snapshot. Optional `view: home`
        omits historical personas that are neither seated
        contacts nor channel participants. Seats, channels, tallies and edges
        are unchanged. Omitting the selector preserves the full directory;
        `personas` and conversation IDs still address retained history.
        `set_persona_role` (`personaId`, `role`: a built-in such as planner,
        designer, builder, tester, reviewer or researcher, or a custom role of
        1-24 letters, digits, spaces and hyphens; null clears) returns the
        updated persona and rides the steer grant (ADR 0208). Roles are trimmed
        and whitespace-collapsed, built-ins fold to lowercase, and custom roles
        keep their casing and compare case-insensitively. `roles` returns the
        built-ins, then custom roles in use, as `{ role, builtIn, count }`. Fleet seats may
        carry `subagents` (running count and up to eight recent labels) for
        local Claude, Codex and registered OpenCode seats that were hired or
        whose chat is open. Recent entries optionally carry native `id`,
        `startedAt` and `endedAt`; absent means unknown.
        `work_items` takes an optional case-insensitive `label`; items may
        carry optional backend-native parent metadata. `work_item_write` requires
        the original owner with terminalControl and request {repoId,itemId,
        requestId UUID,command}. Commands assign work-metadata owner, add/remove
        a role label, or append a dependency. `work_item_write_receipt` takes
        repoId,itemId,requestId and reads the original scoped result. Both return
        an accepted envelope with receipt {requestId,outcome:applied|refused|uncertain,
        message,item?}. Repeated IDs and receipt reads never replay a write.
        `subagent_replay` takes `replay` with the parent's existing seat/persona
        `conversationId`, a native `subagentId`, `surfaceClientId` and the ordinary
        replay paging options. It needs only the chat grant and returns
        `subagentId` plus the ordinary normalized replay result. It reads a
        bounded local child window through the parent's native source without
        creating a conversation or granting send, resume or terminal control.
        Missing locators, changed parents and remote children return typed
        recovery. Older hosts may reject this operation while their fleet
        remains readable.
        `replay` optionally takes `direction: backward`, `turnLimit` (1..40,
        default 20) and `limit` (1..500, default 500 for backward). Omit `cursor`
        to open the newest window; pass the page's `previousCursor` as the next
        exclusive upper bound to load older history. Events remain chronological.
        `hasOlder` and `hasMore` say whether more retained history precedes the
        backward page. `nextCursor` is still the newest event in that page and
        can resume an ordinary forward `tail`. The event ceiling wins when one
        turn exceeds 500 events. Omitted direction preserves forward replay and
        tail behavior. Clients keep distinct older-history and live-tail cursors.
        `terminal_catalog` lists up to 48 panes per execution connection (16 connections).
        Each row carries runtime identity separately from Herdr workspace/tab IDs.
        Named terminal addresses pin their endpoint; tail, control and input refuse
        disabled or changed connections with a typed unavailable result, without
        falling back to the default fleet. Terminal catalog/tail require the relay's
        `terminalObserve` grant; control/input require `terminalControl`.
        `connections` reads bounded runtime and account metadata or manages
        named runtime connections. Commands are `list`, `connect_runtime` (id,
        session), `reconnect_runtime`, `disconnect_runtime`
        (id). It requires the operator captain lane; the device relay requires
        `steer`. No provider credential, socket path or session capability is returned.
      parameters:
        - in: header
          name: x-clankie-herdr-socket
          required: false
          schema: { type: string }
          description: Caller Herdr session's exact socket path, required for pane identity.
      security: [{ captainBearer: [] }, { operatorBearer: [] }, { deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            examples:
              list:
                summary: List conversations
                value: { op: list, schemaVersion: 1 }
              roster:
                summary: List live Herdr seats
                value: { op: roster, schemaVersion: 1 }
              create:
                summary: Create a global conversation
                value:
                  op: create
                  schemaVersion: 1
                  scope: { kind: global }
                  title: Yaak probe
              get:
                summary: Get one conversation
                value:
                  op: get
                  schemaVersion: 1
                  conversationId: replace-me
              fork:
                summary: Fork an ephemeral side conversation
                value:
                  op: fork
                  schemaVersion: 1
                  parentConversationId: replace-me
              close:
                summary: Close a non-default conversation or discard a side fork
                value:
                  op: close
                  schemaVersion: 1
                  conversationId: replace-me
              send:
                summary: Send a message turn
                value:
                  op: send
                  schemaVersion: 1
                  turn:
                    schemaVersion: 1
                    kind: message
                    conversationId: replace-me
                    surfaceClientId: yaak
                    expectedRevision: 0
                    message: ping from Yaak
              replay:
                summary: Replay a page
                value:
                  op: replay
                  schemaVersion: 1
                  replay:
                    schemaVersion: 1
                    conversationId: replace-me
                    surfaceClientId: yaak
                    limit: 50
              replay_latest:
                summary: Open the newest 20 turns
                value:
                  op: replay
                  schemaVersion: 1
                  replay:
                    schemaVersion: 1
                    conversationId: replace-me
                    surfaceClientId: yaak
                    direction: backward
                    turnLimit: 20
                    limit: 500
              autonomy:
                summary: Read autonomy state for one conversation
                value:
                  op: autonomy
                  schemaVersion: 1
                  conversationId: replace-me
                  command: { action: status }
      responses:
        "200":
          description: Discriminated result
        "403":
          description: goal_owner_required for activation without owner/device authority

  /captain/v1/lanes:
    get:
      tags: [Captain]
      operationId: getCaptainLanes
      summary: Observable captain lanes
      security: [{ captainBearer: [] }]
      responses:
        "200":
          description: Lane listing

  /v1/captain/evaluator:
    get:
      tags: [Captain, Operator]
      operationId: getEvaluatorStatus
      summary: Independent evaluator status, queue and recent reports
      security: [{ operatorBearer: [] }]
      responses:
        "200":
          description: Enabled state, harness, pane, errors, queue count and up to 50 recent jobs
        "401":
          description: Operator authentication required
    post:
      tags: [Captain, Operator]
      operationId: commandEvaluator
      summary: Enable, disable, focus or retry the independent evaluator
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action]
                  properties:
                    action: { const: enable }
                    harness: { type: string, enum: [codex, claude] }
                - type: object
                  additionalProperties: false
                  required: [action]
                  properties:
                    action: { type: string, enum: [disable, open] }
                - type: object
                  additionalProperties: false
                  required: [action, id]
                  properties:
                    action: { const: retry }
                    id: { type: string, format: uuid }
      responses:
        "200":
          description: Current evaluator status; operational startup errors appear in error
        "400":
          description: Invalid command
        "401":
          description: Operator authentication required
        "409":
          description: Conflicting command or unavailable pane

  /v1/captain/issue-metrics:
    get:
      tags: [Captain, Operator]
      operationId: getIssueMetrics
      summary: Observed issue and worker tokens, elapsed time, checks and reviews
      description: |
        Read-only projection of retained exact local native bindings, native
        transcripts, settled turn metrics, seat ledger edges and unresolved hire
        receipts. Unknown totals are null and partial/unsupported sources are
        explicit in coverage. No transcript, command or credential is returned.
        Window selects approval time or latest unfinished observation; totals
        cover the selected episode. Passed seat edges never establish approval.
      security: [{ operatorBearer: [] }]
      parameters:
        - in: query
          name: issue
          schema: { type: string, pattern: "^[A-Z][A-Z0-9]*-[0-9]+$" }
        - in: query
          name: worker
          description: Exact worker label, terminal ID or native session reference.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - in: query
          name: since
          description: ISO timestamp; defaults to 24 hours before until.
          schema: { type: string, format: date-time }
        - in: query
          name: until
          description: Exclusive ISO end; defaults to now. Maximum window 366 days.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: schemaVersion, window, issues, workers and coverage.
        "400":
          description: Invalid filter or time window.
        "401":
          description: Operator authentication required.
        "503":
          description: Operator authentication unavailable.

  /v1/captain/turn-metrics:
    get:
      tags: [Captain, Operator]
      operationId: getCaptainTurnMetrics
      summary: Recent settled captain turns
      description: |
        Counters, execution identity and reported usage for recent settled
        operator and Discord turns, newest first, from the durable
        `turn-settled.jsonl` the captain appends. Never a transcript, tool
        argument, tool output or credential.

        `execution` is the model, provider and effort that actually ran the turn,
        captured as it executed rather than read back from configuration.
        `usage` is `totalTokens` summed over the assistant messages the provider
        reported plus `reports`, the number that contributed. Both are `null`
        when unknown — a turn settled before the capture existed, or a provider
        that reported nothing. Null never means zero, and `contextTokensStart` /
        `contextTokensEnd` are context occupancy, never usage or a charge.
      security: [{ operatorBearer: [] }]
      parameters:
        - in: query
          name: limit
          description: 1–100; clamped, never refused. Defaults to 20.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: runId
          description: Narrow to one run.
          schema: { type: string }
      responses:
        "200":
          description: Bounded settled-turn metrics, newest first
        "401":
          description: Operator authentication required

  /v1/captain/seat-context:
    post:
      tags: [Captain, Operator]
      operationId: createCaptainSeatContext
      summary: Create a separate workspace chat for a new native operator seat
      security: [{ operatorBearer: [] }, { captainBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [op, schemaVersion, scope, title]
              properties:
                op: { type: string, enum: [create] }
                schemaVersion: { type: integer, enum: [1] }
                scope:
                  type: object
                  additionalProperties: false
                  required: [kind, workspaceId]
                  properties:
                    kind: { type: string, enum: [workspace] }
                    workspaceId: { type: string, minLength: 1, maxLength: 512 }
                title: { type: string, minLength: 1, maxLength: 256 }
      responses:
        "201":
          description: A fresh service-owned conversationId and cwd; repeated launches create separate chats
          content:
            application/json:
              schema:
                type: object
                required: [conversationId, cwd]
                properties:
                  conversationId: { type: string }
                  cwd: { type: string }
        "400":
          description: Invalid workspace conversation creation request
        "401":
          description: Authentication required
        "403":
          description: Operator lane required
    get:
      tags: [Captain, Operator]
      operationId: getCaptainSeatContext
      summary: Resolve an operator seat to its service conversation and workspace
      security: [{ operatorBearer: [] }, { captainBearer: [] }]
      parameters:
        - in: query
          name: conversationId
          description: Existing global or workspace conversation; defaults to the global head.
          schema: { type: string, minLength: 1, maxLength: 256 }
      responses:
        "200":
          description: The service-owned conversationId and cwd
          content:
            application/json:
              schema:
                type: object
                required: [conversationId, cwd]
                properties:
                  conversationId: { type: string }
                  cwd: { type: string }
        "400":
          description: Invalid conversation ID
        "403":
          description: Operator lane required
        "404":
          description: Unknown conversation or a scope that does not run Clankie

  /v1/seat/transcript:
    post:
      tags: [Captain, Operator]
      operationId: syncOperatorSeatTranscript
      summary: Append redacted native seat display records to its selected conversation
      security: [{ operatorBearer: [] }, { captainBearer: [] }]
      parameters:
        - in: query
          name: conversationId
          description: Existing global or workspace conversation; defaults to the global head.
          schema: { type: string, maxLength: 256 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sessionId, entries]
              properties:
                sessionId: { type: string, format: uuid }
                activity:
                  type: string
                  enum: [responding, waiting]
                  description: Native hook activity, supplied on the final transcript page. Display only; does not complete a service run.
                entries:
                  type: array
                  maxItems: 100
                  description: Normalized message or tool display records; host image paths are rejected. Total request limit is 1 MiB.
                  items:
                    oneOf:
                      - type: object
                        additionalProperties: false
                        required: [type, id, role, text]
                        properties:
                          type: { type: string, enum: [message] }
                          id: { type: string, minLength: 1, maxLength: 256 }
                          role: { type: string, enum: [operator, agent] }
                          text: { type: string, maxLength: 16384 }
                          occurredAt: { type: string, maxLength: 64 }
                      - type: object
                        additionalProperties: false
                        required: [type, id, toolCallId, name, phase]
                        properties:
                          type: { type: string, enum: [tool] }
                          id: { type: string, minLength: 1, maxLength: 256 }
                          toolCallId: { type: string, minLength: 1, maxLength: 512 }
                          name: { type: string, minLength: 1, maxLength: 512 }
                          phase: { type: string, enum: [started, completed, failed] }
                          detail: { type: string, maxLength: 16384 }
                          occurredAt: { type: string, maxLength: 64 }
      responses:
        "200":
          description: Accepted; repeated native entry IDs do not append duplicate events
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } }, required: [ok] }
        "400":
          description: Invalid transcript or conversation ID
        "401":
          description: Authentication required
        "403":
          description: Operator lane required
        "404":
          description: Unknown captain conversation
        "409":
          description: Native session is pinned to another conversation or retired by reset
        "413":
          description: Request exceeds 1 MiB

  /v1/captain/prompt:
    get:
      tags: [Captain, Operator]
      operationId: getCaptainLanePrompt
      summary: The system prompt a lane's session starts from
      description: |
        Plain text, for a seat launcher in another harness. `sections` is a
        comma-separated subset of `identity`, `persona`, `reach`, `fleet`, `address`,
        `model`; omitted, it is the session's standard sections (`model` is
        the per-run card, asked for by name). The lane must be the bearer's
        own — the operator credential and the console captain token are
        `operator`, a Discord bridge bearer is the lane it serves. An explicit
        conversationId adds that workspace's agent instructions with source paths.
      security: [{ operatorBearer: [] }, { captainBearer: [] }]
      parameters:
        - in: query
          name: conversationId
          description: Existing operator global/workspace conversation; omitted selects the global head.
          schema: { type: string, minLength: 1, maxLength: 256 }
        - in: query
          name: lane
          description: Defaults to the bearer's own lane.
          schema: { type: string, enum: [operator, discord_voice, discord_presence, gameplay] }
        - in: query
          name: sections
          schema: { type: string, example: "persona,model" }
      responses:
        "200":
          description: The assembled prompt
          content:
            text/plain: {}
        "400":
          description: Unknown lane or section name
        "403":
          description: Lane is not the bearer's own

  /v1/captain/memory-card:
    get:
      tags: [Captain, Operator]
      operationId: getCaptainLaneMemoryCard
      summary: The memory card that lane's next run injects
      description: |
        Plain text, for a per-turn hook. Filtered by lane the same way the pi
        session's own injection is: operator-private notes reach only the
        operator lane. An empty store still returns a labeled card. The lane
        must be the bearer's own.
      security: [{ operatorBearer: [] }, { captainBearer: [] }]
      parameters:
        - in: query
          name: lane
          description: Defaults to the bearer's own lane.
          schema: { type: string, enum: [operator, discord_voice, discord_presence, gameplay] }
      responses:
        "200":
          description: The lane's recall card
          content:
            text/plain: {}
        "400":
          description: Unknown lane
        "403":
          description: Lane is not the bearer's own

  /v1/mcp:
    parameters:
      - in: query
        name: conversationId
        description: Operator conversation binding; every request in a session retains it. Omitted selects the global head.
        schema: { type: string, minLength: 1, maxLength: 256 }
    post:
      tags: [Captain]
      operationId: laneMcp
      summary: A lane's tool bank over streamable-HTTP MCP
      description: |
        Streamable-HTTP MCP over Clankie's authored tool registry. The bearer
        selects the lane and the lane selects the tools: the operator credential
        and the console captain token are `operator`, a Discord bridge bearer is
        the lane it serves, and a connection lists exactly that lane's authority
        plan (authored tools, the browser catalog, and the connected-service
        tools that lane may reach). An `initialize` POST opens a session and
        returns its id in `mcp-session-id`; every later request must carry that
        header and resolve to the same lane and conversation. `DELETE` ends the session.
        `clankie mcp` is the stdio bridge to this route (ADR 0152).
      security:
        [{ operatorBearer: [] }, { captainBearer: [] }, { discordTextBearer: [] }, { discordVoiceBearer: [] }]
      responses:
        "200":
          description: JSON-RPC response for this request
        "400":
          description: No session id on a non-initialize request
        "403":
          description: The session belongs to another lane or conversation
        "404":
          description: Unknown or expired session
    get:
      tags: [Captain]
      operationId: laneMcpStream
      summary: Server-to-client notification stream for an open session
      description: Requires `mcp-session-id`; the bearer must resolve to the session's lane.
      security:
        [{ operatorBearer: [] }, { captainBearer: [] }, { discordTextBearer: [] }, { discordVoiceBearer: [] }]
      responses:
        "200":
          description: SSE stream
        "400":
          description: No session id
        "403":
          description: The session belongs to another lane or conversation
        "404":
          description: Unknown or expired session
    delete:
      tags: [Captain]
      operationId: laneMcpClose
      summary: End an MCP session
      security:
        [{ operatorBearer: [] }, { captainBearer: [] }, { discordTextBearer: [] }, { discordVoiceBearer: [] }]
      responses:
        "200":
          description: Session closed
        "403":
          description: The session belongs to another lane or conversation
        "404":
          description: Unknown or expired session

  /v1/seat/events:
    get:
      tags: [Captain, Operator]
      operationId: pollSeatEvents
      summary: Long-poll the seat's outbox
      description: |
        Wakes, herdr completion watches, and room escalations queued for a
        bound head (ADR 0152). Polling is what binds the seat: `clankie mcp`
        asks again the moment a poll returns and pushes each event into the
        session as a channel notification. Operator bearer only; a Discord
        bridge bearer is 403. `wait` is capped at 30000 ms.
      security: [{ operatorBearer: [] }, { captainBearer: [] }]
      parameters:
        - in: query
          name: conversationId
          description: Existing operator global/workspace conversation; omitted selects the global head.
          schema: { type: string, minLength: 1, maxLength: 256 }
        - in: query
          name: wait
          schema: { type: integer, minimum: 0, maximum: 30000, default: 0 }
      responses:
        "200":
          description: Events taken from the outbox, possibly none
          content:
            application/json:
              example:
                schemaVersion: 1
                events:
                  - schemaVersion: 1
                    id: seat-1
                    kind: wake
                    conversationId: global-default
                    source: service
                    content: "This is a self-wake you scheduled…"
                    createdAt: "2026-09-01T20:00:00.000Z"
        "403":
          description: Not the operator lane

  /v1/seat/events/{id}/reply:
    post:
      tags: [Captain, Operator]
      operationId: replySeatEvent
      summary: Answer an escalation from the seat
      description: The reply lands in the escalating conversation as his own message and settles that run.
      security: [{ operatorBearer: [] }, { captainBearer: [] }]
      parameters:
        - in: query
          name: conversationId
          description: Existing operator global/workspace conversation; omitted selects the global head.
          schema: { type: string, minLength: 1, maxLength: 256 }
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            example: { schemaVersion: 1, text: "On it — the build is green." }
      responses:
        "200":
          description: Replied
        "404":
          description: Nothing is waiting on that event

  /v1/fleet/efficiency:
    post:
      tags: [Operator]
      operationId: reviewFleetEfficiency
      summary: Inspect owned seats or record a worker review
      description: |
        `show` returns every seat led by the exact conversation, including
        linked fleets, with optional factual efficiency evidence. `review`
        records inspected scope, tracker status or substantive progress for
        one exact owned native session. It changes no tracker state, harness
        settings, ownership or report receipts. Unknown telemetry is omitted,
        never treated as healthy. Flags are observations for the lead skill;
        they do not prescribe or perform worker actions. Every watch wake calls
        for reviewing all owned seats; periodic lead rounds default to 30 minutes
        and coalesce while a review turn is outstanding. Prompts carry bounded
        summaries; use show for full details and every-owned inspection. Original
        report acceptance or attempt remains progress after acknowledgment;
        acknowledgment creates no new progress. Context percentage is the latest
        native Codex model-input snapshot and may age between responses. Claude
        context/effort and OpenCode or remote telemetry remain unknown.
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FleetEfficiencyRequest" }
            examples:
              show:
                value: { action: show, conversationId: global-default }
              review:
                value:
                  action: review
                  conversationId: global-default
                  seatId: worker-seat
                  assignmentStatus: active
                  deliverable: VUH-1662
                  evidence: "Reviewed the assigned issue and current worker report."
      responses:
        "200":
          description: Current owned roster, after recording the review when requested
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FleetEfficiencyResponse" }
        "400":
          description: Invalid strict request (invalid_request)
        "401":
          description: Operator authentication required (operator_authentication_required)
        "409":
          description: Conversation, native ownership or review observation unavailable (refused)
        "503":
          description: Fleet efficiency service unavailable (fleet_efficiency_unavailable)

  /v1/fleet/tidy-worktrees:
    post:
      tags: [Operator]
      operationId: listTidyWorktrees
      summary: List merged, clean worktree cleanup candidates
      description: |
        Read-only listing from the exact canonical repository root and locally
        saved merge ref (origin/main by default); it never fetches refs or
        removes worktrees. Main, locked, prunable, dirty, unmerged and live-pane
        worktrees are excluded. Idle agents and shells also protect their
        directories. Unverified paths, unavailable or changing refs, and an
        incomplete or changing local pane inventory return outcome unavailable
        with no candidates. Candidate status does not prove ownership; the tidy
        skill verifies ownership, preserved results and fresh landing evidence
        before any separately authorized removal.
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TidyWorktreesRequest" }
      responses:
        "200":
          description: Read-only candidates and exclusions, or an unavailable listing with no candidates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TidyWorktreesResponse" }
        "400":
          description: Invalid strict request (invalid_request)
        "401":
          description: Operator authentication required (operator_authentication_required)
        "503":
          description: Worktree listing service unavailable (tidy_worktrees_unavailable)

  /v1/fleet/seats/{paneId}/events:
    get:
      tags: [Captain, Operator]
      operationId: pollFleetSeatEvents
      summary: Long-poll a fleet seat's mailbox
      description: |
        A DM or room turn queued for a bound fleet seat (ADR 0161). Polling is
        what binds the mailbox: `clankie mcp --seat` asks again the moment a
        poll returns and pushes each event into the session as a channel
        notification. Operator bearer only; a Discord bridge bearer is 403.
        `wait` is capped at 30000 ms. `unknown_seat` (404) is the pane before
        herdr has classified the harness; the bridge retries.
      security: [{ operatorBearer: [] }, { captainBearer: [] }]
      parameters:
        - in: path
          name: paneId
          required: true
          schema: { type: string }
        - in: query
          name: wait
          schema: { type: integer, minimum: 0, maximum: 30000, default: 0 }
      responses:
        "200":
          description: Events taken from the mailbox, possibly none
          content:
            application/json:
              example:
                schemaVersion: 1
                events:
                  - schemaVersion: 1
                    id: seat-1
                    kind: message
                    conversationId: conv-potato
                    source: operator
                    content: "Please finish the tests"
                    createdAt: "2026-09-06T20:00:00.000Z"
        "403":
          description: Not the operator lane
        "404":
          description: No messageable agent in that pane

  /v1/fleet/seats/{paneId}/peers:
    get:
      tags: [Captain]
      operationId: listFleetPeerSeats
      summary: List native seats in the calling worker's fleet
      description: |
        Requires the local process listener or registered remote relay's exact
        native pane/session proof. Operator and fleet bearers alone do not
        identify a peer sender. Returns sender and recipient seat IDs, panes,
        harnesses, titles and native binding hashes. The owner setting
        fleet.peerMessages=off refuses discovery. No workspace or account
        authority is granted by a peer message (ADR 0213 amendment).
      security: []
      parameters:
        - in: path
          name: paneId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Current same-fleet native seat bindings
        "403":
          description: Peer messaging off or native sender proof unavailable

  /v1/fleet/seats/{paneId}/peer-messages:
    post:
      tags: [Captain]
      operationId: sendFleetPeerMessage
      summary: Send one same-fleet peer message through native seat delivery
      description: |
        Uses the same native delivery path as message_seat, with server-authored
        sender attribution and agent-output framing. Requires native process
        admission, the sender binding, and the exact same-fleet recipient binding
        returned by peers. Rechecks the owner switch and native bindings before
        dispatch. Persists the original delivery UUID before sending. Uncertain
        attempts reconcile through GET only; neither a duplicate UUID nor a new
        follow-up replays the original. Records exchanges and receipts in the
        service audit and Clankie's agent-role transcript without an owner turn.
      security: []
      parameters:
        - in: path
          name: paneId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            example:
              schemaVersion: 1
              seatId: pc/recipient-terminal
              recipientBinding: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
              text: "The shared interface is ready."
              delivery:
                id: 10000000-0000-4000-8000-000000000001
                binding: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      responses:
        "200":
          description: Exact receipt with deliveryId, bindings, fingerprint, outcome and deliveryStage
        "400":
          description: Invalid peer message
        "403":
          description: Native peer sender proof unavailable

  /v1/fleet/seats/{paneId}/peer-messages/{id}:
    get:
      tags: [Captain]
      operationId: reconcileFleetPeerMessage
      summary: Inspect the original peer delivery receipt without resending
      description: |
        Requires the original sender's native process/session, original binding,
        delivery UUID and fingerprint. The fingerprint covers recipient seat,
        recipient binding and normalized text. Available while peer messaging
        is off. May match the original native transcript or exact channel/hook
        acknowledgment; absence of proof remains uncertain while the original
        recipient is bound. A lost recipient binding settles to recipient_gone
        with outcome unconfirmed: delivery remains unknown, never resends, and
        no longer blocks fresh messages. Older settled bodies are pruned after
        100 messages; exact compact receipts and unresolved originals are retained.
      security: []
      parameters:
        - in: path
          name: paneId
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: binding
          required: true
          schema: { type: string, pattern: "^[a-f0-9]{64}$" }
        - in: query
          name: fingerprint
          required: true
          schema: { type: string, pattern: "^[a-f0-9]{64}$" }
      responses:
        "200":
          description: Original receipt, with no new send attempt
        "400":
          description: Invalid original receipt reference
        "403":
          description: Native peer sender proof unavailable
        "404":
          description: No exact original receipt available; delivery remains uncertain

  /v1/fleet/seats/{paneId}/hook:
    post:
      tags: [Captain, Operator]
      operationId: recordFleetSeatHook
      summary: Report a hired seat's lifecycle hook
      description: |
        The clankie-worker plugin's hooks, forwarded by `clankie seat-hook`
        from inside the seat's pane (VUH-1458). A Stop or StopFailure settles
        the seat's turn for its adapter and any completion watch, with the
        harness's own final text as `lastMessage`. The session must be the
        Claude session herdr reports in that pane. Lifecycle reports accept the
        operator or bound fleet lane. Only native process proof from the request
        transport can register or drain a next-turn receiver. UserPromptSubmit
        may return additionalContext and messageIds, with deliveryStage uncertain
        until the hook writes stdout and posts deliveredMessageIds on the same
        session. That acknowledgment confirms bridge delivery, never model consumption.
        Held mail expires within 24 hours; an uncertain take is never replayed.
      security: [{ operatorBearer: [] }, { captainBearer: [] }]
      parameters:
        - in: path
          name: paneId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            example:
              {
                schemaVersion: 1,
                event: Stop,
                sessionId: "10000000-0000-4000-8000-000000000001",
                lastMessage: "Tests pass.",
              }
      responses:
        "200":
          description: Recorded
        "400":
          description: Not a seat hook
        "403":
          description: Not the operator lane
        "404":
          description: That pane holds no Claude seat with this session

  /v1/fleet/seats/{paneId}/tool-catalog:
    post:
      tags: [Captain, Operator]
      operationId: recordFleetNativeToolCatalog
      summary: Report the occupying native harness's accepted Clankie tools
      description: |
        A linked Claude mod or Codex startup probe reports raw Clankie bridge
        names from the actual native session catalog. The service verifies the
        current pane, harness and session against Herdr, compares the bridge's
        served expectations and retains a matched/mismatch/unverified diagnostic.
        This report never grants tools or routes messages. Native probe failures
        carry error and remain unverified; process liveness is separate evidence.
      security: [{ operatorBearer: [] }, { captainBearer: [] }]
      parameters:
        - in: path
          name: paneId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schemaVersion, harness, sessionId, bridge, tools, checkedAt]
              properties:
                schemaVersion: { type: integer, const: 1 }
                harness: { type: string, enum: [claude, codex] }
                sessionId: { type: string, minLength: 1, maxLength: 256 }
                bridge: { type: string, enum: [worker, operator] }
                tools:
                  type: array
                  maxItems: 4096
                  items: { type: string, minLength: 1, maxLength: 256 }
                checkedAt: { type: string, format: date-time }
                error: { type: string, maxLength: 2048 }
                conversationId: { type: string, minLength: 1, maxLength: 256 }
      responses:
        "200": { description: Session-bound status, missing tools, detail and one remediation }
        "400": { description: Invalid native catalog report }
        "403": { description: Fleet admission or native pane/session identity refused }

  /v1/fleet/tool-catalog-health:
    get:
      tags: [Operator]
      operationId: readFleetNativeToolCatalogHealth
      summary: Read native catalog health for every current Claude and Codex seat
      description: Includes the operator head. Reports from a previous occupant are never reused.
      security: [{ operatorBearer: [] }]
      responses:
        "200": { description: Session-bound catalog health and remediation in seats }
        "401": { description: Operator authentication required }

  /v1/operator/projects/add-worktree-root:
    post:
      tags: [Operator]
      operationId: addProjectWorktreeRoot
      summary: Enroll a repository-bound linked-worktree root
      description: |
        Owner only. Requires projectId, machineId, platform, path, repoPath and
        expectedRevision. The service observes canonical root/repository paths
        and Git common-directory identity, then rechecks native facts, authority
        and revision before saving. The repo must exactly match an approved
        workspace in the project. This confers no tool grant.
      security: [{ operatorBearer: [] }]
      responses:
        "200":
          description: Project snapshot and new revision
        "400":
          description: Malformed request
        "403":
          description: Owner authority required
        "409":
          description: Unverified root, namespace conflict, or changed authority/settings
  /v1/operator/projects/remove-worktree-root:
    post:
      tags: [Operator]
      operationId: removeProjectWorktreeRoot
      summary: Remove a linked-worktree root enrollment
      description: |
        Owner only. Requires projectId, rootId and expectedRevision. Rechecks
        authority and revision before persistence. Deletes no filesystem content.
      security: [{ operatorBearer: [] }]
      responses:
        "200":
          description: Project snapshot and new revision
        "400":
          description: Malformed request
        "403":
          description: Owner authority required
        "409":
          description: Unknown root or changed authority/settings

  /v1/memory:
    get:
      tags: [Memory, Operator]
      operationId: getOperatorMemoryCatalog
      summary: Browse every memory note and Discord person fact
      description: >-
        Notes persist until forgotten. Catalog retention fields remain legacy
        compatibility metadata and no longer impose a count quota.
      security: [{ operatorBearer: [] }]
      responses:
        "200":
          description: Complete operator-only memory catalog

  /v1/memory/discord-people/proposals:
    post:
      tags: [Memory, Discord]
      operationId: postDiscordPersonMemoryProposal
      summary: Upsert a Discord person fact
      security: [{ discordTextBearer: [] }, { discordVoiceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              schemaVersion: 1
              proposalId: yaak-proposal-1
              fact:
                schemaVersion: 1
                factId: yaak-fact-1
                subject: { guildId: "123456789012345678", userId: "123456789012345680" }
                kind: person-fact
                body: Prefers short replies.
                visibility: { scope: guild }
                provenance:
                  correlationId: yaak-1
                  sourceEventId: yaak-src-1
                  sourceSurface: discord_text
                  rawTranscript: false
                confidence: 0.8
                createdAt: "2026-08-15T20:00:00.000Z"
                updatedAt: "2026-08-15T20:00:00.000Z"
      responses:
        "201":
          description: Stored

  /v1/memory/discord-people/{guildId}/{userId}:
    get:
      tags: [Memory, Discord]
      operationId: getDiscordPersonMemory
      summary: Recall Discord person facts
      security: [{ discordTextBearer: [] }, { discordVoiceBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/guildId"
        - $ref: "#/components/parameters/userId"
        - in: query
          name: channelId
          schema: { type: string }
        - in: query
          name: query
          schema: { type: string }
      responses:
        "200":
          description: Facts and optional recall card
    delete:
      tags: [Memory, Operator]
      operationId: deleteDiscordPersonMemory
      summary: Delete every fact for a Discord person
      security: [{ operatorBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/guildId"
        - $ref: "#/components/parameters/userId"
      responses:
        "200":
          description: Deleted ids

  /v1/memory/discord-people/{guildId}/{userId}/export:
    get:
      tags: [Memory, Operator]
      operationId: exportDiscordPersonMemory
      summary: Operator export of a Discord person
      security: [{ operatorBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/guildId"
        - $ref: "#/components/parameters/userId"
      responses:
        "200":
          description: Export bundle

  /v1/memory/discord-people/{guildId}/{userId}/{factId}:
    patch:
      tags: [Memory, Operator]
      operationId: patchDiscordPersonMemoryFact
      summary: Edit one Discord person fact without changing its identity or provenance
      security: [{ operatorBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/guildId"
        - $ref: "#/components/parameters/userId"
        - in: path
          name: factId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            example:
              body: Prefers concise replies.
              confidence: 0.9
      responses:
        "200":
          description: Updated fact
        "404":
          description: Fact not found
    delete:
      tags: [Memory, Operator]
      operationId: deleteDiscordPersonMemoryFact
      summary: Forget one Discord person fact
      security: [{ operatorBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/guildId"
        - $ref: "#/components/parameters/userId"
        - in: path
          name: factId
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Forgotten

  /v1/memory/captain-episodes:
    get:
      tags: [Memory, Captain]
      operationId: getCaptainEpisodes
      summary: Recall memory notes for a lane
      security: [{ captainBearer: [] }]
      description: >-
        Without `query`, the bounded recent card. With one, on-demand search over
        every persistent note, filtered by what that lane may see. Both branches
        answer with a rendered card and never with note records, so no caller
        reads another memory's provenance ids.
      parameters:
        - in: query
          name: lane
          required: true
          schema:
            type: string
            enum: [operator, discord_voice, discord_presence, gameplay]
        - in: query
          name: query
          required: false
          description: Search terms; every term must appear in the note or the room it happened in.
          schema: { type: string }
        - in: query
          name: limit
          required: false
          description: Matches to return (default 8, capped at 32).
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Recall card — the recent one, or the search's when a query was given
    post:
      tags: [Memory, Captain]
      operationId: postCaptainEpisode
      summary: Record a self-authored memory note
      description: >-
        Recording only ever adds. An id the store already holds is a conflict, not
        an update; a byte-identical retry returns the original. Editing an existing
        note goes through PATCH. A Discord bearer may only write the lane it serves
        (`discord_text` writes `discord_presence`, `discord_voice` writes its own).
        The trusted authenticator must also supply an exact admitted episodeSource.
        A generic bearer alone is refused. The host stamps sourceConversationId
        and provenance; request-supplied source identifiers confer no authority.
        Notes persist until forgotten. The optional retained field is legacy
        compatibility metadata and does not control lifetime or a count quota.
      security: [{ captainBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              schemaVersion: 1
              episodeId: yaak-ep-1
              lane: operator
              targetId: self
              summary: Tried the HTTP API from Yaak.
              visibility: operator_private
              provenance:
                characterId: clankie
                sessionId: captain
                selfAuthored: true
                rawTranscript: false
              occurredAt: "2026-08-15T20:00:00.000Z"
      responses:
        "200":
          description: Recorded id
        "403":
          description: Missing exact host source binding, or lane/target does not match that source
        "409":
          description: >-
            The note id already exists with different content. Nothing was changed.

  /v1/memory/captain-episodes/{lane}/{episodeId}:
    patch:
      tags: [Memory, Operator]
      operationId: patchCaptainEpisode
      summary: Edit one memory note or its visibility
      description: >-
        Explicit operator management can edit notes across source conversations.
        The retained field remains accepted as legacy compatibility metadata;
        every note persists until forgotten regardless of its value.
      security: [{ operatorBearer: [] }]
      parameters:
        - in: path
          name: lane
          required: true
          schema:
            type: string
            enum: [operator, discord_voice, discord_presence, gameplay]
        - in: path
          name: episodeId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            example:
              summary: Corrected note about what happened.
              visibility: operator_private
      responses:
        "200":
          description: Updated note
        "404":
          description: Note not found
        "409":
          description: Legacy capacity refusal; persistent notes no longer use retention quotas
    delete:
      tags: [Memory, Operator]
      operationId: deleteCaptainEpisode
      summary: Forget one memory note
      security: [{ operatorBearer: [] }]
      parameters:
        - in: path
          name: lane
          required: true
          schema:
            type: string
            enum: [operator, discord_voice, discord_presence, gameplay]
        - in: path
          name: episodeId
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Forgotten

  /v1/minecraft:
    get:
      tags: [Operator]
      operationId: getMinecraftStatus
      summary: Read the current Minecraft body session
      description: Operator-authenticated read of the approved offline Java body. Account material and raw endpoints are excluded. x-clankie-conversation-id selects an existing owning conversation.
      security: [{ operatorBearer: [] }]
      responses:
        "200": { description: Current exact session and bounded action state }
        "403": { description: Operator authority required }
        "503": { description: Minecraft unavailable }
    post:
      tags: [Operator]
      operationId: commandMinecraft
      summary: Join, choose a driver, act, inspect, pause, cancel or leave Minecraft
      description: Joining starts the configured continuous play mind. Use driver to hand off to owner, mind or a chosen admitted worker; it quiesces prior motor work without transferring the conversation play lease. Direct act requires owner driver. Long work returns a handle. The shared play lease is retained until exact confirmed disconnect. Completion is distinct from server-verified effects.
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  {
                    type: string,
                    enum:
                      [
                        status,
                        profiles,
                        join,
                        observe,
                        act,
                        action_status,
                        pause,
                        resume,
                        cancel,
                        leave,
                        driver,
                      ],
                  }
                profileId: { type: string }
                actionId: { type: string }
                request: { type: object, description: Domain action including its type and bounded arguments }
                driver:
                  type: object
                  required: [kind]
                  properties:
                    kind: { type: string, enum: [mind, owner, worker] }
                    principalId:
                      {
                        type: string,
                        description: Required for worker; exact fleet:FLEET:pane:SEAT principal,
                      }
      responses:
        "200": { description: Session or action handle with settlement and evidence }
        "400": { description: Invalid typed command }
        "403": { description: Operator authority required }
        "409": { description: Busy play lease, stale identity or refused operation }
        "503": { description: Motor unavailable }

  /v1/minecraft/host:
    post:
      tags: [Operator]
      operationId: commandMinecraftHost
      summary: Configure, start, administer or back up Clankie's own Minecraft server
      description: Integration-owned on-demand Paper host and broker-backed playit claim. claim starts background agent preparation and returns preparing immediately; claim_status reads preparation progress and returns the official approval URL when pending and claim_complete polls once and stores an approved secret only in the broker. Tunnel claiming requires owner/admin authority. Hosting is off by default, idle-stops after at most 15 minutes, and has a maximum uptime watchdog. x-clankie-conversation-id selects an existing operator conversation. Typed administration has no op, raw RCON or secret arguments. Enrollment approval uses a previously verified Discord requester; operator arguments cannot select a Discord subject.
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  {
                    type: string,
                    enum:
                      [
                        status,
                        configuration,
                        configure,
                        start,
                        stop,
                        restart,
                        backup,
                        admin,
                        claim,
                        claim_status,
                        claim_complete,
                        request_enrollment,
                        approve_enrollment,
                      ],
                  }
                command:
                  {
                    type: object,
                    description: Strict MinecraftHostAdminCommandSchema union; operation whitelist_add/remove,
                    kick,
                    ban,
                    pardon,
                    gamerule,
                    time,
                    weather,
                    gamemode,
                    say,
                    tell or list,
                  }
                settings:
                  {
                    type: object,
                    description: Stopped-only partial MinecraftHostSettingsSchema; resource,
                    game/RCON ports,
                    backups and bounded idle/max uptime settings,
                  }
                username: { type: string, pattern: "^[A-Za-z0-9_]{3,16}$" }
      responses:
        "200":
          {
            description: Safe status,
            configuration,
            completed/refused/uncertain action or one-time claim URL; no account keys or login codes,
          }
        "400": { description: Invalid typed hosting command }
        "403": { description: Operator authority required }
        "503": { description: Hosting adapter unavailable }

  /v1/minecraft/configuration:
    get:
      tags: [Operator]
      operationId: getMinecraftConfiguration
      summary: Read owner Minecraft profiles, destination allowlist and play settings
      description: Offline host, port, version, username and explicit public destination grants. This operator configuration does not appear in model tools.
      security: [{ operatorBearer: [] }]
      responses:
        "200": { description: Offline profiles and public allowlist }
        "403": { description: Operator authority required }
    put:
      tags: [Operator]
      operationId: configureMinecraft
      summary: Replace offline Minecraft profiles, public destination grants and play settings
      description: Owner-only settings write. DNS and SRV destinations are checked again before dial; model calls cannot supply raw host or authentication arguments.
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profiles, publicAllowlist]
              properties:
                profiles: { type: array, maxItems: 32, items: { type: object } }
                publicAllowlist: { type: array, maxItems: 64, items: { type: object } }
                play:
                  type: object
                  description: Defaulted continuous play settings. Model, budgets and pacing apply at next mind run; enabled=false quiesces the current mind.
                  properties:
                    enabled: { type: boolean, default: true }
                    model: { type: string, default: openai/gpt-4.1-mini }
                    maxTokens: { type: integer, default: 100000 }
                    maxCostUsd: { type: number, default: 1 }
                    turnIntervalMs: { type: integer, default: 2000 }
                    idleBackoffMs: { type: integer, default: 15000 }
                    idleStopMs: { type: integer, default: 900000 }
      responses:
        "200": { description: Updated offline profiles and public allowlist }
        "400": { description: Invalid settings }
        "403": { description: Operator authority required }
        "503": { description: Settings unavailable }

  /v1/embodiment/intents:
    post:
      tags: [Embodiment]
      operationId: postEmbodimentIntent
      summary: Ask to start or stop play
      description: Select an existing writable captain conversation with conversationId. The operator identity is authenticated separately; originLane and requestedBy are host-stamped. A competing body lease returns a typed refusal. In-process captain tools carry their own admitted conversation identity.
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            examples:
              start:
                value:
                  kind: start
                  schemaVersion: 1
                  intentId: yaak-start-1
                  conversationId: replace-with-selected-conversation
                  originLane: operator
                  requestedBy: local-operator
                  requestedAt: "2026-08-15T20:00:00.000Z"
                  environmentId: pokemon-firered
                  budget: {}
              stop:
                value:
                  kind: stop
                  schemaVersion: 1
                  intentId: yaak-stop-1
                  conversationId: replace-with-selected-conversation
                  originLane: operator
                  requestedBy: local-operator
                  requestedAt: "2026-08-15T20:00:00.000Z"
                  sessionId: replace-me
      responses:
        "200":
          description: Accepted, refused, or stop requested. A stop request does not prove that the executor has ended.
        "409":
          description: Body lease refusal with bodyLease naming the held conversation or missing authority; queue or ask rather than taking over.

  /v1/embodiment/sessions/live:
    get:
      tags: [Embodiment]
      operationId: getLiveEmbodimentSession
      summary: Live play session
      description: Captain or operator.
      security: [{ operatorBearer: [] }, { captainBearer: [] }]
      responses:
        "200":
          description: "`{ session }` or `{ session: null }`"

  /v1/embodiment/sessions/live/stop:
    post:
      tags: [Embodiment, Operator]
      operationId: stopLiveEmbodimentSession
      summary: Operator kill-switch (ordinary stop intent)
      security: [{ operatorBearer: [] }]
      responses:
        "200":
          description: Stop submitted
        "404":
          description: Not playing

  /v1/embodiment/sessions/live/activity:
    get:
      tags: [Embodiment]
      operationId: getLiveActivity
      summary: Present-tense self-observation
      security: [{ operatorBearer: [] }, { captainBearer: [] }]
      responses:
        "200":
          description: not_playing, pending, or snapshot

  /v1/embodiment/sessions/live/still:
    get:
      tags: [Embodiment]
      operationId: getLivePlayStill
      summary: One still of the live play screen
      description: Read-only glance. PNG as base64. No controller.
      security: [{ operatorBearer: [] }, { captainBearer: [] }]
      responses:
        "200":
          description: not_playing, pending, or still

  /v1/embodiment/sessions/live/story:
    get:
      tags: [Embodiment]
      operationId: getLivePlayStory
      summary: Bounded story of this playthrough
      description: Journal projection — objective, maps, last notable moments. Not the raw log.
      security: [{ operatorBearer: [] }, { captainBearer: [] }]
      responses:
        "200":
          description: not_playing, pending, or card

  /v1/embodiment/sessions/{id}:
    get:
      tags: [Embodiment]
      operationId: getEmbodimentSession
      summary: One embodiment session
      security: [{ captainBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/sessionId"
      responses:
        "200":
          description: Session
        "404":
          description: Unknown

  /v1/conversation-heads:
    post:
      tags: [Captain]
      operationId: setConversationHead
      summary: Designate or clear an explicit escalation head
      description: Operator only. Owner must be an existing runnable or canonical room conversation; head must be a writable global/workspace conversation. Rejects self/cycles. Grants no room authority.
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [conversationId, headConversationId]
              properties:
                conversationId: { type: string }
                headConversationId:
                  type: [string, "null"]
      responses:
        "200": { description: Updated conversation projection }
        "400": { description: Invalid strict request }
        "401": { description: Operator authentication required }
        "409": { description: Owner/head unavailable or cycle }

  /v1/body-leases:
    get:
      tags: [Captain]
      operationId: getBodyLeases
      summary: Conversation ownership of Clankie's body resources
      description: Operator or active paired device observe grant. Read-only public projection; no incarnation, actor, room text or request content.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      responses:
        "200":
          description: Public body lease status
          content:
            application/json:
              example:
                leases:
                  - resource: browser
                    conversationId: conversation-1
                    state: active
                    expiresAt: 1791000000000
        "403":
          description: Observe authority required
    post:
      tags: [Captain]
      operationId: requestBodyLease
      summary: Explicitly acquire, renew, release, queue, ask or recover a body resource
      description: Computer ownership uses /v1/computer; this endpoint refuses computer mutations. Strict BodyLeaseRequest protocol union. Operator bound to a selected runnable conversation. Renew/release require the acquisition incarnation. Ordinary release is owner-only and confirms termination; explicit recover uses the current private host claim under operator authority. Queue/ask are bounded notifications and never run body effects.
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              action: queue
              resource: browser
              conversationId: conversation-1
              request: Notify me when the browser is free
              ttlMs: 300000
      responses:
        "200":
          description: Typed acquired, renewed, released, queued or asked result
        "409":
          description: Typed busy with public holder and queue/ask choices, or rejected reason; no silent takeover

  /v1/computer/authority:
    post:
      tags: [Captain]
      operationId: authorizeComputerHost
      summary: Recheck the owning conversation's computer authority
      description: >-
        Native observation hosts delegate their existing operator bearer and
        bound conversation to this service before each operation. Uses the same
        identity and grant checks as /v1/computer, even without a local adapter.
        A conversation ID is not a grant. Nothing is captured, driven or leased.
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [conversationId, action]
              properties:
                conversationId: { type: string, minLength: 1, maxLength: 256 }
                action: { type: string, enum: [effect, recover] }
      responses:
        "200": { description: Matching conversationId and authorized true }
        "400": { description: Invalid strict request }
        "401": { description: Absent or revoked operator conversation authority }
        "413": { description: Request exceeds 4 KiB }

  /v1/computer:
    post:
      tags: [Captain]
      operationId: requestComputerBody
      summary: Drive the conversation-leased computer body
      description: >-
        Strict ComputerRequestSchema (conversationId and command) from
        @clankie/interactive-environment. Operator authority bound to an existing
        runnable conversation, rechecked at each input. Actions: status, acquire,
        renew, release, revoke, recover, inventory, capture, frame, input. Capture returns
        fresh screenshot metadata and image-pixel coordinate mapping; frame returns
        bounded PNG media separately. Input is ordered and uses screenshotId plus
        a persistent requestId; identical retries reconcile, never replay. Failed
        and uncertain are distinct from confirmed. Expiry/restart/uncertainty retain
        the lease until host stop proof. Local macOS Peekaboo and an explicitly attached
        read-only Windows native-harness observation host; Windows input, native model
        and hosted display routes are not implemented.
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              conversationId: global-default
              command:
                action: status
      responses:
        "200": { description: Command result or typed busy/rejected receipt }
        "400": { description: Invalid strict request }
        "401": { description: Operator conversation authority required }
        "409":
          {
            description: Stale reference,
            changed authority or refused operation; never replay uncertain input,
          }
        "413": { description: Request exceeds 2 MiB }
        "503": { description: Computer body unavailable on this host }

  /v1/browser/harnesses:
    get:
      tags: [Browser]
      operationId: getBrowserHarnesses
      summary: Computer-use harnesses here and on linked Windows fleets
      description: >-
        Re-probes which installed harnesses (Codex computer use, Claude in
        Chrome) are signed in and configured for the owner's apps or Chrome (ADR
        0199), including Codex on linked Windows fleets. Optional platform and
        machineId identify those reports; signed-out, disabled and unavailable
        probes remain explicit. Configuration does not prove app grants or input.
        Detection only; nothing is started. `detected` is false on a hosted body.
      security: [{ operatorBearer: [] }]
      responses:
        "200":
          description: Harness list
          content:
            application/json:
              example:
                schemaVersion: 1
                detected: true
                harnesses:
                  - harness: codex
                    signedIn: true
                    surfaces: [desktop, chrome]
                    chromeNeedsHireFlag: false
                  - harness: claude
                    signedIn: true
                    surfaces: [chrome]
                    chromeNeedsHireFlag: true
        "401":
          description: Operator bearer required

  /v1/browser/tools:
    get:
      tags: [Browser]
      operationId: getBrowserTools
      summary: Live browser tool catalog
      description: Browser Use Pi tools; native JavaScript is listed only for operators.
      security: [{ operatorBearer: [] }, { captainBearer: [] }]
      responses:
        "200":
          description: Catalog
        "503":
          description: Browser host unavailable

  /v1/browser/call:
    post:
      tags: [Browser]
      operationId: postBrowserCall
      parameters:
        - in: header
          name: x-clankie-conversation-id
          required: true
          schema: { type: string }
          description: Exact selected runnable operator conversation
      summary: Call a browser tool
      description: Calls one Browser Use Pi tool under the selected operator conversation and existing machine authority. Direct captain requests without a host-admitted conversation binding are refused.
      security: [{ operatorBearer: [] }, { captainBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              schemaVersion: 1
              tool: browser_use_snapshot
              arguments: {}
      responses:
        "200":
          description: Result or typed refusal

  /v1/media/images:
    post:
      tags: [Media]
      operationId: postGenerateImage
      summary: Generate or edit an image
      description: Set personaReference true for self-depiction using only owner appearance references, never vibe images or frames. Mutually exclusive with sourceRef. OpenAI and Google support multiple references; the current Grok adapter supports one.
      security: [{ operatorBearer: [] }, { captainBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              schemaVersion: 1
              prompt: a small robot sitting at a terminal
              aspectRatio: "1:1"
      responses:
        "200":
          description: ok or refused
        "503":
          description: Media plane unconfigured

  /v1/media/videos:
    post:
      tags: [Media]
      operationId: postGenerateVideo
      summary: Start or resume a video render
      security: [{ operatorBearer: [] }, { captainBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              schemaVersion: 1
              prompt: a small robot waving
              durationSeconds: 6
      responses:
        "200":
          description: ok, pending, or refused

  /v1/pairing/offer:
    post:
      tags: [Pairing]
      operationId: postPairingOffer
      summary: Mint a one-time pairing offer
      description: The offer secret appears once in the response. Do not log it.
      security: [{ operatorBearer: [] }]
      responses:
        "200":
          description: Offer wire (deep link + code); ordinary offers also include the existing single-use localCode for same-Mac direct pairing; review offers omit localCode

  /v1/pairing/redeem:
    post:
      tags: [Pairing]
      operationId: postPairingRedeem
      summary: Redeem an offer into a pending device
      description: Unauthenticated. The offer secret or typed code is the capability.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              code: "123-456"
              device: { name: Yaak, platform: macos }
      responses:
        "200":
          description: Pending device + completion token; a configured gateway also returns the host-scoped base URL

  /v1/pairing/complete:
    post:
      tags: [Pairing]
      operationId: postPairingComplete
      summary: Activate a pending device
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              completionToken: replace-me
              acceptedGrants:
                chat: true
                steer: true
                terminalObserve: true
                terminalControl: false
      responses:
        "200":
          description: Device token issued; relayUrl is the host-scoped gateway base when configured; optional directRoute carries explicitly configured controlPlaneUrl and relayUrl origins

  /v1/captain/readiness:
    get:
      tags: [Captain, Devices]
      operationId: getCaptainReadiness
      summary: Read secret-free chat setup readiness
      description: |
        Any active paired device or owner operator may read this. A live native
        operator bridge reports ready independently of the fallback model.
        Otherwise the shared captainReadiness rule reports no_model or
        no_credential, with model and provider ids when known. No credential
        material or authentication method leaves the body. Responses are no-store.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      responses:
        "200":
          description: Ready boolean, optional model/providerId, and reason when unready
        "401":
          description: Authentication required
        "503":
          description: Readiness unavailable

  /v1/devices/self/diagnostics-default:
    get:
      tags: [Devices]
      operationId: getAccountDiagnosticsDefault
      summary: Read the account diagnostics default
      description: |
        Returns only diagnosticsDefault. A hosted body reads it through its
        signed fleet settings request; unavailable account authority returns
        503. Self-hosted bodies use the existing true default. No-store.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      responses:
        "200":
          description: Object with diagnosticsDefault boolean only
        "401":
          description: Authentication required
        "503":
          description: Account settings unavailable

  /v1/devices:
    get:
      tags: [Devices, Operator]
      operationId: listDevices
      summary: List paired devices
      description: |
        Owner operators and active paired devices may read these secret-free rows.
        Optional lastSeenAt records successful authenticated device activity,
        at most once per minute per device. `push` carries the device's last delivery state —
        `{ registrationId, sequence, enabled }` — so the listing is truthful
        about a device that turned notifications off or whose registration the
        gateway invalidated. The APNs token and delivery key are never here
        (ADR 0159).
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      responses:
        "200":
          description: Secret-free device rows

  /v1/devices/{id}/revoke:
    post:
      tags: [Devices, Operator]
      operationId: revokeDevice
      summary: Revoke a device
      description: |
        Paired callers require Take Control. Local revocation is durable before
        the hosted security and wake-key updates. A 503 does not confirm success;
        retry the same device id. Fleet tombstones defeat restored old disks.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/deviceId"
      responses:
        "200":
          description: Revoked row
        "403":
          description: Take Control required
        "404":
          description: Unknown
        "503":
          description: Hosted revocation could not be confirmed

  /v1/devices/self:
    get:
      tags: [Devices]
      operationId: getDeviceSelf
      summary: Device reads its own registration
      security: [{ deviceBearer: [] }]
      responses:
        "200":
          description: Self row, including optional directRoute with explicitly configured controlPlaneUrl and relayUrl origins

  /v1/hosted/pair-offer:
    post:
      tags: [Pairing]
      operationId: hostedPairOffer
      summary: Mint an authenticated encrypted offer for the hosted account page
      description: |
        Managed bodies only. Plain gateway exchange carrying a single-use signed
        fleet ticket, not an account bearer. Version 2 binds the browser P-256
        public-key hash and nonce into the ticket. The body signs the encrypted
        answer with its fleet-registered Ed25519 key. Replay refusal and the
        five-per-minute rate limit survive a service restart. See the hosted
        deployment README for the exact transcript and key derivation.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, pairTicket, browserPublicKey, nonce]
              properties:
                version:
                  const: 2
                pairTicket:
                  type: string
                  maxLength: 4096
                browserPublicKey:
                  type: string
                  pattern: "^[A-Za-z0-9_-]{87}$"
                nonce:
                  type: string
                  pattern: "^[A-Za-z0-9_-]{22}$"
      responses:
        "200":
          description: Signed encrypted offer, with no plaintext link
        "401":
          description: Invalid, expired, misbound, or consumed ticket
        "404":
          description: Self-hosted body
        "429":
          description: Too many offers; Retry-After is 60 seconds
        "503":
          description: Pairing publication or replay persistence unavailable

  /v1/devices/wake-key:
    post:
      tags: [Devices]
      operationId: registerDeviceWakeKey
      summary: Register a paired device wake public key on a managed body
      description: |
        Managed bodies only; self-hosted installations answer 404. The gateway
        carries this route inside the encrypted device envelope. The live device
        session selects deviceId; callers cannot select a different device.
        Registration and device revocation are serialized. Revocation disables
        local access immediately, then removes the fleet key, retrying failures.
      security: [{ deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [publicKey]
              properties:
                publicKey:
                  type: string
                  description: Uncompressed P-256 public point encoded as base64url
                  pattern: "^[A-Za-z0-9_-]{87}$"
      responses:
        "200":
          description: Registered; returns deviceId
        "400":
          description: Malformed public key request
        "401":
          description: Device session is unknown, expired, or revoked
        "404":
          description: Self-hosted body
        "503":
          description: Fleet registration unavailable; retry later

  /v1/devices/self/push:
    post:
      tags: [Devices]
      operationId: setDevicePush
      summary: Device records or clears its push delivery reference
      description: |
        Body is `{ registrationId, sequence, enabled }`. The host stores only the
        reference, its version and whether delivery is on — never the APNs token
        or the delivery key, which the app registers with the gateway directly
        (ADR 0159). Disabling records that state at its version rather than
        forgetting it, so ordering survives it.

        An older `sequence` is `409 stale_push_registration`. The same
        `sequence` is accepted only when it restates what was already recorded:
        a different `registrationId`, or the same one with `enabled` flipped, is
        `409 conflicting_push_registration`. That is also what refuses a
        re-enable at the version a gateway invalidation was recorded against.
      security: [{ deviceBearer: [] }]
      responses:
        "200":
          description: Accepted reference, echoed with its enabled state
        "400":
          description: Malformed body
        "401":
          description: Device session is unknown, expired, or revoked
        "409":
          description: Stale or conflicting registration version

  /v1/devices/self/session/refresh:
    post:
      tags: [Devices]
      operationId: refreshDeviceSession
      summary: Renew a device session token
      security: [{ deviceBearer: [] }]
      responses:
        "200":
          description: New token; relayUrl republishes the host-scoped gateway base when configured; optional directRoute carries explicitly configured controlPlaneUrl and relayUrl origins

components:
  schemas:
    FleetReleasePolicy:
      description: Owner guidance for official tags, packages and store submissions; confers no account or tool authority. A time rule is checked by the agent, not evaluated by a scheduler.
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode]
          properties:
            mode: { type: string, enum: [lead] }
        - type: object
          additionalProperties: false
          required: [mode]
          properties:
            mode: { type: string, enum: [owner] }
        - type: object
          additionalProperties: false
          required: [mode, rule]
          properties:
            mode: { type: string, enum: [time_rule] }
            rule: { type: string, minLength: 1, maxLength: 2000 }
    FleetReleasePolicyPatch:
      description: Replace the entire release preference; null restores global default or project inheritance.
      oneOf:
        - { $ref: "#/components/schemas/FleetReleasePolicy" }
        - { type: object, nullable: true, enum: [null] }
    DeployHoldOverride:
      type: object
      additionalProperties: false
      required: [holdId, actor, reason]
      properties:
        holdId: { type: string, format: uuid }
        actor:
          {
            type: string,
            minLength: 1,
            maxLength: 512,
            description: Audit label; operator bearer establishes authority,
          }
        reason: { type: string, minLength: 1, maxLength: 512 }
    DeployHold:
      type: object
      required: [id, holder, reason, createdAt, presence]
      properties:
        id: { type: string, format: uuid }
        holder: { type: string }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
        pane: { type: string }
        seat: { type: string }
        presence:
          {
            type: string,
            enum: [present, gone, unknown, person],
            description: Gone/unknown holds remain in force until explicitly released,
          }
    FleetEfficiencyRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [action, conversationId]
          properties:
            action: { const: show }
            conversationId: { type: string, minLength: 1, maxLength: 256 }
        - type: object
          additionalProperties: false
          required: [action, conversationId, seatId, evidence]
          properties:
            action: { const: review }
            conversationId: { type: string, minLength: 1, maxLength: 256 }
            seatId: { type: string, minLength: 1, maxLength: 512, description: Trimmed exact owned seat ID }
            offScope: { type: boolean }
            assignmentStatus: { type: string, enum: [active, paused, canceled, done] }
            deliverable:
              { type: string, minLength: 1, maxLength: 512, description: Trimmed inspected deliverable }
            progressAt:
              type: string
              format: date-time
              description: UTC ISO 8601 timestamp of the substantive finding or commit, not the review time
            evidence: { type: string, minLength: 1, maxLength: 2048, description: Trimmed inspected evidence }
    FleetEfficiencyResponse:
      type: object
      required: [conversationId, seats]
      properties:
        conversationId: { type: string }
        seats:
          type: array
          items:
            type: object
            description: Existing OperatorFleetSeat from @clankie/protocol; other roster metadata is retained
            required: [seatId, occupantId, personaId, harness, status, title]
            properties:
              seatId: { type: string, minLength: 1, maxLength: 512 }
              occupantId: { type: string, minLength: 1, maxLength: 512 }
              personaId: { type: string, minLength: 1, maxLength: 512 }
              harness: { type: string, minLength: 1, maxLength: 128 }
              status: { type: string, minLength: 1, maxLength: 128 }
              title: { type: string, maxLength: 256 }
              efficiency: { $ref: "#/components/schemas/OperatorSeatEfficiency" }
    OperatorSeatEfficiency:
      type: object
      additionalProperties: false
      required: [checkedAt, ownerConversationId, flags]
      description: Observed evidence for the owning lead; optional telemetry is unknown when absent
      properties:
        checkedAt: { type: string, format: date-time }
        ownerConversationId: { type: string, minLength: 1, maxLength: 256 }
        flags:
          type: array
          maxItems: 12
          items: { type: string, minLength: 1, maxLength: 128 }
        assignedDeliverable: { type: string, minLength: 1, maxLength: 16384 }
        objective: { type: string, minLength: 1, maxLength: 16384 }
        currentIssue: { type: string, minLength: 1, maxLength: 64 }
        model: { type: string, minLength: 1, maxLength: 256 }
        effort: { type: string, minLength: 1, maxLength: 64 }
        contextPercent:
          type: number
          minimum: 0
          maximum: 100
          description: Latest native Codex model-input snapshot; may age between responses, never lifetime or summed turn usage
        lastProgressAt: { type: string, format: date-time }
        lastReportAt: { type: string, format: date-time }
        reportFailures: { type: integer, minimum: 0 }
    TidyWorktreesRequest:
      type: object
      additionalProperties: false
      required: [repository]
      properties:
        repository:
          { type: string, minLength: 1, maxLength: 4096, description: Exact canonical repository root }
        mergedInto: { type: string, minLength: 1, maxLength: 512, default: origin/main }
    TidyWorktreesResponse:
      type: object
      required: [outcome, mergedInto, candidates, excluded]
      properties:
        outcome: { type: string, enum: [listed, unavailable] }
        mergedInto: { type: string }
        candidates:
          type: array
          items:
            type: object
            required: [path, sha]
            properties:
              path: { type: string }
              branch: { type: string }
              sha: { type: string }
        excluded:
          type: array
          items:
            type: object
            required: [path, reason]
            properties:
              path: { type: string }
              reason: { type: string }
    LinearWakeRules:
      type: object
      additionalProperties: false
      properties:
        ownerUserIds:
          type: array
          maxItems: 100
          default: []
          description: Explicit owner human IDs in Linear, alongside ownerUserEmails; never inferred from app credentials or display names
          items: { type: string, minLength: 1, maxLength: 256 }
        ownerUserEmails:
          type: array
          maxItems: 100
          default: [volpestyle@gmail.com]
          description: Owner human emails matched only against verified signed user actors
          items: { type: string, format: email, maxLength: 320 }
        actors:
          type: array
          maxItems: 4
          default: [owner]
          description: owner is a configured human by signed ID or email; human is any signed user except self or workers; self selects the connected account and attributed workers; users selects userIds. Own-write suppression remains in force.
          items: { enum: [owner, human, self, users] }
        userIds:
          type: array
          maxItems: 100
          default: []
          items: { type: string, minLength: 1, maxLength: 256 }
        notificationTypes:
          type: array
          maxItems: 100
          default:
            [
              issueNewComment,
              issueCommentMention,
              issueMention,
              projectUpdateNewComment,
              projectUpdateMention,
              initiativeUpdateNewComment,
              initiativeUpdateMention,
              documentNewComment,
              documentMention,
            ]
          items: { type: string, minLength: 1, maxLength: 128 }
        excludedNotificationTypes:
          type: array
          maxItems: 100
          default: [issueSubscribed]
          items: { type: string, minLength: 1, maxLength: 128 }
    ModelKeySetRequest:
      type: object
      additionalProperties: false
      required: [providerId, apiKey]
      properties:
        providerId: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,127}$" }
        apiKey:
          {
            type: string,
            minLength: 1,
            maxLength: 8192,
            writeOnly: true,
            description: "Trimmed, nonempty, no control characters",
          }
    ModelKeyValidateRequest:
      type: object
      additionalProperties: false
      required: [providerId, modelId]
      properties:
        providerId: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,127}$" }
        modelId: { type: string, minLength: 1, maxLength: 512 }
    ModelSelectRequest:
      type: object
      additionalProperties: false
      required: [model]
      properties:
        model:
          {
            type: string,
            minLength: 3,
            maxLength: 512,
            description: "provider/model reference; split on the first slash",
          }
    ModelKeyRemoveRequest:
      type: object
      additionalProperties: false
      required: [providerId]
      properties:
        providerId: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,127}$" }
    AccountConnection:
      type: object
      additionalProperties: false
      required: [provider, status, scopes]
      properties:
        provider: { type: string, enum: [github, linear] }
        status: { type: string, enum: [connected, not_connected, unconfigured] }
        account: { type: string }
        actor: { type: string, enum: [user, app] }
        workspace: { type: string }
        scopes: { type: array, items: { type: string } }
        connectedAt: { type: string, format: date-time }
        manageUrl: { type: string, format: uri }
    AccountsResponse:
      type: object
      additionalProperties: false
      required: [connections]
      properties:
        connections: { type: array, items: { $ref: "#/components/schemas/AccountConnection" } }
    AccountResult:
      type: object
      description: |
        ok true with the operation's fields (flowId, userCode, verificationUri, interval,
        status, authorizeUrl, redirectUri, expiresAt, connection, revoked, manageUrl), or
        ok false with a closed error code. See @clankie/protocol/accounts.
      required: [ok]
      properties:
        ok: { type: boolean }
        error:
          type: string
          enum:
            [
              authentication_required,
              forbidden,
              malformed,
              unconfigured,
              unknown_flow,
              expired,
              denied,
              provider_rejected,
              unavailable,
            ]
    ModelSubscriptionsResponse:
      type: object
      additionalProperties: false
      required: [subscriptions]
      properties:
        subscriptions:
          type: array
          maxItems: 64
          items:
            type: object
            additionalProperties: false
            required: [providerId, name]
            properties:
              providerId: { type: string }
              name: { type: string }
    ModelEffort:
      type: string
      enum: ["off", minimal, low, medium, high, xhigh, max]
    ModelOptionsResponse:
      type: object
      additionalProperties: false
      required: [usableProviders, effort]
      properties:
        usableProviders:
          type: array
          maxItems: 256
          items: { type: string }
        effort:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [model, current, default, levels]
              properties:
                model: { type: string }
                current:
                  oneOf:
                    - type: "null"
                    - $ref: "#/components/schemas/ModelEffort"
                default: { $ref: "#/components/schemas/ModelEffort" }
                levels:
                  type: array
                  maxItems: 7
                  items: { $ref: "#/components/schemas/ModelEffort" }
    ModelEffortSetRequest:
      type: object
      additionalProperties: false
      required: [effort]
      properties:
        effort:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ModelEffort"
    ModelKeysResponse:
      type: object
      additionalProperties: false
      required: [model, effectiveModel, providers]
      properties:
        model: { type: [string, "null"] }
        effectiveModel: { type: [string, "null"], description: Includes existing subscription precedence }
        providers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, acceptsApiKey, keyConfigured, models]
            properties:
              id: { type: string }
              name: { type: string }
              acceptsApiKey: { type: boolean }
              keyConfigured:
                {
                  type: boolean,
                  description: Only an API key stored in the broker; not OAuth or environment fallback,
                }
              models:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [id, name]
                  properties:
                    id: { type: string }
                    name: { type: string }
    ModelKeyResult:
      oneOf:
        - type: object
          additionalProperties: false
          required: [ok]
          properties:
            ok: { const: true }
        - type: object
          additionalProperties: false
          required: [ok, error]
          properties:
            ok: { const: false }
            error:
              type: string
              enum:
                [
                  authentication_required,
                  forbidden,
                  malformed,
                  unsupported_provider,
                  unsupported_model,
                  key_missing,
                  validation_failed,
                  validation_timeout,
                  unavailable,
                ]
  parameters:
    guildId:
      in: path
      name: guildId
      required: true
      schema: { type: string }
    userId:
      in: path
      name: userId
      required: true
      schema: { type: string }
    sessionId:
      in: path
      name: id
      required: true
      schema: { type: string }
    deviceId:
      in: path
      name: id
      required: true
      schema: { type: string }
  securitySchemes:
    workerBearer:
      type: http
      scheme: bearer
      description: Individual short-lived grant issued by POST /v1/worker-grants/; never an operator or provider credential
    operatorBearer:
      type: http
      scheme: bearer
      description: Keychain `clankie_operator`
    captainBearer:
      type: http
      scheme: bearer
      description: Keychain `clankie_captain` / `CLANKIE_CAPTAIN_TOKEN`
    discordTextBearer:
      type: http
      scheme: bearer
      description: Keychain `clankie_discord_bridge` or `clankie_discord_user_bridge`
    discordVoiceBearer:
      type: http
      scheme: bearer
      description: Keychain `clankie_discord_voice_bridge` or `clankie_discord_user_voice_bridge`
    deviceBearer:
      type: http
      scheme: bearer
      description: Device session token from pairing complete
