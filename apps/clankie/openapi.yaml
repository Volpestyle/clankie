  /v1/discord/voice-transcripts:
    get:
      tags: [Operator, Discord]
      operationId: getDiscordVoiceTranscripts
      summary: Page through retained Discord voice transcripts
      description: |
        Captain bearer only. Exact speech is returned only while
        `discord.voiceTranscriptLoggingEnabled` is enabled; otherwise the route
        returns an empty page with `enabled: false`. Includes legacy human
        recognition and assistant generated wording (`role: assistant`,
        `speakerId: clankie`, `itemId`, optional `playbackId`/`responseId`,
        `textSource`, `textComplete`, `audioStarted`, `playbackMs`, `outcome`).
        Outcomes are played, interrupted, suppressed, failed, or truncated.
        Generated text may include an unheard ending after a cutoff; no raw
        audio or word-aligned audible transcript is retained.
      security: [{ captainBearer: [] }]
      parameters:
        - in: query
          name: cursor
          description: Exclusive cursor from a previous page.
          schema: { type: string, pattern: "^[0-9]{12}$" }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200":
          description: Bounded transcript page
          content:
            application/json:
              example:
                schemaVersion: 1
                enabled: true
                entries:
                  - schemaVersion: 1
                    body: bot
                    occurredAt: "2026-08-18T20:05:32.899Z"
                    guildId: "123456789012345678"
                    channelId: "123456789012345679"
                    deliveryId: delivery-1
                    speakerId: "123456789012345680"
                    displayName: James
                    text: Hello Clankie
                nextCursor: "000000000001"
                hasMore: false

