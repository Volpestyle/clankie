        "401": { description: Operator authentication required }
    post:
      tags: [Operator]
      operationId: verifyWorkerLinearAccount
      summary: Verify the stored Linear account's provider user and workspace
      description: Verifies API keys via GraphQL and OAuth via Linear's official MCP identity tools. Credentials are never migrated automatically.
      security: [{ operatorBearer: [] }]
      responses:
        "200": { description: Verified account identity }
        "401": { description: Operator authentication required }
        "409": { description: Verification unavailable or failed }
  /v1/worker-mcp:
    post:
      tags: [Workers]
      operationId: workerMcpRequest
      summary: Initialize a worker MCP session or list/call its granted tools
      security: [{ workerBearer: [] }]
      description: Standard Streamable HTTP MCP. Every request validates expiry, durable revocation and account binding. MCP sessions are bound to one grant. No operator tools or channel capabilities are exposed.
      responses:
        "200": { description: MCP response }
        "202": { description: MCP notification accepted }
        "401": { description: Worker bearer required }
        "403": { description: Grant unavailable or session belongs to another grant }
        "404": { description: MCP session unavailable }
    get:
      operationId: workerMcpStream
      tags: [Workers]
      summary: MCP session stream
      security: [{ workerBearer: [] }]
      responses:
        "200": { description: MCP stream }
        "403": { description: Worker grant unavailable }
    delete:
      operationId: closeWorkerMcpSession
      tags: [Workers]
      summary: Close an authenticated worker MCP session
      security: [{ workerBearer: [] }]
      responses:
        "200": { description: Session closed }
        "403": { description: Worker grant unavailable }
  /v1/hosted/operator:
    post:
      tags: [Operator]
      operationId: hostedOperatorRequest
      summary: Dispatch as an account-paired hosted operator device
      description: Encrypted gateway carrier required remotely. Checks active device session, server-recorded operator pairing purpose and Take Control grant. No operator bearer is exported. The shared hosted-device allowlist permits chat, fleet, terminal, model, keys, persona and connections. Restart, reset and deprovision require account authority, including through the legacy device relay. The inner route keeps its own validation. Revocation is rechecked before returning a parked page.
      security: [{ deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [method, path]
              properties:
                method: { type: string, enum: [GET, POST] }
                path: { type: string, description: Inner health, operator dispatch or v1 route }
                body: { type: string, maxLength: 1048576, description: JSON request body for POST }
      responses:
        "200": { description: Inner operator route response }
        "400": { description: Invalid inner request or forbidden route }
        "401": { description: Missing, expired or revoked device session }
        "403": { description: Not an account-paired operator device }
  /v1/runtime-connections/{id}/prepare:
    post:
      tags: [Operator]
      operationId: prepareFleetHarnesses
      summary: Prepare Clankie's own harness setup on an existing machine
      description: Resolves policy from the verified service-local source workspace and checks the target's current link independently. Lead setup requires an already-linked target. Owner policy or a newly supplied source script requires the caller's ownerApproved consent claim. The service records that claim without verifying human confirmation. expectedMachineRevision pins the exact registered target shown to the caller; omission claims the alias's current target. This retains operator authority and never restarts or steers existing lanes.
      security: [{ operatorBearer: [] }]
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string },
            description: Existing runtime connection ID,
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [workingDirectory]
              properties:
                workingDirectory:
                  { type: string, description: Existing absolute source directory on the service host }
                projectId:
                  { type: string, description: Optional assertion matching verified source membership }
                ownerApproved:
                  {
                    type: boolean,
                    default: false,
                    description: Caller-reported owner consent; the service cannot verify human confirmation,
                  }
                expectedMachineRevision:
                  {
                    type: string,
                    pattern: "^[a-f0-9]{64}$",
                    description: Target revision from the context shown during consent; a mismatch refuses preparation. Omission claims the current alias target,
                  }
                codexSourceSetup:
                  {
                    type: string,
                    description: Absolute source-owned script path on the target machine; supplying a script requires ownerApproved even under lead policy. Existing source and configuration fences remain,
                  }
      responses:
        "200":
          description: Harness preparation result and the caller's consent claim
          content:
            application/json:
              schema:
                type: object
                required: [ok, prepared, ownerApproval]
                properties:
                  ok: { type: boolean, enum: [true] }
                  prepared: { type: object }
                  ownerApproval:
                    {
                      type: string,
                      enum: [claimed, not_claimed],
                      description: Caller-reported consent,
                      never verified human approval,
                    }
        "400": { description: Malformed request }
        "401": { description: Operator authentication required }
        "403": { description: Owner approval or existing linked target required }
        "409": { description: Preparation or context verification failed }
  /v1/operator/fleet-settings:
    get:
      tags: [Operator]
      operationId: getFleetSettings
      summary: Read fleet size, model mode and owner working preferences
      description: Closure, machineSetup, commit and push default to lead; official releases default to owner, verification to change_run_read, reporting to Short and plain. workingPreferences=true advertises the five new controls; old responses may omit them. Existing owner or Take Control device authority is required; preferences confer no credentials or new access.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      responses:
        "200":
          description: Current fleet settings and SHA-256 revision
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [schemaVersion, revision, fleet]
                properties:
                  schemaVersion: { type: integer, enum: [1] }
                  workingPreferences: { type: boolean, enum: [true] }
                  fleetGates: { type: boolean, enum: [true] }
                  revision: { type: string, pattern: "^[a-f0-9]{64}$" }
                  fleet:
                    type: object
                    additionalProperties: false
                    required: [size, models, closure, machineSetup]
                    properties:
                      size: { type: string, enum: [max, large, small, solo] }
                      models: { type: string, enum: [optimal, efficient] }
                      resources: { type: object, description: FleetResourcePolicySchema }
                      notes: { type: string, maxLength: 4000 }
                      tools: { type: string, enum: [connected, off] }
                      peerMessages: { type: string, enum: [on, off] }
                      hire: { type: object, description: Full HireProfileSchema; null clears on write }
                      everydayWork: { type: string, enum: [allow, lead, owner] }
                      leavesMac: { type: string, enum: [allow, lead, owner] }
                      hardToUndo: { type: string, enum: [allow, lead, owner] }
                      moneyAndAccounts: { type: string, enum: [owner] }
                      closure: { type: string, enum: [lead, owner] }
                      machineSetup: { type: string, enum: [lead, owner] }
                      commit: { type: string, enum: [lead, owner] }
                      push: { type: string, enum: [lead, owner] }
                      release: { $ref: "#/components/schemas/FleetReleasePolicy" }
                      verification: { type: string, enum: [review_and_seal, change_run_read] }
                      reportingStyle: { type: string, minLength: 1, maxLength: 2000 }
        "401": { description: Owner authentication required }
        "403": { description: Caller lacks owner authority }
    post:
      tags: [Operator]
      operationId: updateFleetSettings
      summary: Update fleet budget and working preferences with revision fencing
      description: Omitted leaves retain their value. A null autonomy leaf restores its global default. Release mode and rule are replaced together.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schemaVersion, expectedRevision, changes]
              properties:
                schemaVersion: { type: integer, enum: [1] }
                expectedRevision: { type: string, pattern: "^[a-f0-9]{64}$" }
                changes:
                  type: object
                  additionalProperties: false
                  minProperties: 1
                  properties:
                    size: { type: string, enum: [max, large, small, solo] }
                    models: { type: string, enum: [optimal, efficient] }
                    resources: { type: object, description: FleetResourcePolicySchema }
                    notes: { type: string, maxLength: 4000 }
                    tools: { type: string, enum: [connected, off] }
                    peerMessages: { type: string, enum: [on, off] }
                    hire: { type: object, description: Full HireProfileSchema; null clears on write }
                    everydayWork: { type: string, enum: [allow, lead, owner] }
                    leavesMac: { type: string, enum: [allow, lead, owner] }
                    hardToUndo: { type: string, enum: [allow, lead, owner] }
                    moneyAndAccounts: { type: string, enum: [owner] }
                    closure: { type: string, enum: [lead, owner, null], nullable: true }
                    machineSetup: { type: string, enum: [lead, owner, null], nullable: true }
                    commit: { type: string, enum: [lead, owner, null], nullable: true }
                    push: { type: string, enum: [lead, owner, null], nullable: true }
                    release: { $ref: "#/components/schemas/FleetReleasePolicyPatch" }
                    verification:
                      { type: string, enum: [review_and_seal, change_run_read, null], nullable: true }
                    reportingStyle: { type: string, minLength: 1, maxLength: 2000, nullable: true }
      responses:
        "200": { description: Updated fleet snapshot and revision }
        "400": { description: Malformed request }
        "401": { description: Owner authentication required }
        "403": { description: Caller lacks owner authority }
        "409": { description: Settings or owner authority changed before commit }
  /v1/operator/fleet-settings/hire:
    get:
      tags: [Operator]
      operationId: getFleetHireDefaults
      summary: Read the fleet's hire defaults (harness, model, effort)
      description: An omitted field is "no preference"; Clankie chooses per hire. The SHA-256 revision covers the whole stored hire profile, so an account, subagent, delegation or placement change also fences writes. Owner or Take Control device authority (FleetHireDefaultsSnapshotSchema).
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      responses:
        "200": { description: "schemaVersion=1, revision and hire {harness?, model?, effort?}" }
        "401": { description: Authentication required }
        "403": { description: Owner authority required }
    post:
      tags: [Operator]
      operationId: updateFleetHireDefaults
      summary: Set or clear fleet hire defaults
      description: Accepts schemaVersion=1, expectedRevision and changes {harness?, model?, effort?}. The value `auto` clears a field (no preference, never stored); omitted fields and the rest of the hire profile are kept (UpdateFleetHireDefaultsSchema).
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: Updated hire defaults snapshot }
        "400": { description: Malformed change }
        "401": { description: Authentication required }
        "403": { description: Owner authority required }
        "409": { description: Stale revision or authority changed during the write }
  /v1/worker-accounts:
    get:
      tags: [Operator]
      operationId: getWorkerAccounts
      summary: Read one machine's worker accounts and verified Pi profile
      description: Sign-in, identity, plan, Codex usage headroom, verified Pi model references, holds and whether Clankie would hire on each account now (MachineWorkerAccountsSchema). Omit fleet for this machine; fleet names a runtime connection, the only query accepted. Owner or Take Control device authority.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      parameters:
        - {
            name: fleet,
            in: query,
            required: false,
            schema: { type: string, pattern: "^[a-z][a-z0-9-]{0,63}$" },
          }
      responses:
        "200": { description: The machine's accounts }
        "400": { description: Invalid fleet }
        "401": { description: Authentication required }
        "409": { description: The machine could not be read }
        "503": { description: Worker accounts unavailable }
  /v1/worker-accounts/holds:
    get:
      tags: [Operator]
      operationId: getWorkerAccountHolds
      summary: Read held worker accounts and current revision
      description: Holding prevents automatic selection; naming the account explicitly still permits a hire. Hold and release update one account and return all current holds.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      responses:
        "200":
          description: Current snapshot and SHA-256 revision; Cache-Control no-store
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerAccountHoldsSnapshot" }
        "401": { description: Authentication required }
        "403": { description: Current owner or Take Control authority required }
        "503": { description: Settings unavailable }
    post:
      tags: [Operator]
      operationId: updateWorkerAccountHolds
      summary: Save validated settings with revision fencing
      description: The expectedRevision from GET is required. Validation and current owner authority are checked before persistence. No automatic conflict retry.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkerAccountHoldUpdate" }
      responses:
        "200":
          description: Saved snapshot and revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerAccountHoldsSnapshot" }
        "400": { description: Invalid or unfenced settings update }
        "401": { description: Authentication required }
        "403": { description: Owner authority required }
        "409": { description: Stale revision, changed owner authority or unsupported preference }
        "503": { description: Settings unavailable }
  /v1/operator/fleet-settings/context:
    get:
      tags: [Operator]
      operationId: getFleetSettingsContext
      summary: Resolve current project policy and already-linked setup target
      description: Verifies a local source directory and Git worktree separately from the registered target machine. Returns a nonsecret targetRevision hashing the resolved execution descriptor, including transport and session, so consent can be pinned across requests. Machine aliases hash their registration set rather than selecting an arbitrary runtime. Invalid or ambiguous project evidence fails closed. This filesystem route is excluded from hosted-device forwarding.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      parameters:
        - {
            name: workingDirectory,
            in: query,
            required: true,
            schema: { type: string },
            description: Existing absolute source directory on the service host,
          }
        - {
            name: machine,
            in: query,
            required: true,
            schema: { type: string },
            description: Existing runtime or machine ID,
          }
        - {
            name: projectId,
            in: query,
            schema: { type: string },
            description: Optional project assertion; must match verified directory membership,
          }
      responses:
        "200":
          description: Effective policy, matched project and current target observation
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, effective, machine]
                properties:
                  schemaVersion: { type: integer, enum: [1] }
                  workingPreferences: { type: boolean, enum: [true] }
                  effective:
                    type: object
                    required: [closure, machineSetup]
                    properties:
                      closure: { type: string, enum: [lead, owner] }
                      machineSetup: { type: string, enum: [lead, owner] }
                      commit: { type: string, enum: [lead, owner] }
                      push: { type: string, enum: [lead, owner] }
                      release: { $ref: "#/components/schemas/FleetReleasePolicy" }
                      verification: { type: string, enum: [review_and_seal, change_run_read] }
                      reportingStyle: { type: string, minLength: 1, maxLength: 2000 }
                  projectId: { type: string }
                  machine:
                    type: object
                    required: [id, linked, targetRevision]
                    properties:
                      id: { type: string }
                      linked: { type: boolean }
                      targetRevision: { type: string, pattern: "^[a-f0-9]{64}$" }
        "400": { description: Malformed query }
        "401": { description: Owner authentication required }
        "403": { description: Caller lacks owner authority }
        "409": { description: Context could not be verified or settings changed }
  /v1/operator/projects/update:
    post:
      tags: [Operator]
      operationId: updateProjectSettings
      summary: Update project policy while preserving independent inheritance
      description: Each autonomy.fleet leaf overrides its global default independently; null clears only that override and omission retains it. Release mode and rule are one atomic leaf. Responses omit autonomy fields unless includeAutonomy=true; workingPreferences=true then advertises support for the new controls. The expectedRevision fences full project settings even for legacy projections.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      parameters:
        - {
            name: includeAutonomy,
            in: query,
            schema: { type: string, enum: ["true"] },
            description: Opt into project autonomy overrides and global autonomyDefaults,
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [projectId, expectedRevision, changes]
              properties:
                projectId: { type: string }
                expectedRevision: { type: string, pattern: "^[a-f0-9]{64}$" }
                changes:
                  type: object
                  description: Validated project fields, including independent autonomy.fleet overrides
                  properties:
                    autonomy:
                      type: object
                      additionalProperties: false
                      required: [fleet]
                      properties:
                        fleet:
                          type: object
                          additionalProperties: false
                          minProperties: 1
                          properties:
                            closure: { type: string, enum: [lead, owner, null], nullable: true }
                            machineSetup: { type: string, enum: [lead, owner, null], nullable: true }
                            commit: { type: string, enum: [lead, owner, null], nullable: true }
                            push: { type: string, enum: [lead, owner, null], nullable: true }
                            release: { $ref: "#/components/schemas/FleetReleasePolicyPatch" }
                            verification:
                              { type: string, enum: [review_and_seal, change_run_read, null], nullable: true }
                            reportingStyle: { type: string, minLength: 1, maxLength: 2000, nullable: true }
      responses:
        "200": { description: Updated project snapshot and revision }
        "400": { description: Malformed request }
        "401": { description: Owner authentication required }
        "403": { description: Caller lacks owner authority }
        "409": { description: Project settings or owner authority changed }
  /v1/operator/projects:
    get:
      tags: [Operator]
      operationId: getOperatorProjects
      summary: Read owner project settings and their current revision
      description: Legacy responses omit autonomy fields. includeAutonomy=true adds optional project autonomy.fleet overrides, global autonomyDefaults and workingPreferences=true without changing the full settings revision. New working-preference leaves stay absent on an older service.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      parameters:
        - {
            name: includeAutonomy,
            in: query,
            schema: { type: string, enum: ["true"] },
            description: Opt into project autonomy overrides and global autonomyDefaults,
          }
      responses:
        "200": { description: Project settings and SHA-256 revision }
        "401": { description: Owner authentication required }
        "403": { description: Caller is not the owner }
  /v1/operator/projects/create:
    post:
      tags: [Operator]
      operationId: createProjectSettings
      summary: Create a reviewed project with one canonical local workspace
      description: >-
        Owner only. Strict fields are projectId, name, workspacePath, expectedRevision,
        roles, workerCap, trackerRef, trackerSetup and fleet. The service supplies primary/local
        workspace identity and its platform. Nullable caps inherit; zero is preserved.
        Fleet preferences are not numeric caps. Optional trackerRef must name primary
        and .clankie/tracking.json, an existing valid canonical convention unless
        trackerSetup supplies reviewed work-init inputs for a missing convention.
        Tracker save precedes settings save; a partial failure can leave only the
        convention. No automatic retry, account choice, provider project/label
        creation, remote enrollment, assignments, hires or grants. Rechecks
        canonical directory/tracker identity, settings revision and owner authority
        before the existing SettingsStore rename. These asynchronous observations
        are not cross-process compare-and-swap or atomic authority/filesystem checks.
        This documents the source contract, not an installed CLI or running-service update.
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [projectId, name, workspacePath, expectedRevision]
              properties:
                projectId: { type: string, pattern: "^[a-z][a-z0-9_-]{0,63}$" }
                name: { type: string, minLength: 1, maxLength: 100 }
                workspacePath: { type: string, minLength: 1, maxLength: 4096 }
                expectedRevision: { type: string, pattern: "^[a-f0-9]{64}$" }
                roles:
                  type: array
                  maxItems: 256
                  items:
                    type: object
                    additionalProperties: false
                    required: [role]
                    properties:
                      role: { type: string, minLength: 1, maxLength: 24 }
                      harness:
                        {
                          type: string,
                          enum:
                            [
                              claude,
                              codex,
                              pi,
                              gemini,
                              grok,
                              opencode,
                              copilot,
                              amp,
                              cursor,
                              devin,
                              agy,
                              cline,
                              omp,
                              mastracode,
                              kimi,
                              kiro,
                              droid,
                              hermes,
                              kilo,
                              qodercli,
                              qwen,
                              maki,
                            ],
                        }
                      model: { type: string, minLength: 1, maxLength: 200 }
                      effort: { type: string, enum: [minimal, low, medium, high, xhigh, max, ultra] }
                      subagents:
                        type: [object, "null"]
                        additionalProperties: false
                        properties:
                          model: { type: string, minLength: 1, maxLength: 200 }
                          effort: { type: string, enum: [minimal, low, medium, high, xhigh, max, ultra] }
                      delegation: { type: string, enum: [native-first, panes] }
                      account: { type: string, pattern: "^[a-z][a-z0-9_-]{0,63}$" }
                      placement: { type: string, enum: [new-tab, split] }
                      concurrencyCap: { type: [integer, "null"], minimum: 0, maximum: 1000 }
                      hireNaming: { type: string, minLength: 1, maxLength: 500 }
                workerCap: { type: [integer, "null"], minimum: 0, maximum: 1000 }
                trackerRef:
                  type: [object, "null"]
                  additionalProperties: false
                  required: [workspaceId, path]
                  properties:
                    workspaceId: { type: string, enum: [primary] }
                    path: { type: string, enum: [.clankie/tracking.json] }
                trackerSetup:
                  type: object
                  additionalProperties: false
                  required: [backend]
                  description: Existing work-init inputs for a missing convention; requires trackerRef
                  properties:
                    backend: { type: string, enum: [default, markdown, github, linear] }
                    directory: { type: string, minLength: 1, maxLength: 256 }
                    githubRepo: { type: string, minLength: 1, maxLength: 200 }
                    linearTeam: { type: string, minLength: 1, maxLength: 64 }
                    linearProject: { type: string, minLength: 1, maxLength: 200 }
                    linearLabel: { type: string, minLength: 1, maxLength: 64 }
                    decisions: { type: string, minLength: 1, maxLength: 256 }
                    note: { type: string, maxLength: 1000 }
                fleet:
                  type: [object, "null"]
                  additionalProperties: false
                  properties:
                    size: { type: string, enum: [max, large, small, solo] }
                    models: { type: string, enum: [optimal, efficient] }
      responses:
        "201": { description: Saved project settings and current revision }
        "400": { description: Malformed or unsupported creation fields }
        "401": { description: Owner authentication required }
        "403": { description: Caller is not the owner }
        "409": { description: project_create_conflict or project_tracker_unavailable; no automatic retry }
        "413": { description: Request exceeds 16 KiB }
        "503": { description: Settings writes unavailable }
  /v1/operator/projects/remove-workspace:
    post:
      tags: [Operator]
      operationId: removeProjectWorkspace
      summary: Remove one exact owner-approved workspace registration
      description: Preserves roles, grants and assignments. Refuses tracker-bound workspaces, stale revisions, changed owner authority and concurrent settings changes. Does not delete a directory.
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [projectId, workspaceId, expectedRevision]
              properties:
                projectId: { type: string }
                workspaceId: { type: string }
                expectedRevision: { type: string, pattern: "^[a-f0-9]{64}$" }
      responses:
        "200": { description: Updated project settings and revision }
        "400": { description: Malformed request }
        "401": { description: Owner authentication required }
        "403": { description: Caller is not the owner }
        "409": { description: Removal conflicts with current settings or authority }
  /v1/fleet/worker-tool-restart:
    post:
      tags: [Operator]
      operationId: restartLocalWorkerTools
      summary: Check admission for explicit same-thread worker restart
      description: Explicit operator action. Requires saved results, settled report receipts, known ownership, no draft and a verified native exit controller. Rechecks the original occupant before exit and journals close/resume. Unknown exit or resume receipts remain held; inspect tidy history before retrying. Current local Codex lacks verified native exit and refuses before any close intent; successful automatic restart remains unsupported. Remote workers and Claude are unsupported.
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [paneId]
              properties:
                paneId: { type: string, minLength: 1, maxLength: 256, pattern: '^w[\w]+:p[\w]+$' }
                reportPath: { type: string, minLength: 1, maxLength: 4096 }
      responses:
        "200":
          description: Restarted, refused or failed; a failed original may remain held in tidy history
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [outcome]
                properties:
                  outcome: { type: string, enum: [restarted, refused, failed] }
                  reason: { type: string, maxLength: 1024 }
                  threadId: { type: string, minLength: 1, maxLength: 256 }
                  historyId: { type: string, format: uuid }
                  resumedSeatId: { type: string, minLength: 1, maxLength: 256 }
        "400": { description: Malformed request }
        "403": { description: Operator authority required or revoked }
        "413": { description: Request exceeds 8 KiB }
        "503":
          { description: Restart unavailable or reply failed; inspect the original operation before retrying }
  /v1/harness-refresh:
    post:
      tags: [Operator]
      operationId: refreshLinkedHarnessPlugins
      summary: Refresh existing native worker plugin links locally and on enabled fleet machines
      description: Uses the native harness installer without enrolling new profiles, changing channel policy or restarting panes. The canonical source workspace selects current machineSetup policy; owner mode requires the caller's ownerApproved consent claim, and automatic lead refresh requires an already-linked target. The service records the claim without verifying human confirmation. Current operator authority, source context and each captured fleet destination are revalidated before refresh. Returns per-profile and per-fleet outcomes; ok is false for incomplete installation, missing source setup or unreachable machines.
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [workingDirectory]
              properties:
                workingDirectory:
                  {
                    type: string,
                    description: Existing absolute source directory,
                    resolved canonically on the service machine,
                  }
                projectId:
                  {
                    type: string,
                    description: Must match the project derived from the current source workspace or registered worktree,
                  }
                ownerApproved:
                  {
                    type: boolean,
                    default: false,
                    description: Caller-reported owner consent; the service cannot verify human confirmation and this confers no additional credential or lane authority,
                  }
      responses:
        "200":
          description: Plugin refresh receipts, including incomplete outcomes
          content:
            application/json:
              schema:
                type: object
                required: [ok, local, fleets, notices, ownerApproval]
                properties:
                  ok: { type: boolean }
                  local: { type: array, items: { type: object } }
                  fleets: { type: array, items: { type: object } }
                  notices: { type: object }
                  ownerApproval:
                    {
                      type: string,
                      enum: [claimed, not_claimed],
                      description: Caller-reported consent,
                      never verified human approval,
                    }
        "400": { description: Invalid refresh context request }
        "403":
          {
            description: Operator required or revoked,
            owner approval required,
            or automatic target is not already linked,
          }
        "409": { description: Source context, settings or captured target changed or could not be verified }
        "503": { description: Harness refresh or policy context unavailable }
  /v1/harness-plugin-version:
    post:
      tags: [Operator]
      operationId: announceInstalledWorkerPluginVersion
      summary: Tell a running service which worker version the installer shipped
      description: Updates display-only restart flags at the next admitted native client request. Client version reports confer no tool authority, and nothing is restarted.
      security: [{ operatorBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version]
              properties:
                version: { type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+$' }
      responses:
        "200": { description: Announcement accepted for the next native client request }
        "400": { description: Invalid plugin version }
        "403": { description: Operator required or revoked }
        "503": { description: Plugin notices unavailable }
  /v1/runtime-connections/{id}/harnesses:
    get:
      tags: [Operator]
      operationId: inspectFleetHarnesses
      summary: Inspect native harness registration on one registered remote fleet
      description: Reports profile activation, service versus installed version, bridge, hooks and skill presence. Static registration never establishes live process membership or receiver proof.
      security: [{ operatorBearer: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Per-machine and per-profile harness diagnostics }
        "401": { description: Owner authentication required }
        "403": { description: Caller is not the owner }
        "503": { description: Fleet unavailable or inspector not yet prepared }
  /v1/runtime-connections/{id}/membership:
    get:
      tags: [Operator]
      operationId: inspectFleetMembership
      summary: Inspect host-observed project eligibility on one registered remote fleet
      description: Reports bounded per-pane process, native session, hire and actual cwd observations. Host eligibility does not verify a bridge socket, native tool catalog or delivery. Rechecks the configured fleet, settings, hire, native observations and caller authority before returning.
      security: [{ operatorBearer: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Per-pane host observations with native tools explicitly unverified }
        "401": { description: Current owner authentication required }
        "403": { description: Caller lacks owner control }
        "503": { description: Fleet or native observations unavailable }
  /v1/operator/persona:
    get:
      tags: [Operator]
      operationId: getOperatorPersona
      summary: Read owner-authored character and talkativeness
      description: Full operators receive persona and image diagnostics. A Take Control device projection may read and change only chattiness and replyPolicy; its revision still fences the full persona. Images are service-host paths and changes require restart to apply.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      responses:
        "200":
          description: Current snapshot and SHA-256 revision; Cache-Control no-store
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerPersonaSnapshot" }
        "401": { description: Authentication required }
        "403": { description: Current owner or Take Control authority required }
        "503": { description: Settings unavailable }
    post:
      tags: [Operator]
      operationId: updateOperatorPersona
      summary: Save validated settings with revision fencing
      description: The expectedRevision from GET is required. Validation and current owner authority are checked before persistence. No automatic conflict retry.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OwnerPersonaUpdate" }
      responses:
        "200":
          description: Saved snapshot and revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerPersonaSnapshot" }
        "400": { description: Invalid or unfenced settings update }
        "401": { description: Authentication required }
        "403": { description: Owner authority required }
        "409": { description: Stale revision, changed owner authority or unsupported preference }
        "503": { description: Settings unavailable }
  /v1/operator/host-settings:
    get:
      tags: [Operator]
      operationId: getHostSettings
      summary: Read keep-awake and automatic update preferences
      description: Shared labels are HOST_SETTINGS_WORDING in protocol. keepAwakeSupported is false on hosted or non-Mac hosts. Managed hosting keeps autoUpdate enabled; it cannot be disabled. A saved preference does not grant deployment or restart authority.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      responses:
        "200":
          description: Current snapshot and SHA-256 revision; Cache-Control no-store
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostSettingsSnapshot" }
        "401": { description: Authentication required }
        "403": { description: Current owner or Take Control authority required }
        "503": { description: Settings unavailable }
    post:
      tags: [Operator]
      operationId: updateHostSettings
      summary: Save validated settings with revision fencing
      description: The expectedRevision from GET is required. Validation and current owner authority are checked before persistence. No automatic conflict retry.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostSettingsUpdate" }
      responses:
        "200":
          description: Saved snapshot and revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostSettingsSnapshot" }
        "400": { description: Invalid or unfenced settings update }
        "401": { description: Authentication required }
        "403": { description: Owner authority required }
        "409": { description: Stale revision, changed owner authority or unsupported preference }
        "503":
          {
            description: Settings unavailable or runtime application failed after save; saved=true and settings carries the persisted snapshot,
          }
  /v1/operator/runtime-health:
    get:
      tags: [Operator]
      operationId: getRuntimeHealth
      summary: Read runtime CPU and health alarm settings and metadata
      description: |
        Owner or Take Control device authority. Returns schemaVersion=1, a SHA-256
        settings revision, settings, and the fixed RuntimeHealthObservation from
        packages/protocol/src/runtime-health.ts. Process CPU is wall-time-normalized
        process.cpuUsage; 100% is one fully busy core. No conversation content.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      responses:
        "200": { description: Current settings revision and live observation }
        "401": { description: Authentication required }
        "403": { description: Owner authority required }
    post:
      tags: [Operator]
      operationId: updateRuntimeHealth
      summary: Change runtime health alarm thresholds without restarting
      description: |
        Accepts schemaVersion=1, expectedRevision and a strict partial changes
        object. Defaults are enabled=true, cpuPercent=50, healthLatencyMs=1000,
        sustainedMs=300000, sampleIntervalMs=15000 and cooldownMs=1800000.
        Settings apply on the next sample. Native global-default delivery emits
        one alarm and one recovery with incident duration; it creates no service
        model turn. The schema and bounded ranges live in @clankie/protocol.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            example:
              schemaVersion: 1
              expectedRevision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
              changes: { cpuPercent: 50, healthLatencyMs: 1000, sustainedMs: 300000 }
      responses:
        "200": { description: Saved revision and live observation }
        "400": { description: Malformed or out-of-range settings }
        "401": { description: Authentication required }
        "403": { description: Owner authority required }
        "409": { description: Settings revision or owner authority changed }
        "503": { description: Settings unavailable }

  /v1/operator/voice:
    get:
      tags: [Operator]
      operationId: getOperatorVoice
      summary: Read stored and effective voice settings
      description: Provider, model and public voice identifiers only; credentials remain in the broker. Device forwarding requires Take Control. Changes need the active Discord body restart to apply and do not contact providers or restart bodies.
      security: [{ operatorBearer: [] }, { deviceBearer: [] }]
      responses:
        "200":
          description: Current snapshot and SHA-256 revision; Cache-Control no-store
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerVoiceSnapshot" }
        "401": { description: Authentication required }
        "403": { description: Current owner or Take Control authority required }
        "503": { description: Settings unavailable }
    post:
      tags: [Operator]
      operationId: updateOperatorVoice
      summary: Save validated settings with revision fencing
