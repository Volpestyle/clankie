<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>Clankie plays</title>
    <style>
      :root {
        --page: #232a2e;
        --stage: #101416;
        --panel: #111619;
        --edge: #354047;
        --text: #edf1f2;
        --muted: #8799a1;
        --accent: #e2ad47;
        --live: #75cf84;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--page);
        color: var(--text);
        font:
          13px/1.45 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      #app {
        display: grid;
        grid-template-rows: minmax(0, 1fr) minmax(238px, 29dvh);
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right))
          max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
      }
      #stage {
        position: relative;
        display: grid;
        place-items: center;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        background: var(--stage);
        border: 1px solid var(--edge);
        border-bottom: 0;
        border-radius: 5px 5px 0 0;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        width: auto;
        height: 100%;
        max-width: 100%;
        aspect-ratio: 3 / 2;
        object-fit: contain;
        background: #000;
      }
      #empty {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 6px;
        padding: 24px;
        text-align: center;
        background: var(--stage);
      }
      #empty strong {
        font-size: clamp(16px, 1.5vw, 19px);
        font-weight: 600;
      }
      #empty span {
        color: var(--muted);
        font-size: 12px;
      }
      #sound-controls {
        position: absolute;
        right: 14px;
        bottom: 14px;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #volume {
        width: 90px;
        accent-color: var(--live);
        cursor: pointer;
      }
      #volume:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
      }
      #sound-toggle {
        padding: 8px 10px;
        border: 1px solid var(--text);
        border-radius: 3px;
        color: var(--text);
        background: var(--panel);
        font: inherit;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        cursor: pointer;
      }
      #sound-toggle[aria-pressed="true"] {
        border-color: var(--live);
        color: var(--live);
      }
      #sound-toggle:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
      }
      #lower-third {
        display: grid;
        grid-template-columns: minmax(230px, 25%) minmax(0, 1fr);
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 0 0 5px 5px;
      }
      #objective-block,
      #thought-block {
        display: flex;
        flex-direction: column;
        min-width: 0;
        padding: clamp(18px, 2.2vw, 30px);
      }
      #objective-block {
        border-right: 1px solid var(--edge);
      }
      .label {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      #thought-label {
        color: var(--accent);
      }
      #thought-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 10px;
      }
      #thought-heading .label {
        margin: 0;
      }
      #work-status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        color: var(--muted);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      #work-status[data-phase="thinking"] {
        color: var(--accent);
      }
      #work-status[data-phase="acting"],
      #work-status[data-phase="live"] {
        color: var(--live);
      }
      #work-label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #work-dots {
        display: inline-flex;
        gap: 3px;
        flex: 0 0 auto;
      }
      #work-dots i {
        width: 4px;
        height: 4px;
        background: currentColor;
        opacity: 0.35;
      }
      #work-status[data-phase="thinking"] #work-dots i,
      #work-status[data-phase="acting"] #work-dots i,
      #work-status[data-phase="waiting"] #work-dots i {
        animation: work-pulse 1.2s steps(2, end) infinite;
      }
      #work-dots i:nth-child(2) {
        animation-delay: 0.2s;
      }
      #work-dots i:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes work-pulse {
        50% {
          opacity: 1;
          transform: translateY(-2px);
        }
      }
      #objective,
      #thought,
      .detail-value {
        margin: 0;
        overflow-wrap: anywhere;
      }
      #objective {
        max-width: 28ch;
        font-size: clamp(16px, 1.35vw, 20px);
        line-height: 1.2;
        text-transform: uppercase;
      }
      #thought {
        max-width: 70ch;
        font-size: clamp(16px, 1.55vw, 21px);
        line-height: 1.36;
      }
      .placeholder {
        color: var(--muted);
      }
      #status {
        margin-top: auto;
        padding-top: 18px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      #status[data-tone="live"] {
        color: var(--live);
      }
      #turn-details {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 24px;
        margin-top: auto;
        padding-top: 16px;
        border-top: 1px solid var(--edge);
      }
      .detail {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 10px;
        min-width: 0;
      }
      .detail-label {
        color: var(--muted);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .detail-value {
        color: #c8d0d3;
        font-size: 11px;
      }
      @media (max-width: 720px) {
        #app {
          grid-template-rows: auto minmax(0, 1fr);
          padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right))
            max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
        }
        #stage {
          aspect-ratio: 3 / 2;
        }
        canvas {
          width: 100%;
          height: auto;
        }
        #lower-third {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: auto minmax(0, 1fr);
          overflow-y: auto;
          overscroll-behavior: contain;
        }
        #objective-block,
        #thought-block {
          padding: 16px;
        }
        #objective-block {
          border-right: 0;
          border-bottom: 1px solid var(--edge);
        }
        #objective {
          font-size: 16px;
        }
        #status {
          margin-top: 12px;
          padding-top: 0;
        }
        #thought {
          font-size: 16px;
        }
        #thought-heading {
          align-items: flex-start;
          flex-direction: column;
          gap: 8px;
        }
        #turn-details {
          grid-template-columns: minmax(0, 1fr);
          gap: 10px;
          margin-top: 18px;
        }
        .detail {
          grid-template-columns: 72px minmax(0, 1fr);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #work-dots i {
          animation: none !important;
          transform: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main id="app">
      <section id="stage" aria-label="What Clankie sees">
        <canvas
          id="screen"
          width="240"
          height="160"
          role="img"
          aria-label="Clankie's live game view"
        ></canvas>
        <div id="empty">
          <strong id="empty-title">Waiting for Clankie</strong>
          <span id="empty-copy">Gameplay appears here when a session starts.</span>
        </div>
        <div id="sound-controls">
          <input id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume" />
          <button id="sound-toggle" type="button" aria-pressed="false">Enable sound</button>
        </div>
      </section>
      <section id="lower-third" aria-label="What Clankie is thinking">
        <div id="objective-block">
          <p class="label">Objective</p>
          <p id="objective" class="placeholder">No standing goal yet</p>
          <div id="status" role="status" aria-live="polite">Connecting</div>
        </div>
        <div id="thought-block">
          <div id="thought-heading">
            <p id="thought-label" class="label">Thought</p>
            <div id="work-status" data-phase="waiting" role="status" aria-live="polite" aria-atomic="true">
              <span id="work-dots" aria-hidden="true"><i></i><i></i><i></i></span>
              <span id="work-label">Waiting for session</span>
            </div>
          </div>
          <p id="thought" class="placeholder" aria-live="polite">Waiting for the next decision.</p>
          <div id="turn-details">
            <div class="detail">
              <span class="detail-label">Next</span>
              <span id="intent" class="detail-value placeholder">No next move yet</span>
            </div>
            <div class="detail">
              <span class="detail-label">Observed</span>
              <span id="effect" class="detail-value placeholder">Waiting for a result</span>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script type="module">
      const canvas = document.getElementById("screen");
      const context = canvas.getContext("2d");
      const status = document.getElementById("status");
      const empty = document.getElementById("empty");
      const emptyTitle = document.getElementById("empty-title");
      const emptyCopy = document.getElementById("empty-copy");
      const objective = document.getElementById("objective");
      const thought = document.getElementById("thought");
      const intent = document.getElementById("intent");
      const effect = document.getElementById("effect");
      const soundToggle = document.getElementById("sound-toggle");
      const volume = document.getElementById("volume");
      const workStatus = document.getElementById("work-status");
      const workLabel = document.getElementById("work-label");
      context.imageSmoothingEnabled = false;

      let lastFrameSequence = -1;
      let lastOverlaySequence = -1;
      let lastAudioSequence = -1;
      let sessionEnded = false;
      let hasWorkStatus = false;
      const audio = { context: null, gain: null, enabled: false, nextAt: 0, sources: new Set() };

      /**
       * Frame accounting, because a dropped frame is otherwise invisible here.
       *
       * `sequence` is assigned by the runner when it publishes, so a gap counts
       * everything lost upstream of this canvas — the producer socket, the hub's
       * per-viewer backpressure, the Discord proxy. `decodeSkipped` counts what
       * this client itself throws away: a frame still decoding when a newer one
       * lands is abandoned, which is the browser telling us it cannot keep up.
       */
      const stats = { drawn: 0, lostUpstream: 0, decodeSkipped: 0, fps: 0, drawnAtSample: 0 };

      function render(frame) {
        if (frame.sequence <= lastFrameSequence) return;
        if (lastFrameSequence >= 0) stats.lostUpstream += frame.sequence - lastFrameSequence - 1;
        lastFrameSequence = frame.sequence;
        if (canvas.width !== frame.width || canvas.height !== frame.height) {
          canvas.width = frame.width;
          canvas.height = frame.height;
          context.imageSmoothingEnabled = false;
        }
        const image = new Image();
        image.addEventListener("load", () => {
          if (frame.sequence !== lastFrameSequence) {
            stats.decodeSkipped += 1;
            return;
          }
          context.drawImage(image, 0, 0);
          stats.drawn += 1;
          empty.hidden = true;
          showLiveFallback();
          setStatus(liveLabel(), "live");
        });
        image.addEventListener("error", () => setStatus("Frame unavailable", "idle"));
        image.src = `data:image/png;base64,${frame.data}`;
      }

      function stopAudio() {
        for (const source of audio.sources) {
          try {
            source.stop();
          } catch {}
        }
        audio.sources.clear();
        audio.nextAt = 0;
      }

      function renderAudio(packet) {
        if (packet.sequence <= lastAudioSequence) return;
        if (lastAudioSequence >= 0 && packet.sequence !== lastAudioSequence + 1) stopAudio();
        lastAudioSequence = packet.sequence;
        if (!audio.enabled || !audio.context) return;
        const binary = atob(packet.data);
        if (
          binary.length !== packet.byteLength ||
          packet.encoding !== "pcm_s16le" ||
          packet.channels !== 2 ||
          packet.frames * packet.channels * 2 !== binary.length
        ) {
          return;
        }
        soundToggle.textContent = "Sound on";
        const bytes = new Uint8Array(binary.length);
        for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
        const view = new DataView(bytes.buffer);
        const buffer = audio.context.createBuffer(packet.channels, packet.frames, packet.sampleRate);
        for (let frame = 0; frame < packet.frames; frame += 1) {
          for (let channel = 0; channel < packet.channels; channel += 1) {
            buffer.getChannelData(channel)[frame] =
              view.getInt16((frame * packet.channels + channel) * 2, true) / 32768;
          }
        }
        const now = audio.context.currentTime;
        if (audio.nextAt < now - 0.05 || audio.nextAt > now + 0.35) stopAudio();
        const startsAt = Math.max(audio.nextAt, now + 0.06);
        const source = audio.context.createBufferSource();
        source.buffer = buffer;
        source.connect(audio.gain);
        source.addEventListener("ended", () => audio.sources.delete(source));
        audio.sources.add(source);
        source.start(startsAt);
        audio.nextAt = startsAt + buffer.duration;
      }

      soundToggle.addEventListener("click", async () => {
        if (audio.enabled) {
          audio.enabled = false;
          stopAudio();
          soundToggle.textContent = "Enable sound";
          soundToggle.setAttribute("aria-pressed", "false");
          return;
        }
        if (!audio.context) {
          audio.context = new AudioContext();
          audio.gain = audio.context.createGain();
          audio.gain.gain.value = Number(volume.value);
          audio.gain.connect(audio.context.destination);
        }
        await audio.context.resume();
        audio.enabled = true;
        stopAudio();
        soundToggle.textContent = lastAudioSequence >= 0 ? "Sound on" : "Sound ready";
        soundToggle.setAttribute("aria-pressed", "true");
      });

      volume.addEventListener("input", () => {
        if (audio.gain) audio.gain.gain.value = Number(volume.value);
      });

      /** What the status line says while frames are arriving. */
      function liveLabel() {
        const lost = stats.lostUpstream > 0 ? ` · ${stats.lostUpstream} lost` : "";
        const skipped = stats.decodeSkipped > 0 ? ` · ${stats.decodeSkipped} slow` : "";
        return `${stats.fps} fps${lost}${skipped}`;
      }

      // Sampled once a second rather than derived per frame, so the readout
      // cannot itself become the reason a frame misses its slot.
      setInterval(() => {
        stats.fps = stats.drawn - stats.drawnAtSample;
        stats.drawnAtSample = stats.drawn;
        if (status.dataset.tone === "live") setStatus(liveLabel(), "live");
      }, 1000);

      function renderOverlay(overlay) {
        if (overlay.sequence <= lastOverlaySequence) return;
        lastOverlaySequence = overlay.sequence;
        // A v1 producer sends free-form `lines`; show them in the thought slot
        // so a rolling upgrade never blanks the lower third.
        const v1 = Array.isArray(overlay.lines);
        setField(objective, v1 ? null : overlay.objective, "No standing goal yet");
        setField(
          thought,
          v1 ? overlay.lines.join(" — ") : overlay.monologue,
          "Waiting for the next decision.",
        );
        setField(intent, v1 ? null : overlay.intent, "No next move yet");
        setField(effect, v1 ? null : overlay.effect, "Waiting for a result");
        showLiveFallback();
        setStatus(liveLabel(), "live");
      }

      function renderWorkStatus(next) {
        hasWorkStatus = true;
        if (next.phase === "thinking") setWorkStatus("Thinking", "thinking");
        else if (next.phase === "acting") setWorkStatus("Playing", "acting");
      }

      function showLiveFallback() {
        if (!hasWorkStatus) setWorkStatus("Live session", "live");
      }

      function setField(element, value, fallback) {
        const present = typeof value === "string" && value.trim().length > 0;
        element.textContent = present ? value : fallback;
        element.classList.toggle("placeholder", !present);
      }

      function setStatus(label, tone) {
        status.textContent = label;
        status.dataset.tone = tone;
      }

      function setWorkStatus(label, phase) {
        workLabel.textContent = label;
        workStatus.dataset.phase = phase;
      }

      function showEmpty(title, copy) {
        context.clearRect(0, 0, canvas.width, canvas.height);
        emptyTitle.textContent = title;
        emptyCopy.textContent = copy;
        empty.hidden = false;
      }

      function clearOverlay() {
        setField(objective, null, "No standing goal yet");
        setField(thought, null, "Waiting for the next decision.");
        setField(intent, null, "No next move yet");
        setField(effect, null, "Waiting for a result");
      }

      function connect() {
        sessionEnded = false;
        hasWorkStatus = false;
        lastFrameSequence = -1;
        lastOverlaySequence = -1;
        lastAudioSequence = -1;
        stopAudio();
        if (audio.enabled) soundToggle.textContent = "Sound ready";
        setStatus("Connecting", "idle");
        setWorkStatus("Connecting", "waiting");
        // All activity traffic is proxied through discordsays.com; the /.proxy
        // prefix is required or the request is refused as blocked:csp.
        const scheme = location.protocol === "https:" ? "wss" : "ws";
        const socket = new WebSocket(`${scheme}://${location.host}/.proxy/frames`);

        socket.addEventListener("open", () => {
          setStatus("Waiting for session", "idle");
          setWorkStatus("Waiting for session", "waiting");
        });
        socket.addEventListener("message", (event) => {
          let message;
          try {
            message = JSON.parse(event.data);
          } catch {
            return;
          }
          if (message.kind === "frame") render(message.frame);
          else if (message.kind === "audio") renderAudio(message.audio);
          else if (message.kind === "overlay") renderOverlay(message.overlay);
          else if (message.kind === "status") renderWorkStatus(message.status);
          else if (message.kind === "stopped") {
            sessionEnded = true;
            clearOverlay();
            showEmpty("Session ended", "Waiting for Clankie to play again.");
            setStatus("Session ended", "idle");
            setWorkStatus("Session ended", "ended");
            stopAudio();
          }
        });
        socket.addEventListener("close", () => {
          if (!sessionEnded) {
            stopAudio();
            clearOverlay();
            showEmpty("Reconnecting", "The live view will resume automatically.");
            setStatus("Reconnecting", "idle");
            setWorkStatus("Reconnecting", "waiting");
          }
          setTimeout(connect, 1_000);
        });
        socket.addEventListener("error", () => socket.close());
      }

      connect();
    </script>
  </body>
</html>
