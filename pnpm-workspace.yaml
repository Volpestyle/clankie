packages:
  - "apps/*"
  - "integrations/*"
  - "packages/*"

engineStrict: true

# The Minecraft body uses the Paper 1.21.4 conformance tree. Newer chunk
# releases expect 26.1 data absent from this pinned Mineflayer/data baseline.
overrides:
  vec3: workspace:@clankie/vec3@*
  prismarine-chunk: 1.39.0
  prismarine-world: 3.6.3
  prismarine-registry: 1.11.0
  prismarine-block: 1.22.0
  prismarine-item: 1.17.0
  prismarine-physics: 1.10.0
  minecraft-protocol: 1.64.0

allowBuilds:
  better-sqlite3: true
  "@google/genai": false
  esbuild: true
  node-pty: true
  protobufjs: false

catalog:
  typescript: 5.9.3
  vitest: 4.1.10

patchedDependencies:
  "@earendil-works/pi-coding-agent@1.0.0": patches/@earendil-works__pi-coding-agent@1.0.0.patch
  "@earendil-works/pi-tui@1.0.0": patches/@earendil-works__pi-tui@1.0.0.patch

minimumReleaseAgeExclude:
  - "@pokeagents/world-protocol@0.3.1"
